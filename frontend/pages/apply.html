<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply - KenadHR</title><link rel="stylesheet" href="../css/main.css"></head><body><main style="max-width:700px;margin:50px auto;padding:24px"><h1>Submit your application</h1><p style="color:var(--text-secondary)">Choose an open role and upload your CV and supporting documents.</p><form id="application-form"><div class="form-grid"><div class="form-group"><label class="form-label required">Full name</label><input name="full_name" required class="form-control"></div><div class="form-group"><label class="form-label required">Email</label><input name="email" type="email" required class="form-control"></div><div class="form-group"><label class="form-label">Phone</label><input name="phone" class="form-control"></div><div class="form-group"><label class="form-label">Open role</label><select name="requisition_id" id="role" class="form-control"><option value="">General application</option></select></div><div class="form-group span-2"><label class="form-label">Cover note</label><textarea name="cover_note" class="form-control" rows="4"></textarea></div><div class="form-group span-2"><label class="form-label required">CV and supporting documents</label><input name="documents" type="file" multiple required accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" class="form-control"><small style="color:var(--text-muted)">Up to 5 PDF, Word, JPG, or PNG files.</small></div></div><button class="btn btn-primary" type="submit">Submit application</button></form><p id="result" style="margin-top:16px"></p></main><script>const slug=new URLSearchParams(location.search).get('company'),form=document.getElementById('application-form'),result=document.getElementById('result');async function jobs(){if(!slug)return;const rows=await fetch('/api/recruitment/public/'+encodeURIComponent(slug)+'/jobs').then(r=>r.json());role.innerHTML+="";rows.forEach(j=>role.insertAdjacentHTML('beforeend',`<option value="${j.id}">${j.title}${j.location?' — '+j.location:''}</option>`))}form.onsubmit=async e=>{e.preventDefault();if(!slug){result.textContent='This application link is invalid.';return}try{const r=await fetch('/api/recruitment/public/'+encodeURIComponent(slug)+'/apply',{method:'POST',body:new FormData(form)}),d=await r.json();if(!r.ok)throw Error(d.error);form.reset();result.textContent='Thank you. Your application has been submitted.'}catch(err){result.textContent=err.message||'Could not submit application.'}};jobs().catch(()=>{});</script></body></html>

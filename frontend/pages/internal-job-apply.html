<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply Internally - KenadHR</title><link rel="stylesheet" href="../css/main.css"><style>.internal-apply-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;max-width:1080px}.job-summary{padding:20px;border:1px solid var(--border);border-radius:10px;background:var(--bg-page);align-self:start}.job-summary h2{margin-top:0}.job-summary p{color:var(--text-secondary);line-height:1.55;white-space:pre-wrap}.job-summary-meta{display:grid;gap:8px;margin:15px 0;color:var(--text-secondary);font-size:.85rem}@media(max-width:780px){.internal-apply-layout{grid-template-columns:1fr}}</style></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Apply internally</div></header><main class="main-content"><div class="page-header"><div><h1>Apply internally</h1><p>Your profile details are included automatically.</p></div><a class="btn btn-outline" href="internal-jobs.html">Back to internal jobs</a></div><div class="internal-apply-layout"><section class="card"><div class="card-header"><div><h2 id="job-title">Loading job…</h2><p id="job-context">Review the role before applying.</p></div></div><div class="card-body"><form id="internal-application-form"><input id="requisition-id" type="hidden"><div class="form-group"><label class="form-label" for="cover-note">Why are you interested in this role?</label><textarea id="cover-note" class="form-control" rows="7" placeholder="Tell the recruitment team why you are a good fit."></textarea></div><div class="form-group"><label class="form-label" for="application-documents">Supporting documents <span style="font-weight:400">(optional)</span></label><input id="application-documents" name="documents" type="file" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" class="form-control"><small style="color:var(--text-secondary)">You may attach a CV or other supporting documents.</small></div><div class="modal-footer" style="padding:20px 0 0"><a class="btn btn-outline" href="internal-jobs.html">Cancel</a><button class="btn btn-primary" id="submit-application" type="submit">Submit application</button></div></form></div></section><aside class="job-summary"><h2>Role summary</h2><div class="job-summary-meta" id="job-meta"></div><p id="job-description">Loading…</p></aside></div></main></div><script src="../js/api.js"></script><script src="../js/internal-job-apply-page.js"></script></body></html>

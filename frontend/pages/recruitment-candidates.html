<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recruitment Candidates - KenadHR</title><link rel="stylesheet" href="../css/main.css"><style>.candidate-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}.candidate-stat{padding:15px;border:1px solid var(--border);border-radius:10px;background:var(--bg-surface)}.candidate-stat span{display:block;color:var(--text-secondary);font-size:.8rem}.candidate-stat strong{display:block;margin-top:5px;font-size:1.3rem}@media(max-width:700px){.candidate-summary{grid-template-columns:1fr}}</style></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Recruitment candidates</div></header><main class="main-content"><div class="page-header"><div><h1 id="page-title">Candidates</h1><p id="page-copy">Review candidates attached to this recruitment.</p></div><button class="btn btn-outline" type="button" onclick="returnToRecruitment()">Back to recruitment</button></div><section class="candidate-summary"><article class="candidate-stat"><span>Total candidates</span><strong id="total-candidates">0</strong></article><article class="candidate-stat"><span>In progress</span><strong id="in-progress-candidates">0</strong></article><article class="candidate-stat"><span>Selected</span><strong id="selected-candidates">0</strong></article></section><div class="table-container"><table><thead><tr><th>Candidate</th><th>Stage</th><th>Rating</th><th>Applied</th><th></th></tr></thead><tbody id="candidate-rows"></tbody></table></div></main></div><script src="../js/api.js"></script><script src="../js/recruitment-candidates-page.js"></script></body></html>

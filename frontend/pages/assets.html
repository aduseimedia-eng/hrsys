<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Company Assets - KenadHR</title>
    <link rel="stylesheet" href="../css/main.css" />
    <style>
      .asset-modal{max-height:none;overflow:visible}.asset-modal .modal-body{overflow:visible}@media(max-width:640px){.asset-modal{max-height:90vh;overflow:hidden}.asset-modal .modal-body{overflow:auto}}
      .asset-stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 22px;
      }
      .asset-stat {
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fff;
      }
      .asset-stat span {
        display: block;
        color: var(--text-muted);
        font-size: 0.78rem;
      }
      .asset-stat strong {
        display: block;
        margin-top: 5px;
        font-size: 1.35rem;
      }
      @media (max-width: 700px) {
        .asset-stats {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <header class="topbar">
        <div class="topbar-title">Company Assets</div>
      </header>
      <main class="main-content">
        <div class="page-header">
          <div>
            <h1>Company Assets</h1>
            <p>Track company equipment, asset IDs, and employee assignments.</p>
          </div>
          <button class="btn btn-primary" onclick="openAsset()">
            Add asset
          </button>
        </div>
        <div class="asset-stats">
          <div class="asset-stat">
            <span>Total assets</span><strong id="total">0</strong>
          </div>
          <div class="asset-stat">
            <span>Assigned to staff</span><strong id="assigned">0</strong>
          </div>
          <div class="asset-stat">
            <span>Available</span><strong id="available">0</strong>
          </div>
          <div class="asset-stat">
            <span>Need attention</span><strong id="attention">0</strong>
          </div>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Asset</th>
                <th>Asset ID / serial no.</th>
                <th>Category</th>
                <th>Assigned employee</th>
                <th>Condition</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </main>
    </div>
    <div id="asset-modal" class="modal-overlay" style="display: none">
      <div class="modal modal-lg asset-modal">
        <div class="modal-header">
          <h3 id="asset-title">Add asset</h3>
          <button class="modal-close" onclick="closeAsset()">x</button>
        </div>
        <div class="modal-body">
          <input id="asset-id" type="hidden" />
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label required">Asset ID / tag</label
              ><input
                id="asset-code"
                class="form-control"
                placeholder="e.g. KHR-LAP-001"
              />
            </div>
            <div class="form-group">
              <label class="form-label required">Asset name</label
              ><input
                id="asset-name"
                class="form-control"
                placeholder="e.g. Dell Latitude 5440"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Category</label
              ><select id="asset-category" class="form-control form-select">
                <option value="computer">Computer / laptop</option>
                <option value="phone">Phone / tablet</option>
                <option value="furniture">Furniture</option>
                <option value="vehicle">Vehicle</option>
                <option value="equipment">Equipment</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Serial number</label
              ><input id="asset-serial" class="form-control" />
            </div>
            <div class="form-group">
              <label class="form-label">Status</label
              ><select
                id="asset-status"
                class="form-control form-select"
                onchange="toggleAssignment()"
              >
                <option value="available">Available</option>
                <option value="assigned">Assigned</option>
                <option value="maintenance">Maintenance</option>
                <option value="retired">Retired</option>
                <option value="lost">Lost</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Condition</label
              ><select id="asset-condition" class="form-control form-select">
                <option value="new">New</option>
                <option value="good">Good</option>
                <option value="fair">Fair</option>
                <option value="poor">Poor</option>
              </select>
            </div>
            <div class="form-group" id="employee-group">
              <label class="form-label">Assigned employee</label
              ><select
                id="asset-employee"
                class="form-control form-select"
              ></select>
            </div>
            <div class="form-group" id="assigned-date-group">
              <label class="form-label">Assignment date</label
              ><input
                id="asset-assigned-date"
                type="date"
                class="form-control"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Purchase date</label
              ><input
                id="asset-purchase-date"
                type="date"
                class="form-control"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Purchase cost (GHS)</label
              ><input
                id="asset-cost"
                type="number"
                min="0"
                step="0.01"
                class="form-control"
              />
            </div>
            <div class="form-group span-2">
              <label class="form-label">Notes</label
              ><textarea
                id="asset-notes"
                rows="3"
                class="form-control"
              ></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="closeAsset()">Cancel</button
          ><button class="btn btn-primary" onclick="saveAsset()">
            Save asset
          </button>
        </div>
      </div>
    </div>
    <script src="../js/api.js"></script>
    <script>
      const user = requireAuth();
      if (!user) throw Error("redirect");
      if (!["admin", "manager"].includes(user.role))
        location.href = appUrl("/pages/dashboard.html");
      buildSidebar("assets");
      loadNotifCount();
      let assets = [],
        employees = [];
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const title = (v) =>
        String(v || "")
          .replace(/_/g, " ")
          .replace(/\b\w/g, (x) => x.toUpperCase());
      function closeAsset() {
        document.getElementById("asset-modal").style.display = "none";
        window.dispatchEvent(new Event("hrconnect:request-page-height"));
      }
      function toggleAssignment() {
        const show =
          document.getElementById("asset-status").value === "assigned";
        document.getElementById("employee-group").style.display = show
          ? ""
          : "none";
        document.getElementById("assigned-date-group").style.display = show
          ? ""
          : "none";
      }
      async function load() {
        [assets, employees] = await Promise.all([
          api.get("/assets"),
          api.get("/employees?limit=1000").then((r) => r.employees),
        ]);
        document.getElementById("total").textContent = assets.length;
        document.getElementById("assigned").textContent = assets.filter(
          (x) => x.status === "assigned",
        ).length;
        document.getElementById("available").textContent = assets.filter(
          (x) => x.status === "available",
        ).length;
        document.getElementById("attention").textContent = assets.filter(
          (x) =>
            ["maintenance", "lost"].includes(x.status) ||
            x.condition === "poor",
        ).length;
        document.getElementById("rows").innerHTML = assets.length
          ? assets
              .map(
                (a) =>
                  `<tr><td><strong>${esc(a.name)}</strong>${a.notes ? `<br><small>${esc(a.notes)}</small>` : ""}</td><td><strong>${esc(a.asset_code)}</strong><br><small>${esc(a.serial_number || "-")}</small></td><td>${title(a.category)}</td><td>${a.employee_name ? `${esc(a.employee_name)}<br><small>${esc(a.employee_code || "")}</small>` : "-"}</td><td>${fmt.statusBadge(a.condition)}</td><td>${fmt.statusBadge(a.status)}</td><td><button class="btn btn-outline btn-sm" onclick="openAsset(${a.id})">Edit</button></td></tr>`,
              )
              .join("")
          : '<tr><td colspan="7"><div class="empty-state"><p>No company assets yet.</p></div></td></tr>';
      }
      function openAsset(id) {
        const a = id ? assets.find((x) => x.id === id) : null;
        document.getElementById("asset-title").textContent = a
          ? "Edit asset"
          : "Add asset";
        [
          "asset-id",
          "asset-code",
          "asset-name",
          "asset-serial",
          "asset-assigned-date",
          "asset-purchase-date",
          "asset-cost",
          "asset-notes",
        ].forEach((x) => (document.getElementById(x).value = ""));
        document.getElementById("asset-id").value = a?.id || "";
        document.getElementById("asset-code").value = a?.asset_code || "";
        document.getElementById("asset-name").value = a?.name || "";
        document.getElementById("asset-category").value =
          a?.category || "other";
        document.getElementById("asset-serial").value = a?.serial_number || "";
        document.getElementById("asset-status").value =
          a?.status || "available";
        document.getElementById("asset-condition").value =
          a?.condition || "good";
        document.getElementById("asset-employee").innerHTML =
          '<option value="">Choose employee</option>' +
          employees
            .map(
              (e) =>
                `<option value="${e.id}" ${a?.assigned_to === e.id ? "selected" : ""}>${esc(e.first_name + " " + e.last_name)}</option>`,
            )
            .join("");
        document.getElementById("asset-assigned-date").value =
          a?.assigned_at || "";
        document.getElementById("asset-purchase-date").value =
          a?.purchase_date || "";
        document.getElementById("asset-cost").value = a?.purchase_cost ?? "";
        document.getElementById("asset-notes").value = a?.notes || "";
        toggleAssignment();
        document.getElementById("asset-modal").style.display = "flex";
        window.dispatchEvent(new Event("hrconnect:request-page-height"));
      }
      async function saveAsset() {
        try {
          const id = document.getElementById("asset-id").value,
            body = {
              asset_code: document.getElementById("asset-code").value,
              name: document.getElementById("asset-name").value,
              category: document.getElementById("asset-category").value,
              serial_number: document.getElementById("asset-serial").value,
              status: document.getElementById("asset-status").value,
              condition: document.getElementById("asset-condition").value,
              assigned_to: document.getElementById("asset-employee").value,
              assigned_at: document.getElementById("asset-assigned-date").value,
              purchase_date: document.getElementById("asset-purchase-date")
                .value,
              purchase_cost: document.getElementById("asset-cost").value,
              notes: document.getElementById("asset-notes").value,
            };
          if (id) await api.put("/assets/" + id, body);
          else await api.post("/assets", body);
          closeAsset();
          toast("Asset saved", "success");
          load();
        } catch (e) {
          toast(e.message || "Could not save asset", "error");
        }
      }
      load().catch((e) => toast(e.message, "error"));
    </script>
  </body>
</html>

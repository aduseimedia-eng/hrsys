<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace - KenadHR</title>
    <link rel="stylesheet" href="../css/main.css" />
    <style>
      body {
        background: #f6f8fc;
      }
      .hub-hero {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        padding: 28px 30px;
        margin-bottom: 24px;
        border-radius: 18px;
        color: #fff;
        background: linear-gradient(
          135deg,
          #123b7a 0%,
          #1d5fc1 58%,
          #5b8dea 100%
        );
        box-shadow: 0 14px 30px rgba(23, 79, 174, 0.18);
      }
      .hub-eyebrow {
        margin: 0 0 8px;
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.68);
      }
      .hub-hero h1 {
        margin: 0;
        color: #fff;
      }
      .hub-hero p {
        max-width: 620px;
        margin: 8px 0 0;
        color: rgba(255, 255, 255, 0.84);
      }
      .hub-count {
        flex: 0 0 auto;
        min-width: 88px;
        padding: 12px 16px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 12px;
        text-align: center;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(4px);
      }
      .hub-count strong {
        display: block;
        font-size: 1.3rem;
      }
      .hub-count span {
        font-size: 0.73rem;
        color: rgba(255, 255, 255, 0.76);
      }
      .hub-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
        gap: 18px;
      }
      .hub-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        min-height: 188px;
        padding: 20px;
        border: 1px solid #e2e8f4;
        border-radius: 15px;
        box-shadow: 0 5px 16px rgba(20, 50, 100, 0.05);
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          border-color 0.18s ease;
      }
      .hub-card:hover {
        transform: translateY(-3px);
        border-color: #b8cdf3;
        box-shadow: 0 12px 24px rgba(20, 50, 100, 0.1);
      }
      .hub-card-top {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .hub-icon {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        color: #174fae;
        border-radius: 12px;
        background: #eaf1ff;
      }
      .hub-icon svg {
        width: 22px;
        height: 22px;
      }
      .hub-label {
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #71809b;
      }
      .hub-card h3 {
        margin: 0;
        font-size: 1.05rem;
      }
      .hub-card:nth-child(3n + 2) .hub-icon {
        color: #7a3dc7;
        background: #f3eaff;
      }
      .hub-card:nth-child(3n) .hub-icon {
        color: #0f8667;
        background: #e5f8f2;
      }
      .hub-card:nth-child(4n) .hub-icon {
        color: #bc6410;
        background: #fff1dc;
      }
      .hub-card p {
        color: var(--text-muted);
        margin: 8px 0 20px;
        line-height: 1.5;
      }
      .hub-card .btn {
        margin-top: auto;
      }
      @media (max-width: 650px) {
        .hub-hero {
          align-items: flex-start;
          flex-direction: column;
          padding: 24px;
        }
        .hub-count {
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <header class="topbar">
        <div class="topbar-title" id="hub-title">Workspace</div>
      </header>
      <main class="main-content">
        <section class="hub-hero">
          <div>
            <div class="hub-eyebrow">KenadHR workspace</div>
            <h1 id="hub-heading">Workspace</h1>
            <p id="hub-description"></p>
          </div>
          <div class="hub-count">
            <strong id="hub-count">0</strong><span>tools available</span>
          </div>
        </section>
        <div class="hub-grid" id="hub-grid"></div>
      </main>
    </div>
    <script src="../js/api.js"></script>
    <script>
      const user = requireAuth();
      if (!user) throw Error("redirect");
      const hub = new URLSearchParams(location.search).get("hub") || "people";
      const hubs = {
        people: {
          title: "People",
          description:
            "Manage your people structure, recruitment, and onboarding.",
          cards: [
            [
              "employees",
              "Employees",
              "Manage employee records and profiles.",
              ["admin", "manager"],
            ],
            [
              "departments",
              "Departments",
              "Set up departments and teams.",
              ["admin"],
            ],
            [
              "orgchart",
              "Organization chart",
              "View reporting relationships.",
              ["admin", "manager"],
            ],
            [
              "hiring",
              "Hiring & ATS",
              "Track vacancies and candidates.",
              ["admin", "manager"],
            ],
            [
              "onboarding",
              "Onboarding",
              "Guide new hires through onboarding.",
              ["admin", "manager"],
            ],
          ],
        },
        work: {
          title: "Work",
          description: "Manage daily work, schedules, time, and requests.",
          cards: [
            [
              "attendance",
              "Attendance",
              "Review time and attendance records.",
              ["admin"],
            ],
            [
              "leave",
              "Leave",
              "Review and manage leave requests.",
              ["admin", "manager"],
            ],
            [
              "calendar",
              "Calendar",
              "View company events and schedules.",
              ["admin", "manager"],
            ],
            [
              "todos",
              "To Do List",
              "Track team tasks and follow-ups.",
              ["admin", "manager"],
            ],
            [
              "tickets",
              "Tickets",
              "Manage employee support requests.",
              ["admin", "manager"],
            ],
            [
              "messages",
              "Messages",
              "Communicate with your team.",
              ["admin", "manager"],
            ],
          ],
        },
        records: {
          title: "Growth & Records",
          description:
            "Keep employee development, documentation, and lifecycle records together.",
          cards: [
            [
              "performance",
              "Performance reviews",
              "Run and review performance evaluations.",
              ["admin", "manager"],
            ],
            [
              "training",
              "Training register",
              "Record employee training activity.",
              ["admin", "manager"],
            ],
            [
              "probation",
              "Probation tracker",
              "Track probation milestones.",
              ["admin", "manager"],
            ],
            [
              "contracts",
              "Contract expiry",
              "Monitor upcoming contract expiry dates.",
              ["admin", "manager"],
            ],
            [
              "documents",
              "Documents",
              "Store and manage company documents.",
              ["admin", "manager"],
            ],
            [
              "benefits",
              "Benefits",
              "Manage benefits and enrolment.",
              ["admin", "manager"],
            ],
          ],
        },
        finance: {
          title: "Finance",
          description:
            "Manage payroll, financial transactions, bills, and employee loans.",
          cards: [
            [
              "payroll",
              "Payroll",
              "Process payroll and payslips.",
              ["admin", "manager"],
            ],
            [
              "financials",
              "Financials",
              "Record transactions, bills, and employee loans.",
              ["admin"],
            ],
          ],
        },
        administration: {
          title: "Administration",
          description:
            "Configure HR operations, reports, company resources, and settings.",
          cards: [
            [
              "reports",
              "Reports & workflows",
              "Review HR reports and workflows.",
              ["admin", "manager"],
            ],
            [
              "assets",
              "Company assets",
              "Manage company asset registers.",
              ["admin", "manager"],
            ],
            [
              "disciplinary",
              "Disciplinary register",
              "Record disciplinary cases.",
              ["admin", "manager"],
            ],
          ],
        },
      };
      const config = hubs[hub] || hubs.people;
      const iconFor = {
        employees: usersIcon,
        departments: orgIcon,
        orgchart: orgIcon,
        hiring: briefcaseIcon,
        onboarding: checkIcon,
        attendance: clockIcon,
        leave: calendarIcon,
        calendar: calendarIcon,
        todos: checkIcon,
        tickets: chatIcon,
        messages: chatIcon,
        performance: starIcon,
        training: checkIcon,
        probation: clockIcon,
        contracts: docIcon,
        documents: docIcon,
        benefits: docIcon,
        payroll: walletIcon,
        financials: chartIcon,
        reports: chartIcon,
        assets: briefcaseIcon,
        operations: briefcaseIcon,
        disciplinary: docIcon,
        settings: settingsIcon,
      };
      const availableCards = config.cards.filter(([, , , roles]) =>
        roles.includes(user.role),
      );
      document.title = `${config.title} - KenadHR`;
      document.getElementById("hub-title").textContent = config.title;
      document.getElementById("hub-heading").textContent = config.title;
      document.getElementById("hub-description").textContent =
        config.description;
      document.getElementById("hub-count").textContent = availableCards.length;
      buildSidebar(hub);
      loadNotifCount();
      document.getElementById("hub-grid").innerHTML = availableCards
        .map(
          ([page, title, description]) =>
            `<article class="card hub-card"><div class="hub-card-top"><span class="hub-icon">${(iconFor[page] || docIcon)()}</span><span class="hub-label">Workspace tool</span></div><h3>${title}</h3><p>${description}</p><button class="btn btn-outline btn-sm" type="button" onclick="goTo('${page}')">Open tool</button></article>`,
        )
        .join("");
      function goTo(page) {
        const destination = adminWorkspaceUrl(page);
        if (window.top !== window.self) window.top.location.assign(destination);
        else location.assign(destination);
      }
    </script>
  </body>
</html>

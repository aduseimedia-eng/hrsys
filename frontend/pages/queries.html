<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Queries - KenadHR</title><link rel="stylesheet" href="../css/main.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Employee Queries</div></header><main class="main-content"><div class="page-header"><div><h1 id="page-title">Employee Queries</h1><p id="page-intro">Send a private question to HR or an Admin Officer.</p></div></div><section class="card" id="submit-panel"><div class="card-header"><h3>Submit a query</h3></div><div class="card-body"><div class="form-grid"><div class="form-group"><label class="form-label">Category</label><select id="query-category" class="form-control form-select"><option value="general">General HR</option><option value="payroll">Payroll</option><option value="leave">Leave</option><option value="benefits">Benefits</option><option value="employment">Employment</option></select></div><div class="form-group"><label class="form-label required">Subject</label><input id="query-subject" maxlength="180" class="form-control"></div><div class="form-group span-2"><label class="form-label required">Your query</label><textarea id="query-description" rows="4" class="form-control" placeholder="Describe what you need help with."></textarea></div></div><div style="margin-top:14px"><button class="btn btn-primary" onclick="submitQuery()">Send to HR</button></div></div></section><section class="card" style="margin-top:18px"><div class="card-header"><h3 id="list-title">My Queries</h3></div><div class="card-body"><div class="filters-bar" id="queue-filter" style="display:none"><select id="query-status" class="form-control form-select" onchange="loadQueries()"><option value="">All statuses</option><option value="open">Open</option><option value="in_progress">In progress</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select></div><div class="table-container"><table><thead id="query-head"></thead><tbody id="query-body"></tbody></table></div></div></section></main></div><div id="response-modal" class="modal-overlay" style="display:none"><div class="modal"><div class="modal-header"><h3>Respond to query</h3><button class="modal-close" onclick="closeResponse()">x</button></div><div class="modal-body"><input type="hidden" id="response-id"><div class="form-group"><label class="form-label">Status</label><select id="response-status" class="form-control form-select"><option value="open">Open</option><option value="in_progress">In progress</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select></div><div class="form-group"><label class="form-label">Response</label><textarea id="response-text" rows="5" class="form-control"></textarea></div></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeResponse()">Cancel</button><button class="btn btn-primary" onclick="saveResponse()">Save response</button></div></div></div><script src="../js/api.js"></script><script>const user=requireAuth();if(!user)throw Error('redirect');buildSidebar('queries');loadNotifCount();let canManage=false,queries=[];const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const label=v=>String(v||'general').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());async function init(){const access=await api.get('/queries/access');canManage=access.can_manage;if(canManage){document.getElementById('submit-panel').style.display='none';document.getElementById('page-title').textContent='Employee Query Queue';document.getElementById('page-intro').textContent='Review and respond to confidential staff questions.';document.getElementById('list-title').textContent='Queries submitted by staff';document.getElementById('queue-filter').style.display='flex';}await loadQueries()}async function loadQueries(){queries=canManage?await api.get(`/queries/queue${document.getElementById('query-status').value?`?status=${document.getElementById('query-status').value}`:''}`):await api.get('/queries/mine');render()}function render(){document.getElementById('query-head').innerHTML=canManage?'<tr><th>Employee</th><th>Query</th><th>Status</th><th>Submitted</th><th></th></tr>':'<tr><th>Query</th><th>Status</th><th>Submitted</th><th>HR response</th></tr>';document.getElementById('query-body').innerHTML=queries.length?queries.map(q=>canManage?`<tr><td>${safe(q.employee_name)}<br><small>${safe(q.job_title||'')}</small></td><td><strong>${safe(q.subject)}</strong><br><small>${safe(label(q.category))}</small><p>${safe(q.description)}</p>${q.response?`<p><strong>Response:</strong> ${safe(q.response)}</p>`:''}</td><td>${fmt.statusBadge(q.status)}</td><td>${fmt.datetime(q.created_at)}</td><td><button class="btn btn-outline btn-sm" onclick="openResponse(${q.id})">Respond</button></td></tr>`:`<tr><td><strong>${safe(q.subject)}</strong><br><small>${safe(label(q.category))}</small><p>${safe(q.description)}</p></td><td>${fmt.statusBadge(q.status)}</td><td>${fmt.datetime(q.created_at)}</td><td>${q.response?safe(q.response):'<span style="color:var(--text-muted)">Awaiting HR response</span>'}</td></tr>`).join(''):`<tr><td colspan="${canManage?5:4}"><div class="empty-state"><p>No employee queries found.</p></div></td></tr>`}async function submitQuery(){try{await api.post('/queries',{category:document.getElementById('query-category').value,subject:document.getElementById('query-subject').value,description:document.getElementById('query-description').value});document.getElementById('query-subject').value='';document.getElementById('query-description').value='';toast('Your query has been sent to HR','success');loadQueries()}catch(e){toast(e.message,'error')}}function openResponse(id){const q=queries.find(x=>x.id===id);document.getElementById('response-id').value=id;document.getElementById('response-status').value=q.status;document.getElementById('response-text').value=q.response||'';document.getElementById('response-modal').style.display='flex'}function closeResponse(){document.getElementById('response-modal').style.display='none'}async function saveResponse(){try{await api.patch(`/queries/${document.getElementById('response-id').value}`,{status:document.getElementById('response-status').value,response:document.getElementById('response-text').value});closeResponse();toast('Query updated','success');loadQueries()}catch(e){toast(e.message,'error')}}init().catch(e=>toast(e.message,'error'));</script></body></html>

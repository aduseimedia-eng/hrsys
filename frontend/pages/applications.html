<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Applications - KenadHR</title><link rel="stylesheet" href="../css/main.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Applications</div></header><main class="main-content"><div class="page-header"><div><h1 id="applications-title">Applications</h1><p id="applications-copy">Review every candidate in the recruitment workflow.</p></div><a class="btn btn-outline" href="recruitment.html">Back to recruitment</a></div><div class="table-container"><table><thead><tr><th>Applicant</th><th>Recruitment</th><th>Applied</th><th>Stage</th><th></th></tr></thead><tbody id="apps"></tbody></table></div></main></div><script src="../js/api.js"></script><script>
const user=requireAuth();if(!user)throw Error('redirect');buildSidebar('recruitment');const selectedStage=new URLSearchParams(location.search).get('stage'),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
async function load(){const [allApplications,stages]=await Promise.all([api.get('/recruitment/applications'),api.get('/recruitment/stages')]);const names=Object.fromEntries(stages.map(stage=>[stage.stage_key,stage.name]));const applications=selectedStage?allApplications.filter(application=>application.status===selectedStage):allApplications;if(selectedStage){document.getElementById('applications-title').textContent=names[selectedStage]||'Applications';document.getElementById('applications-copy').textContent='Candidates currently in this recruitment stage.';}document.getElementById('apps').innerHTML=applications.length?applications.map(application=>`<tr><td><strong>${esc(application.full_name)}</strong><br><small>${esc(application.email)}</small></td><td>${esc(application.requisition_title||application.role_applied||'—')}</td><td>${fmt.date(application.submitted_at)}</td><td>${esc(names[application.status]||application.status)}</td><td><a class="btn btn-outline btn-sm" href="candidate.html?id=${application.id}">Open profile</a></td></tr>`).join(''):'<tr><td colspan="5">No applications in this stage.</td></tr>'}load().catch(error=>toast(error.message,'error'));
</script></body></html>

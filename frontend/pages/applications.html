<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidate Applications - KenadHR</title><link rel="stylesheet" href="../css/main.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Candidate Applications</div></header><main class="main-content"><div class="page-header"><div><h1>Candidate Applications</h1><p>Review candidates and open a profile to collaborate with your team.</p></div><a class="btn btn-outline" href="hiring.html">Hiring dashboard</a></div><div class="table-container"><table><thead><tr><th>Applicant</th><th>Role</th><th>Submitted</th><th>Stage</th><th></th></tr></thead><tbody id="apps"></tbody></table></div></main></div><script src="../js/api.js"></script><script>const user=requireAuth();if(!user)throw Error('redirect');buildSidebar('hiring');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const apps=await api.get('/recruitment/applications');document.getElementById('apps').innerHTML=apps.length?apps.map(a=>`<tr><td><strong>${esc(a.full_name)}</strong><br><small>${esc(a.email)}</small></td><td>${esc(a.requisition_title||a.role_applied||'—')}</td><td>${fmt.date(a.submitted_at)}</td><td>${esc(a.status)}</td><td><a class="btn btn-outline btn-sm" href="candidate.html?id=${a.id}">Open profile</a></td></tr>`).join(''):'<tr><td colspan="5">No applications yet.</td></tr>'}load().catch(e=>toast(e.message,'error'));</script></body></html>

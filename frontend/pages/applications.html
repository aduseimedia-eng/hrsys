<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidate Applications - KenadHR</title><link rel="stylesheet" href="../css/main.css"></head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Candidate Applications</div></header><main class="main-content"><div class="page-header"><div><h1>Candidate Applications</h1><p>Review submitted CVs and supporting documents.</p></div><button class="btn btn-outline" onclick="copyLink()">Copy application link</button></div><div class="table-container"><table><thead><tr><th>Applicant</th><th>Role</th><th>Documents</th><th>Submitted</th><th>Status</th></tr></thead><tbody id="apps"></tbody></table></div></main></div>
<script src="../js/api.js"></script><script>
const user=requireAuth();if(!user)throw Error('redirect');buildSidebar('hiring');let applicationLink='';
const escapeHtml=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
async function load(){const [apps,link]=await Promise.all([api.get('/recruitment/applications'),api.get('/recruitment/application-link')]);applicationLink=`${location.origin}/pages/apply.html?company=${encodeURIComponent(link.slug)}`;document.getElementById('apps').innerHTML=apps.length?apps.map(a=>`<tr><td><strong>${escapeHtml(a.full_name)}</strong><br><small>${escapeHtml(a.email)}</small></td><td>${escapeHtml(a.role_applied||'—')}</td><td>${a.documents.map(d=>`<button class="btn btn-sm btn-outline" onclick="downloadDocument(${a.id},${d.id})">${escapeHtml(d.name)}</button>`).join(' ')}</td><td>${fmt.date(a.submitted_at)}</td><td><select class="form-control form-select" onchange="updateStatus(${a.id},this.value)">${['submitted','reviewing','shortlisted','rejected'].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join(''):'<tr><td colspan="5">No applications yet.</td></tr>'}
async function updateStatus(id,status){await api.patch(`/recruitment/applications/${id}`,{status});toast('Status updated','success')}
async function downloadDocument(applicationId,documentId){const response=await fetch(`${API_BASE}/recruitment/applications/${applicationId}/documents/${documentId}`,{headers:{Authorization:`Bearer ${localStorage.getItem('token')}`}});if(!response.ok)throw Error('Could not download document');const url=URL.createObjectURL(await response.blob()),link=document.createElement('a');link.href=url;link.download='application-document';link.click();URL.revokeObjectURL(url)}
async function copyLink(){await navigator.clipboard.writeText(applicationLink);toast('Application link copied','success')}
load().catch(e=>toast(e.message,'error'));
</script></body></html>

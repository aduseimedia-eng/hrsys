<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2865d9">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/jpeg" href="/assets/title_icon.jpg">
  <link rel="apple-touch-icon" href="/assets/title_icon.jpg">
  <title>KenadHR Workspace</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body {
      overflow: hidden;
    }

    .workspace-shell {
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
    }

    .workspace-content {
      position: relative;
      padding: 0;
      min-height: calc(100vh - var(--topbar-h));
      overflow: hidden;
      background: var(--bg-page);
    }

    .workspace-frame {
      width: 100%;
      height: calc(100vh - var(--topbar-h));
      border: 0;
      display: block;
      background: var(--bg-page);
      transition: opacity 120ms ease;
    }

    /* Keep the iframe in the layout while a route is loading. Replacing it with
       the loader caused the workspace to visibly jump on a hard refresh. */
    .workspace-frame.hidden {
      display: block !important;
      visibility: hidden;
      opacity: 0;
    }

    .workspace-loading {
      position: absolute;
      inset: 0;
      z-index: 1;
      min-height: calc(100vh - var(--topbar-h));
      display: grid;
      place-items: center;
      background: var(--bg-page);
      color: var(--text-muted);
      font-size: .9rem;
    }

    .topbar .icon-btn .dot {
      min-width: 16px;
      width: auto;
      height: 16px;
      padding: 0 4px;
      top: 3px;
      right: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: .62rem;
      font-weight: 800;
      line-height: 1;
    }
  </style>
</head>
<body>
<div class="app-shell workspace-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <header class="topbar">
    <div class="topbar-title" id="workspace-title">Dashboard</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="notif-btn" title="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="dot hidden" id="notif-badge"></span>
      </button>
    </div>
  </header>

  <main class="main-content workspace-content">
    <div class="workspace-loading" id="workspace-loading">Loading workspace...</div>
    <iframe class="workspace-frame hidden" id="workspace-frame" title="KenadHR page"></iframe>
  </main>
</div>

<script src="../js/api.js"></script>
<script>
const workspaceUser = requireAuth();
if (!workspaceUser) throw new Error('redirect');

const WORKSPACE_DEFAULT = 'dashboard';
const WORKSPACE_PAGES = {
  dashboard: { title: 'Dashboard', nav: 'dashboard' },
  announcements: { title: 'Announcements', nav: 'announcements' },
  attendance: { title: 'Attendance', nav: 'attendance' },
  leave: { title: 'Leave Management', nav: 'leave' },
  calendar: { title: 'Company Calendar', nav: 'calendar' },
  payroll: { title: 'Payroll', nav: 'payroll' },
  people: { title: 'People', nav: 'people', src: '/pages/hub.html?hub=people' },
  work: { title: 'Work', nav: 'work', src: '/pages/hub.html?hub=work' },
  records: { title: 'Growth & Records', nav: 'records', src: '/pages/hub.html?hub=records' },
  finance: { title: 'Finance', nav: 'finance', src: '/pages/hub.html?hub=finance' },
  administration: { title: 'Administration', nav: 'administration', src: '/pages/hub.html?hub=administration' },
  financials: { title: 'Financials', nav: 'financials' },
  audit: { title: 'Audit History', nav: 'audit' },
  assets: { title: 'Company Assets', nav: 'assets' },
  benefits: { title: 'Benefits', nav: 'benefits' },
  loans: { title: 'Employee Loans', nav: 'loans' },
  todos: { title: 'To Do List', nav: 'todos' },
  tickets: { title: 'Tickets', nav: 'tickets' },
  messages: { title: 'Messages', nav: 'messages' },
  documents: { title: 'Documents', nav: 'documents' },
  performance: { title: 'Performance Reviews', nav: 'performance' },
  training: { title: 'Training Register', nav: 'training' },
  probation: { title: 'Probation Tracker', nav: 'probation' },
  disciplinary: { title: 'Disciplinary Register', nav: 'disciplinary' },
  operations: { title: 'Operations Registers', nav: 'operations' },
  contracts: { title: 'Contract Expiry Tracker', nav: 'contracts' },
  hiring: { title: 'Recruitment', nav: 'recruitment', src: '/pages/recruitment.html' },
  recruitment: { title: 'Recruitment', nav: 'recruitment' },
  'recruitment-requests': { title: 'Recruitment Requests', nav: 'recruitment' },
  'recruitment-request-form': { title: 'Recruitment Request', nav: 'recruitment' },
  'recruitment-requisitions': { title: 'Job Requisitions', nav: 'recruitment' },
  'recruitment-form': { title: 'Job Requisition', nav: 'recruitment' },
  'recruitment-postings': { title: 'Job Postings', nav: 'recruitment' },
  'recruitment-posting-form': { title: 'Job Posting', nav: 'recruitment' },
  'recruitment-candidates': { title: 'Recruitment Candidates', nav: 'recruitment' },
  'recruitment-pipeline': { title: 'Candidate Pipeline', nav: 'recruitment' },
  'recruitment-interviews': { title: 'Interviews', nav: 'recruitment' },
  'recruitment-interview-form': { title: 'Schedule Interview', nav: 'recruitment' },
  'recruitment-offers': { title: 'Job Offers', nav: 'recruitment' },
  'recruitment-offer-form': { title: 'Job Offer', nav: 'recruitment' },
  'recruitment-settings': { title: 'Recruitment Settings', nav: 'recruitment' },
  applications: { title: 'Candidate Applications', nav: 'recruitment' },
  candidate: { title: 'Candidate Profile', nav: 'recruitment' },
  onboarding: { title: 'Onboarding', nav: 'onboarding' },
  reports: { title: 'Reports & Workflows', nav: 'reports' },
  employees: { title: 'Employees', nav: 'employees' },
  departments: { title: 'Departments', nav: 'departments' },
  orgchart: { title: 'Organization Chart', nav: 'orgchart' },
  settings: { title: 'Settings', nav: 'settings' },
  'employee-profile': { title: 'Employee Profile', nav: 'employees' }
};

const workspaceFrame = document.getElementById('workspace-frame');
const workspaceLoading = document.getElementById('workspace-loading');
let syncingFromFrame = false;

initializeWorkspace();

async function initializeWorkspace() {
  const reference = new URLSearchParams(window.location.search).get('reference');
  if (reference) {
    try {
      const result = await api.get(`/billing/verify/${encodeURIComponent(reference)}`);
      toast(`Payment confirmed. Your ${result.subscription.plan_key} plan is active.`, 'success', 6000);
    } catch (error) {
      toast(error.message || 'We could not confirm the payment yet. Please refresh shortly.', 'error', 6000);
    }
    window.history.replaceState(null, '', appUrl('/pages/workspace.html#dashboard'));
  }
  loadWorkspaceRoute();
}
window.addEventListener('hashchange', () => {
  if (!syncingFromFrame) loadWorkspaceRoute();
});

function navigateWorkspace(route) {
  const cleanRoute = String(route || WORKSPACE_DEFAULT).trim() || WORKSPACE_DEFAULT;
  const page = cleanRoute.split('?')[0];
  if (!Object.prototype.hasOwnProperty.call(WORKSPACE_PAGES, page)) return;

  if (window.location.hash.slice(1) === cleanRoute) {
    loadWorkspaceRoute();
    return;
  }
  window.location.hash = cleanRoute;
}

window.addEventListener('message', (event) => {
  if (event.origin !== window.location.origin && event.source !== workspaceFrame.contentWindow) return;
  const data = event.data || {};
  if (data.type !== 'hrconnect:navigate') return;
  navigateWorkspace(data.route);
});

workspaceFrame.addEventListener('load', () => {
  workspaceLoading.classList.add('hidden');
  workspaceFrame.classList.remove('hidden');
  syncRouteFromFrame();
});

function parseWorkspaceRoute() {
  const raw = decodeURIComponent((window.location.hash || '').slice(1)).trim();
  const route = raw || WORKSPACE_DEFAULT;
  const questionIndex = route.indexOf('?');
  const page = (questionIndex >= 0 ? route.slice(0, questionIndex) : route)
    .replace(/^\/?pages\//, '')
    .replace(/\.html$/i, '') || WORKSPACE_DEFAULT;
  const query = questionIndex >= 0 ? route.slice(questionIndex) : '';

  if (!Object.prototype.hasOwnProperty.call(WORKSPACE_PAGES, page)) {
    return { page: WORKSPACE_DEFAULT, query: '' };
  }

  return { page, query };
}

function loadWorkspaceRoute() {
  const route = parseWorkspaceRoute();
  const pageMeta = WORKSPACE_PAGES[route.page];
  const src = pageMeta.src ? appUrl(pageMeta.src) : appUrl(`/pages/${route.page}.html${route.query}`);

  document.getElementById('workspace-title').textContent = pageMeta.title;
  document.title = `${pageMeta.title} - KenadHR`;
  buildSidebar(pageMeta.nav);
  loadNotifCount();

  if (workspaceFrame.dataset.src !== src) {
    workspaceLoading.classList.remove('hidden');
    workspaceFrame.classList.add('hidden');
    workspaceFrame.dataset.src = src;
    workspaceFrame.src = src;
  }
}

function syncRouteFromFrame() {
  try {
    const frameUrl = new URL(workspaceFrame.contentWindow.location.href);
    const page = frameUrl.pathname.split('/').pop().replace(/\.html$/i, '');
    if (!Object.prototype.hasOwnProperty.call(WORKSPACE_PAGES, page)) return;

    const route = `${page}${frameUrl.search}`;
    if (window.location.hash.slice(1) === route) return;

    syncingFromFrame = true;
    window.history.replaceState(null, '', `#${route}`);
    const pageMeta = WORKSPACE_PAGES[page];
    document.getElementById('workspace-title').textContent = pageMeta.title;
    document.title = `${pageMeta.title} - KenadHR`;
    buildSidebar(pageMeta.nav);
    loadNotifCount();
    syncingFromFrame = false;
  } catch (err) {
    syncingFromFrame = false;
  }
}
</script>
</body>
</html>

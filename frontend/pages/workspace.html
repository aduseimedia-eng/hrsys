<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2865d9">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/jpeg" href="/assets/title_icon.jpg">
  <link rel="apple-touch-icon" href="/assets/title_icon.jpg">
  <title>KenadHR Workspace</title>
  <link rel="stylesheet" href="../css/main.css?v=20260818-menu8">
  <style>
    body { overflow: auto; }

    .workspace-shell {
      --sidebar-w: 300px;
      --topbar-h: 72px;
      position: relative;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      grid-template-rows: var(--topbar-h) auto;
      height: auto;
      min-height: 100vh;
      overflow: visible;
    }

    .workspace-content {
      /* A two-row grid was stretching its empty first row when the optional
         recruitment bar is hidden, pushing every page down from the header. */
      display: block;
      min-width: 0;
      min-height: calc(100vh - var(--topbar-h));
      padding: 0;
      overflow: visible;
      background: var(--bg-page);
    }

    .workspace-stage {
      position: relative;
      min-height: 1px;
      overflow: visible;
    }

    .workspace-module-menu {
      position: absolute;
      z-index: 280;
      top: calc(var(--topbar-h) + 12px);
      left: calc(var(--sidebar-w) - 1px);
      width: 246px;
      max-height: calc(100vh - var(--topbar-h) - 24px);
      overflow-y: auto;
      padding: 10px;
      border: 1px solid #e4e9f1;
      border-radius: 0 12px 12px 0;
      background: #fff;
      box-shadow: 10px 16px 32px rgba(28, 43, 70, .13);
    }

    .workspace-module-menu__heading {
      display: flex;
      align-items: center;
      min-height: 34px;
      padding: 0 10px 7px;
      border-bottom: 1px solid #edf0f5;
      color: #24314a;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .workspace-module-menu__links { padding-top: 6px; }
    .workspace-module-menu__link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 38px;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 7px;
      color: #526076;
      font-size: .84rem;
      font-weight: 680;
      text-decoration: none;
    }

    .workspace-module-menu__link:hover,
    .workspace-module-menu__link:focus-visible { color: #275bc5; background: #f3f7ff; }
    .workspace-module-menu__link[aria-current="page"] { color: #275bc5; background: #eaf2ff; }
    .workspace-module-menu__link svg { width: 15px; height: 15px; flex: 0 0 auto; }

    .workspace-frame {
      width: 100%;
      height: 1px;
      min-height: 1px;
      border: 0;
      display: block;
      background: var(--bg-page);
      transition: opacity 120ms ease;
    }

    /* Keep the iframe in the layout while a route is loading. Replacing it with
       the loader caused the workspace to visibly jump on a hard refresh. */
    .workspace-frame.hidden {
      display: block !important;
      visibility: hidden;
      opacity: 0;
    }

    .workspace-loading {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      background: var(--bg-page);
      color: var(--text-muted);
      font-size: .9rem;
    }

    .workspace-topbar {
      min-width: 0;
      min-height: var(--topbar-h);
      padding: 0 24px;
      gap: 16px;
      background: #fff;
      border-bottom-color: #e7eaf0;
      box-shadow: none;
      backdrop-filter: none;
    }

    .workspace-breadcrumbs {
      min-width: 0;
      flex: 1;
    }

    .workspace-breadcrumbs ol {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      list-style: none;
    }

    .workspace-breadcrumbs a,
    .workspace-breadcrumbs [aria-current="page"] {
      overflow: hidden;
      color: var(--navy-700);
      font-size: .92rem;
      font-weight: 650;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workspace-breadcrumbs a:hover,
    .workspace-breadcrumbs a:focus-visible { color: var(--brand); }
    .workspace-breadcrumbs [aria-current="page"] { color: var(--navy-950); font-weight:800; }

    .workspace-breadcrumb-separator {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
      color: #98a2b3;
    }

    .workspace-utilities {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex: 0 0 auto;
    }

    .workspace-attendance {
      display: inline-flex;
      width: 158px;
      height: 44px;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      overflow: hidden;
      border: 1px solid var(--navy-200);
      border-radius: 10px;
      color: var(--navy-800);
      background: var(--navy-50);
      font: inherit;
      text-align: left;
      transition: background 140ms ease, border-color 140ms ease, color 140ms ease;
    }

    .workspace-attendance:hover,
    .workspace-attendance:focus-visible { border-color: var(--navy-400); color: var(--navy-950); background: var(--navy-100); }
    .workspace-attendance:disabled { cursor: wait; opacity: .72; }
    .workspace-attendance__icon {
      display: inline-grid;
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      place-items: center;
      border-radius: 8px;
      color: currentColor;
      background: var(--navy-100);
    }

    .workspace-attendance__icon svg { width: 17px; height: 17px; }
    .workspace-attendance__copy { min-width: 0; flex: 1; }
    .workspace-attendance__label,
    .workspace-attendance__elapsed { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .workspace-attendance__label { font-size: .71rem; font-weight: 750; letter-spacing: .01em; }
    .workspace-attendance__elapsed { margin-top: 1px; font-size: .86rem; font-weight: 850; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
    .workspace-attendance[data-state="working"] { color: var(--navy-800); background: var(--navy-50); }
    .workspace-attendance[data-state="complete"] { border-color: var(--navy-200); color: var(--navy-700); background: #f8fbff; }
    .workspace-attendance[data-state="complete"] .workspace-attendance__icon { background: var(--navy-100); }
    .workspace-attendance[data-state="error"] { border-color: var(--navy-200); color: var(--navy-800); background: var(--navy-50); }
    .workspace-attendance[data-state="error"] .workspace-attendance__icon { background: var(--navy-100); }

    .workspace-utility {
      display: inline-grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1px solid var(--navy-200);
      border-radius: 10px;
      color: var(--navy-800);
      background: #fff;
      text-decoration: none;
    }

    .workspace-utility:hover,
    .workspace-utility:focus-visible { color: var(--navy-950); background: var(--navy-50); }
    .workspace-utility svg { width: 18px; height: 18px; }

    .workspace-topbar #notif-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--navy-200);
      border-radius: 10px;
      color: var(--navy-800);
      background: #fff;
      box-shadow: none;
    }

    .workspace-topbar #notif-btn:hover,
    .workspace-topbar #notif-btn:focus-visible {
      border-color: var(--navy-400);
      color: var(--navy-950);
      background: var(--navy-50);
      box-shadow: none;
    }

    .workspace-account {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 164px;
      margin-left: 4px;
      padding: 4px 8px 4px 5px;
      border: 1px solid transparent;
      border-radius: 10px;
      text-align: left;
    }
    .workspace-account:hover,
    .workspace-account:focus-visible { border-color:var(--navy-200); background: var(--navy-50); outline: none; }
    .workspace-account[aria-expanded="true"] { border-color:var(--navy-200); background: var(--navy-100); }
    .workspace-account__chevron { flex: 0 0 auto; color: #7d8798; transition: transform 160ms ease; }
    .workspace-account[aria-expanded="true"] .workspace-account__chevron { transform: rotate(180deg); }
    .workspace-account-menu {
      position: absolute;
      z-index: 400;
      top: calc(var(--topbar-h) - 8px);
      right: 22px;
      width: 218px;
      padding: 7px;
      border: 1px solid #e2e7ef;
      border-radius: 11px;
      background: #fff;
      box-shadow: 0 14px 32px rgba(31, 46, 76, .16);
    }
    .workspace-account-menu a,
    .workspace-account-menu button {
      display: block;
      width: 100%;
      padding: 9px 10px;
      border-radius: 7px;
      color: #44516a;
      font: 650 .83rem var(--font-body);
      text-align: left;
      text-decoration: none;
    }
    .workspace-account-menu a:hover,
    .workspace-account-menu a:focus-visible,
    .workspace-account-menu button:hover,
    .workspace-account-menu button:focus-visible { color: #244fba; background: #f0f5ff; outline: none; }
    .workspace-account-menu button { margin-top: 4px; border-top: 1px solid #edf0f4; border-radius: 0 0 7px 7px; color: #b64c4a; }
    .workspace-account-menu button:hover,
    .workspace-account-menu button:focus-visible { color: #a63a38; background: #fff3f2; }
    }

    .workspace-account__avatar {
      display: inline-grid;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      place-items: center;
      border-radius: 10px;
      color: #fff;
      background: var(--brand);
      font-size: .88rem;
      font-weight: 800;
    }

    .workspace-account__copy { min-width: 0; }
    .workspace-account__name,
    .workspace-account__status { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .workspace-account__name { color: #202a3d; font-size: .86rem; font-weight: 800; }
    .workspace-account__status { margin-top: 1px; color: #738096; font-size: .74rem; }

    .recruitment-context-nav {
      grid-row: 1;
      overflow-x: auto;
      border-bottom: 1px solid #e7eaf0;
      background: #fff;
      scrollbar-width: thin;
    }

    .workspace-stage { grid-row: auto; }

    .recruitment-context-nav__links {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: max-content;
      padding: 9px 24px;
    }

    .recruitment-context-nav a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #657188;
      font-size: .8rem;
      font-weight: 700;
      text-decoration: none;
    }

    .recruitment-context-nav a svg { width: 16px; height: 16px; flex: 0 0 auto; }
    .recruitment-context-nav a:hover,
    .recruitment-context-nav a:focus-visible { color: #2865d9; background: #f3f7ff; }
    .recruitment-context-nav a[aria-current="page"] { color: #2865d9; border-color: #c9dafc; background: #eaf2ff; }

    .workspace-shell .sidebar-logo {
      min-height: 158px;
      height: auto;
      padding: 13px 18px;
      justify-content: center;
      border-bottom: 1px solid #e7eaf0;
    }

    .workspace-shell .sidebar-logo .brand-logo { width: min(100%, 210px); height: 76px; object-fit: contain; object-position: center; }
    .workspace-shell .sidebar--workspace-static .sidebar-nav {
      padding: 12px 12px 16px;
    }

    .workspace-shell .sidebar--workspace-static .nav-item {
      min-height: 42px;
      margin: 2px 0;
      padding: 9px 12px;
      border-radius: 9px;
      color: #5f6c82;
      font-size: .86rem;
      font-weight: 720;
      box-shadow: none;
      transition: background 140ms ease, color 140ms ease;
    }

    .workspace-shell .sidebar--workspace-static .nav-item .nav-icon {
      width: 18px;
      height: 18px;
      color: #6f7c91;
      opacity: 1;
    }

    .workspace-shell .sidebar--workspace-static .nav-item:hover,
    .workspace-shell .sidebar--workspace-static .nav-item:focus-visible {
      color: #275bc5;
      background: #f3f7ff;
    }

    .workspace-shell .sidebar--workspace-static .nav-item.active {
      color: #275bc5;
      background: #eaf2ff;
      box-shadow: none;
    }

    .workspace-shell .sidebar--workspace-static .nav-item.active .nav-icon { color: currentColor; }
    .workspace-shell .sidebar--workspace-static .nav-group {
      margin: 16px 0 6px;
    }

    .workspace-shell .sidebar--workspace-static .nav-group:first-child { margin-top: 2px; }
    .workspace-shell .sidebar--workspace-static .nav-group-toggle {
      min-height: 28px;
      padding: 0 10px 5px;
      cursor: default;
      pointer-events: none;
      border-radius: 0;
      color: #8490a4;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .workspace-shell .sidebar--workspace-static .nav-group-heading { gap: 7px; }
    .workspace-shell .sidebar--workspace-static .nav-group-heading .nav-icon { width: 15px; height: 15px; color: #8490a4; }
    .workspace-shell .sidebar--workspace-static .nav-group-chevron { display: none; }
    .workspace-shell .sidebar--workspace-static .nav-group-items {
      display: block;
      opacity: 1;
      overflow: visible;
    }

    .workspace-shell .sidebar--workspace-static .nav-group-items-inner { min-height: auto; }
    .workspace-shell .sidebar--workspace-static .nav-item-child {
      min-height: 39px;
      margin: 1px 0;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: .83rem;
      font-weight: 680;
    }

    .workspace-shell .sidebar--workspace-static .nav-item-child::after { display: none; }
    .workspace-shell .sidebar--workspace-static .nav-item-child .nav-icon {
      display: block;
      width: 17px;
      height: 17px;
      color: #6f7c91;
      opacity: 1;
    }

    .workspace-shell .sidebar--workspace-static .nav-item-child.active .nav-icon { color: currentColor; }
    .workspace-shell .sidebar--workspace-static .sidebar-user {
      margin: 0 12px 12px;
      padding: 10px 8px;
      border-radius: 10px;
      box-shadow: none;
    }

    .topbar .icon-btn .dot {
      min-width: 16px;
      width: auto;
      height: 16px;
      padding: 0 4px;
      top: 3px;
      right: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: .62rem;
      font-weight: 800;
      line-height: 1;
    }

    @media (max-width: 900px) {
      .workspace-account { min-width: 42px; }
      .workspace-account__copy { display: none; }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .workspace-shell { --sidebar-w: 224px; }
      .workspace-shell .sidebar-logo .brand-logo { width: 144px; }
    }

    @media (max-width: 768px) {
      .workspace-shell {
        --topbar-h: 68px;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: var(--topbar-h) minmax(0, 1fr);
      }
      .workspace-topbar { padding: 0 14px; gap: 10px; }
      .workspace-breadcrumbs ol { gap: 7px; }
      .workspace-breadcrumbs a,
      .workspace-breadcrumbs [aria-current="page"] { font-size: .8rem; }
      .workspace-breadcrumbs li:first-child,
      .workspace-breadcrumbs li:nth-child(2) { display: none; }
      .workspace-settings { display: none; }
      .workspace-utilities { gap: 6px; }
      .workspace-attendance { width: 104px; gap: 6px; padding: 6px 8px; }
      .workspace-attendance__label { display: none; }
      .workspace-attendance__elapsed { margin-top: 0; font-size: .8rem; }
      .recruitment-context-nav__links { padding: 7px 12px; }
      .recruitment-context-nav a { min-height: 40px; }
      .workspace-shell .sidebar-logo { height: 68px; }
      .workspace-module-menu { display: none !important; }
    }

    @media (max-width: 520px) {
      .workspace-breadcrumbs { display: none; }
      .workspace-attendance { width: 108px; }
    }
  </style>
</head>
<body>
<div class="app-shell workspace-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <aside class="workspace-module-menu" id="workspace-module-menu" aria-label="Module pages" hidden></aside>

  <header class="topbar workspace-topbar" data-static-nav="true">
    <nav class="workspace-breadcrumbs" aria-label="Breadcrumb">
      <ol>
        <li><a id="workspace-module" href="#dashboard">Workspace</a></li>
        <li aria-hidden="true"><svg class="workspace-breadcrumb-separator" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></li>
        <li id="workspace-section" hidden></li>
        <li id="workspace-section-separator" aria-hidden="true" hidden><svg class="workspace-breadcrumb-separator" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></li>
        <li id="workspace-title" aria-current="page">Dashboard</li>
      </ol>
    </nav>
    <div class="topbar-actions workspace-utilities">
      <button class="workspace-attendance" id="workspace-attendance-control" type="button" data-state="ready" aria-label="Clock in. You are not clocked in today.">
        <span class="workspace-attendance__icon" id="workspace-attendance-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h10v18H5z"/><path d="M10 12h11M17 8l4 4-4 4"/></svg>
        </span>
        <span class="workspace-attendance__copy">
          <span class="workspace-attendance__label" id="workspace-attendance-label">Clock in</span>
          <time class="workspace-attendance__elapsed" id="workspace-attendance-elapsed" aria-live="off">Not started</time>
        </span>
      </button>
      <a class="workspace-utility workspace-settings" id="workspace-settings" href="#settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.04.04a2 2 0 1 1-2.83 2.83l-.04-.04A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.08A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.88.34l-.04.04a2 2 0 1 1-2.83-2.83l.04-.04A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.08A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l-.04-.04a2 2 0 1 1 2.83-2.83l.04.04A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.08A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.88-.34l.04-.04a2 2 0 1 1 2.83 2.83l-.04.04A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4H21a2 2 0 1 1 0 4h-.08a1.7 1.7 0 0 0-1.52.6z"/></svg>
      </a>
      <button class="icon-btn" id="notif-btn" title="Notifications" aria-label="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="dot hidden" id="notif-badge"></span>
      </button>
      <button class="workspace-account" id="workspace-account-menu-button" type="button" aria-label="Signed-in account" aria-expanded="false" aria-controls="workspace-account-menu">
        <span class="workspace-account__avatar" id="workspace-user-initials">HR</span>
        <span class="workspace-account__copy">
          <span class="workspace-account__name" id="workspace-user-name">Signed in</span>
          <span class="workspace-account__status" id="workspace-user-status">HR workspace</span>
        </span>
        <svg class="workspace-account__chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="workspace-account-menu" id="workspace-account-menu" role="menu" hidden>
        <a href="#settings" role="menuitem">My profile &amp; account</a>
        <a href="#settings" role="menuitem">Company settings</a>
        <a href="#settings" role="menuitem">Change password</a>
        <button type="button" role="menuitem" id="workspace-sign-out">Sign out</button>
      </div>
    </div>
  </header>

  <main class="main-content workspace-content" id="workspace-content">
    <nav class="recruitment-context-nav" id="recruitment-context-nav" aria-label="Recruitment navigation" hidden>
      <div class="recruitment-context-nav__links">

async function initializeWorkspace() {
  const reference = new URLSearchParams(window.location.search).get('reference');
  if (reference) {
    try {
      const result = await api.get(`/billing/verify/${encodeURIComponent(reference)}`);
      toast(`Payment confirmed. Your ${result.subscription.plan_key} plan is active.`, 'success', 6000);
    } catch (error) {
      toast(error.message || 'We could not confirm the payment yet. Please refresh shortly.', 'error', 6000);
    }
    window.history.replaceState(null, '', appUrl('/pages/workspace.html#dashboard'));
  }
  loadWorkspaceRoute();
}
window.addEventListener('hashchange', () => {
  if (!syncingFromFrame) loadWorkspaceRoute();
});

function navigateWorkspace(route) {
  const cleanRoute = String(route || WORKSPACE_DEFAULT).trim() || WORKSPACE_DEFAULT;
  const page = cleanRoute.split('?')[0];
  if (!Object.prototype.hasOwnProperty.call(WORKSPACE_PAGES, page)) return;

  if (window.location.hash.slice(1) === cleanRoute) {
    loadWorkspaceRoute();
    return;
  }
  window.location.hash = cleanRoute;
}

window.addEventListener('message', (event) => {
  if (event.origin !== window.location.origin || event.source !== workspaceFrame.contentWindow) return;
  const data = event.data || {};
  if (data.type === 'hrconnect:page-height' && Number.isFinite(data.height)) {
    const nextHeight = Math.max(1, Math.ceil(data.height));
    if (Math.abs(workspaceFrame.getBoundingClientRect().height - nextHeight) > 1) {
      workspaceFrame.style.height = `${nextHeight}px`;
    }
    return;
  }
  if (data.type === 'hrconnect:modal-state') {
    document.documentElement.classList.toggle('workspace-modal-open', Boolean(data.open));
    document.body.classList.toggle('workspace-modal-open', Boolean(data.open));
    return;
  }
  if (data.type === 'hrconnect:attendance-updated') {
    loadWorkspaceAttendance();
    return;
  }
  if (data.type !== 'hrconnect:navigate') return;
  navigateWorkspace(data.route);
});

workspaceFrame.addEventListener('load', () => {
  document.documentElement.classList.remove('workspace-modal-open');
  document.body.classList.remove('workspace-modal-open');
  workspaceLoading.classList.add('hidden');
  workspaceFrame.classList.remove('hidden');
  workspaceFrame.contentWindow?.scrollTo(0, 0);
  resetWorkspaceScroll();
  requestAnimationFrame(resetWorkspaceScroll);
  window.setTimeout(resetWorkspaceScroll, 80);
  syncRouteFromFrame();
});

function parseWorkspaceRoute() {
  const raw = decodeURIComponent((window.location.hash || '').slice(1)).trim();
  const route = raw || WORKSPACE_DEFAULT;
  const questionIndex = route.indexOf('?');
  const page = (questionIndex >= 0 ? route.slice(0, questionIndex) : route)
    .replace(/^\/?pages\//, '')
    .replace(/\.html$/i, '') || WORKSPACE_DEFAULT;
  const query = questionIndex >= 0 ? route.slice(questionIndex) : '';

  if (!Object.prototype.hasOwnProperty.call(WORKSPACE_PAGES, page)) {
    return { page: WORKSPACE_DEFAULT, query: '' };
  }

  return { page, query };
}

function workspaceUserName() {
  const name = [workspaceUser.first_name, workspaceUser.last_name].filter(Boolean).join(' ').trim();
  return name || workspaceUser.email || 'Signed in';
}

function setupWorkspaceIdentity() {
  const name = workspaceUserName();
  const parts = name.split(/\s+/).filter(Boolean);
  const initials = parts.length > 1
    ? `${parts[0][0]}${parts[parts.length - 1][0]}`
    : (parts[0] || 'HR').slice(0, 2);
  const roleLabel = { admin: 'Administrator', manager: 'Manager', employee: 'Staff member' }[workspaceUser.role] || 'Signed in';

  document.getElementById('workspace-user-initials').textContent = initials.toUpperCase();
  document.getElementById('workspace-user-name').textContent = name;
  document.getElementById('workspace-user-status').textContent = roleLabel;
  document.querySelector('.workspace-account')?.setAttribute('aria-label', `Signed in as ${name}`);
  document.getElementById('workspace-settings').hidden = workspaceUser.role !== 'admin';
  const accountButton = document.getElementById('workspace-account-menu-button');
  const accountMenu = document.getElementById('workspace-account-menu');
  const closeAccountMenu = () => { accountMenu.hidden = true; accountButton.setAttribute('aria-expanded', 'false'); };
  accountButton.addEventListener('click', (event) => {
    event.stopPropagation();
    const willOpen = accountMenu.hidden;
    accountMenu.hidden = !willOpen;
    accountButton.setAttribute('aria-expanded', String(willOpen));
  });
  document.addEventListener('click', closeAccountMenu);
  document.getElementById('workspace-sign-out').addEventListener('click', logout);
}

function workspaceAttendanceSvg(state) {
  const paths = {
    ready: '<path d="M5 3h10v18H5z"/><path d="M10 12h11M17 8l4 4-4 4"/>',
    working: '<path d="M5 3h10v18H5z"/><path d="M21 12H10M14 8l-4 4 4 4"/>',
    complete: '<circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/>',
    error: '<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/>'
  };
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${paths[state] || paths.ready}</svg>`;
}

function formatWorkspaceAttendanceDuration(clockIn, clockOut = null) {
  const start = new Date(clockIn).getTime();
  const end = clockOut ? new Date(clockOut).getTime() : Date.now();
  const seconds = Math.max(0, Math.floor((end - start) / 1000));
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const remainingSeconds = seconds % 60;
  return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
}

function clearWorkspaceAttendanceTimer() {
  if (workspaceAttendanceTimerId) window.clearInterval(workspaceAttendanceTimerId);
  workspaceAttendanceTimerId = null;
}

function updateWorkspaceAttendanceElapsed() {
  if (!workspaceAttendance?.clock_in || workspaceAttendance.clock_out || workspaceAttendanceBusy || workspaceAttendanceIssue) return;
  workspaceAttendanceElapsed.textContent = formatWorkspaceAttendanceDuration(workspaceAttendance.clock_in);
}

function startWorkspaceAttendanceTimer() {
  clearWorkspaceAttendanceTimer();
  if (!workspaceAttendance?.clock_in || workspaceAttendance.clock_out || workspaceAttendanceBusy || workspaceAttendanceIssue) return;
  updateWorkspaceAttendanceElapsed();
  workspaceAttendanceTimerId = window.setInterval(updateWorkspaceAttendanceElapsed, 1000);
}

function workspaceAttendanceErrorLabel(message) {
  if (/location|gps|permission/i.test(String(message || ''))) return 'Location needed';
  if (/already|open attendance|clocked/i.test(String(message || ''))) return 'Status changed';
  return 'Try again';
}

function renderWorkspaceAttendance() {
  if (!workspaceAttendanceControl) return;
  clearWorkspaceAttendanceTimer();

  const hasClockIn = Boolean(workspaceAttendance?.clock_in);
  const isWorking = hasClockIn && !workspaceAttendance.clock_out;
  const isComplete = hasClockIn && Boolean(workspaceAttendance.clock_out);
  let state = 'ready';
  let label = 'Clock in';
  let elapsed = 'Not started';
  let ariaLabel = 'Clock in. You are not clocked in today.';
  let disabled = false;

  if (!workspaceAttendanceLoaded) {
    label = 'Attendance';
    elapsed = 'Loading…';
    ariaLabel = 'Loading your attendance status.';
    disabled = true;
  } else if (workspaceAttendanceBusy) {
    label = 'Getting location';
    elapsed = 'Please wait';
    ariaLabel = 'Getting your precise location for attendance.';
    disabled = true;
  } else if (workspaceAttendanceIssue) {
    state = 'error';
    label = workspaceAttendanceErrorLabel(workspaceAttendanceIssue);
    elapsed = 'Retry';
    ariaLabel = `${label}. ${workspaceAttendanceIssue}`;
  } else if (isWorking) {
    state = 'working';
    label = 'Clock out';
    elapsed = formatWorkspaceAttendanceDuration(workspaceAttendance.clock_in);
    ariaLabel = 'Clock out. Your attendance timer is running.';
  } else if (isComplete) {
    state = 'complete';
    label = workspaceAttendanceOvertimeReady ? 'Overtime ready' : 'Completed';
    elapsed = workspaceAttendanceOvertimeReady ? 'Review' : formatWorkspaceAttendanceDuration(workspaceAttendance.clock_in, workspaceAttendance.clock_out);
    ariaLabel = workspaceAttendanceOvertimeReady
      ? 'Overtime may be eligible. Open Attendance to review it.'
      : 'Attendance completed. Open Attendance to view today’s record.';
  }

  workspaceAttendanceControl.dataset.state = state;
  workspaceAttendanceControl.disabled = disabled;
  workspaceAttendanceControl.title = workspaceAttendanceIssue || '';
  workspaceAttendanceControl.setAttribute('aria-label', ariaLabel);
  workspaceAttendanceIcon.innerHTML = workspaceAttendanceSvg(state);
  workspaceAttendanceLabel.textContent = label;
  workspaceAttendanceElapsed.textContent = elapsed;
  if (isWorking && !workspaceAttendanceBusy && !workspaceAttendanceIssue) startWorkspaceAttendanceTimer();
}

async function loadWorkspaceAttendance() {
  if (workspaceAttendanceBusy) return;
  const refreshToken = ++workspaceAttendanceRefreshToken;
  try {
    const attendance = await api.get('/attendance/today');
    if (refreshToken !== workspaceAttendanceRefreshToken || workspaceAttendanceBusy) return;
    workspaceAttendance = attendance?.clock_in ? attendance : null;
    workspaceAttendanceIssue = '';
    workspaceAttendanceOvertimeReady = false;
  } catch (error) {
    if (refreshToken !== workspaceAttendanceRefreshToken || workspaceAttendanceBusy) return;
    workspaceAttendanceIssue = error.message || 'Could not load attendance status.';
  } finally {
    if (refreshToken !== workspaceAttendanceRefreshToken || workspaceAttendanceBusy) return;
    workspaceAttendanceLoaded = true;
    renderWorkspaceAttendance();
  }
}

async function workspaceAttendanceAction() {
  if (workspaceAttendanceBusy || !workspaceAttendanceLoaded) return;

  if (workspaceAttendance?.clock_in && workspaceAttendance.clock_out) {
    navigateWorkspace('attendance');
    return;
  }

  const action = workspaceAttendance?.clock_in ? 'out' : 'in';
  workspaceAttendanceRefreshToken += 1;
  workspaceAttendanceBusy = true;
  workspaceAttendanceIssue = '';
  renderWorkspaceAttendance();

  try {
    const location = await requestAttendanceLocation();
    const attendance = await api.post(`/attendance/clock-${action}`, location);
    workspaceAttendance = attendance;
    workspaceAttendanceOvertimeReady = action === 'out' && Boolean(attendance.overtime_eligible);
  } catch (error) {
    workspaceAttendanceIssue = error.message || `Could not clock ${action}.`;
  } finally {
    workspaceAttendanceBusy = false;
    workspaceAttendanceLoaded = true;
    renderWorkspaceAttendance();
  }
}

function updateWorkspaceChrome(route, pageMeta) {
  const isRecruitmentDashboard = route.page === 'hiring' || route.page === 'recruitment';
  const currentTitle = isRecruitmentDashboard ? 'Dashboard' : pageMeta.title;
  const module = WORKSPACE_MODULES[pageMeta.nav] || WORKSPACE_MODULES.dashboard;
  const section = WORKSPACE_SECTIONS[route.page] || '';

  workspaceModule.textContent = module.label;
  workspaceModule.href = module.href;
  workspaceSection.textContent = section;
  workspaceSection.hidden = !section;
  workspaceSectionSeparator.hidden = !section;
  workspaceTitle.textContent = currentTitle;
  document.title = `${[module.label, section, currentTitle].filter(Boolean).join(' / ')} - KenadHR`;

  workspaceContent.classList.toggle('is-recruitment-workspace', pageMeta.nav === 'recruitment');
  recruitmentContextNav.hidden = true;
  // The sidebar is the single source of navigation. Keeping a second module
  // menu here duplicates the same links and obscures the workspace content.
  workspaceModuleMenu.hidden = true;
  workspaceModuleMenu.innerHTML = '';
}

function workspaceModuleMenuArrow() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
}

function renderWorkspaceModuleMenu(moduleKey, activePage) {
  if (!workspaceModuleMenu) return;
  const menu = WORKSPACE_MODULE_MENUS[moduleKey];
  const items = menu?.items.filter((item) => !item.roles || item.roles.includes(workspaceUser.role)) || [];
  if (!menu || !items.length) {
    workspaceModuleMenu.hidden = true;
    workspaceModuleMenu.innerHTML = '';
    return;
  }

  workspaceModuleMenu.hidden = false;
  workspaceModuleMenu.innerHTML = `
    <div class="workspace-module-menu__heading">${menu.label}</div>
    <nav class="workspace-module-menu__links" aria-label="${menu.label} pages">
      ${items.map((item) => {
        const pages = [item.route, ...(item.activeFor || [])];
        const isActive = pages.includes(activePage);
        return `<a class="workspace-module-menu__link" href="#${item.route}"${isActive ? ' aria-current="page"' : ''}><span>${item.label}</span>${workspaceModuleMenuArrow()}</a>`;
      }).join('')}
    </nav>`;
}

function updateWorkspaceSidebar(activePage) {
  if (!workspaceSidebarReady || !document.getElementById('sidebar')?.children.length) {
    buildSidebar(activePage, { presentation: 'workspace-static' });
    workspaceSidebarReady = true;
    return;
  }
  setSidebarActive(activePage);
}

function loadWorkspaceRoute() {
  const route = parseWorkspaceRoute();
  const pageMeta = WORKSPACE_PAGES[route.page];
  const src = pageMeta.src ? appUrl(pageMeta.src) : appUrl(`/pages/${route.page}.html${route.query}`);

  updateWorkspaceChrome(route, pageMeta);
  updateWorkspaceSidebar(route.page);
  loadNotifCount();

  if (workspaceFrame.dataset.src !== src) {
    // Every module begins at its own page header instead of inheriting the
    // vertical position from the page the user just left.
    resetWorkspaceScroll();
    workspaceLoading.classList.remove('hidden');
    workspaceFrame.classList.add('hidden');
    workspaceFrame.dataset.src = src;
    workspaceFrame.src = src;
  }
}

function syncRouteFromFrame() {
  try {
    const frameUrl = new URL(workspaceFrame.contentWindow.location.href);
    const page = frameUrl.pathname.split('/').pop().replace(/\.html$/i, '');
    if (!Object.prototype.hasOwnProperty.call(WORKSPACE_PAGES, page)) return;

    const route = `${page}${frameUrl.search}`;
    if (window.location.hash.slice(1) === route) return;

    syncingFromFrame = true;
    window.history.replaceState(null, '', `#${route}`);
    const pageMeta = WORKSPACE_PAGES[page];
    updateWorkspaceChrome({ page, query: frameUrl.search }, pageMeta);
    updateWorkspaceSidebar(pageMeta.nav);
    loadNotifCount();
    syncingFromFrame = false;
  } catch (err) {
    syncingFromFrame = false;
  }
}
</script>
</body>
</html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loans - KenadHR</title><link rel="stylesheet" href="../css/main.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Employee Loans</div><div class="topbar-actions" id="loan-actions"></div></header><main class="main-content"><div class="page-header"><div><h1>Employee Loans</h1><p id="loan-intro">View your current company loan repayments.</p></div><div id="loan-page-actions"></div></div><div class="table-container"><table><thead><tr><th>Employee</th><th>Reason</th><th>Original Amount</th><th>Monthly Repayment</th><th>Balance</th><th>Start Date</th><th>Status</th><th id="loan-action-head"></th></tr></thead><tbody id="loan-body"></tbody></table></div></main></div><div id="loan-modal" class="modal-overlay" style="display:none"><div class="modal"><div class="modal-header"><h3>Create employee loan</h3><button class="modal-close" onclick="closeLoan()">×</button></div><div class="modal-body"><div class="form-grid"><div class="form-group"><label class="form-label">Employee</label><select id="l-employee" class="form-control form-select"></select></div><div class="form-group"><label class="form-label">Loan amount (₵)</label><input id="l-amount" type="number" min="0.01" step="0.01" class="form-control"></div><div class="form-group"><label class="form-label">Monthly repayment (₵)</label><input id="l-repayment" type="number" min="0.01" step="0.01" class="form-control"></div><div class="form-group"><label class="form-label">First deduction month</label><input id="l-start" type="date" class="form-control"></div><div class="form-group span-2"><label class="form-label">Reason</label><textarea id="l-reason" class="form-control"></textarea></div></div></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeLoan()">Cancel</button><button class="btn btn-primary" onclick="saveLoan()">Create loan</button></div></div></div><script src="../js/api.js"></script><script>const user=api.getUser();if(!api.getToken()||!user){location.href=appUrl('/pages/login.html');throw Error('redirect')}const isHr=['admin','manager'].includes(user.role);let loans=[];buildSidebar('loans');loadNotifCount();function closeLoan(){document.getElementById('loan-modal').style.display='none'}async function loadLoans(){loans=await api.get('/loans');document.getElementById('loan-intro').textContent=isHr?'Create loans and monitor deductions from payroll.':'Your company loan repayments are deducted automatically from payroll.';document.getElementById('loan-action-head').textContent=isHr?'Action':'';document.getElementById('loan-body').innerHTML=loans.length?loans.map(l=>`<tr><td>${l.employee_name||'You'}</td><td>${l.reason||'—'}</td><td>${fmt.currency(l.principal_amount)}</td><td>${fmt.currency(l.monthly_repayment)}</td><td>${fmt.currency(l.remaining_balance)}</td><td>${fmt.date(l.start_date)}</td><td>${fmt.statusBadge(l.status)}</td><td>${isHr&&l.status==='active'?`<button class="btn btn-outline btn-sm" onclick="cancelLoan(${l.id})">Cancel</button>`:''}</td></tr>`).join(''):'<tr><td colspan="8"><div class="empty-state"><p>No loans recorded.</p></div></td></tr>'}async function openLoan(){const emps=await api.get('/employees?limit=1000');document.getElementById('l-employee').innerHTML=emps.employees.map(e=>`<option value="${e.id}">${e.first_name} ${e.last_name}${e.employee_code?' - '+e.employee_code:''}</option>`).join('');document.getElementById('loan-modal').style.display='flex'}async function saveLoan(){try{await api.post('/loans',{employee_id:Number(document.getElementById('l-employee').value),principal_amount:Number(document.getElementById('l-amount').value),monthly_repayment:Number(document.getElementById('l-repayment').value),start_date:document.getElementById('l-start').value,reason:document.getElementById('l-reason').value});closeLoan();toast('Loan created','success');loadLoans()}catch(e){toast(e.message,'error')}}async function cancelLoan(id){if(!confirm('Cancel this active loan?'))return;await api.patch(`/loans/${id}/cancel`);loadLoans()}if(isHr){const b='<button class="btn btn-primary" onclick="openLoan()">Add Loan</button>';document.getElementById('loan-actions').innerHTML=b;document.getElementById('loan-page-actions').innerHTML=b}loadLoans().catch(e=>toast(e.message,'error'));</script></body></html>

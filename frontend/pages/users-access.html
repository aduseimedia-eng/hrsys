<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users &amp; Access - KenadHR</title><link rel="stylesheet" href="../css/main.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Users &amp; Access</div></header><main class="main-content"><div class="page-header"><div><h1>Users &amp; Access</h1><p>Manage who can sign in and the role assigned to each active user.</p></div></div><div class="table-container"><table><thead><tr><th>User</th><th>Job title</th><th>Role</th><th>Access</th><th></th></tr></thead><tbody id="access-rows"><tr><td colspan="5"><div class="loading-state"><div class="spinner"></div></div></td></tr></tbody></table></div></main></div><script src="../js/api.js"></script><script>const user=requireRole('admin');if(!user)throw Error('redirect');buildSidebar('users-access');loadNotifCount();let users=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const t=document.getElementById('access-rows');t.innerHTML=users.length?users.map(u=>`<tr><td><strong>${esc(`${u.first_name} ${u.last_name}`)}</strong><br><small>${esc(u.email)}</small></td><td>${esc(u.job_title||'—')}</td><td><select class="form-control form-select" onchange="changeRole(${u.id},this.value)"><option value="employee" ${u.role==='employee'?'selected':''}>Employee</option><option value="manager" ${u.role==='manager'?'selected':''}>Manager</option><option value="admin" ${u.role==='admin'?'selected':''}>Administrator</option></select></td><td><span class="badge badge-success">Active</span></td><td>${Number(u.id)===Number(user.id)?'<small>Current user</small>':`<button class="btn btn-danger btn-sm" type="button" onclick="deactivateUser(${u.id})">Deactivate</button>`}</td></tr>`).join(''):'<tr><td colspan="5"><div class="empty-state"><p>No active users found.</p></div></td></tr>'}async function changeRole(id,role){try{await api.put(`/employees/${id}`,{role});toast('User role updated','success');await load()}catch(e){toast(e.message||'Could not update user role','error');await load()}}async function deactivateUser(id){if(!confirm('Deactivate this user? They will no longer be able to sign in.'))return;try{await api.patch(`/employees/${id}/deactivate`,{});toast('User deactivated','success');await load()}catch(e){toast(e.message||'Could not deactivate user','error')}}async function load(){users=await api.get('/employees');render()}load().catch(e=>toast(e.message||'Could not load users','error'));</script></body></html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contract Expiry Tracker - KenadHR</title><link rel="stylesheet" href="../css/main.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Contract Expiry Tracker</div><div class="topbar-actions" id="contract-actions"></div></header><main class="main-content"><div class="page-header"><div><h1 id="contract-title">Contract Expiry Tracker</h1><p id="contract-intro">Track contract terms, expiry dates, and renewal notices.</p></div><div id="contract-page-action"></div></div><div class="table-container"><table><thead><tr><th>Employee</th><th>Contract</th><th>Start</th><th>Expiry</th><th>Notice</th><th>Days remaining</th><th>Status</th><th id="contract-action-head"></th></tr></thead><tbody id="contract-body"></tbody></table></div></main></div><div id="contract-modal" class="modal-overlay" style="display:none"><div class="modal"><div class="modal-header"><h3 id="contract-modal-title">Add Contract</h3><button class="modal-close" onclick="closeContract()">x</button></div><div class="modal-body"><input type="hidden" id="ct-id"><div class="form-grid"><div class="form-group"><label class="form-label">Employee</label><select id="ct-employee" class="form-control form-select"></select></div><div class="form-group"><label class="form-label">Contract type</label><input id="ct-type" class="form-control" value="Employment contract"></div><div class="form-group"><label class="form-label required">Start date</label><input id="ct-start" type="date" class="form-control"></div><div class="form-group"><label class="form-label required">End date</label><input id="ct-end" type="date" class="form-control"></div><div class="form-group"><label class="form-label">Notice period (days)</label><input id="ct-notice" type="number" min="0" class="form-control" value="30"></div><div class="form-group"><label class="form-label">Status</label><select id="ct-status" class="form-control form-select"><option value="active">Active</option><option value="renewed">Renewed</option><option value="expired">Expired</option><option value="terminated">Terminated</option></select></div><div class="form-group span-2"><label class="form-label">Notes</label><textarea id="ct-notes" rows="3" class="form-control"></textarea></div></div></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeContract()">Cancel</button><button class="btn btn-primary" onclick="saveContract()">Save</button></div></div></div><script src="../js/api.js"></script><script>const user=requireAuth();if(!user)throw Error('redirect');const canManage=['admin','manager'].includes(user.role);let rows=[],employees=[];buildSidebar('contracts');loadNotifCount();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function closeContract(){document.getElementById('contract-modal').style.display='none'}function remaining(end,status){if(status!=='active')return '—';return Math.max(0,Math.ceil((new Date(end)-new Date())/86400000))+' days'}async function load(){if(canManage){[rows,employees]=await Promise.all([api.get('/contracts'),api.get('/employees?limit=1000')]);employees=employees.employees;}else{rows=await api.get('/contracts/mine');document.getElementById('contract-title').textContent='My Contracts';document.getElementById('contract-intro').textContent='Your contract terms and renewal information.';}render()}function render(){document.getElementById('contract-action-head').textContent=canManage?'Action':'';document.getElementById('contract-body').innerHTML=rows.length?rows.map(r=>`<tr><td>${canManage?`${esc(r.employee_name)}<br><small>${esc(r.employee_code||'')}</small>`:'You'}</td><td>${esc(r.contract_type)}</td><td>${fmt.date(r.start_date)}</td><td>${fmt.date(r.end_date)}</td><td>${r.notice_days} days</td><td>${remaining(r.end_date,r.status)}</td><td>${fmt.statusBadge(r.status)}</td><td>${canManage?`<button class="btn btn-outline btn-sm" onclick="openContract(${r.id})">Edit</button>`:''}</td></tr>`).join(''):`<tr><td colspan="8"><div class="empty-state"><p>No contract records yet.</p></div></td></tr>`}function openContract(id){const r=id?rows.find(x=>x.id===id):null;document.getElementById('contract-modal-title').textContent=r?'Edit Contract':'Add Contract';document.getElementById('ct-id').value=r?.id||'';document.getElementById('ct-employee').innerHTML=employees.map(e=>`<option value="${e.id}" ${r?.employee_id===e.id?'selected':''}>${esc(e.first_name+' '+e.last_name)}</option>`).join('');document.getElementById('ct-type').value=r?.contract_type||'Employment contract';document.getElementById('ct-start').value=r?.start_date||'';document.getElementById('ct-end').value=r?.end_date||'';document.getElementById('ct-notice').value=r?.notice_days??30;document.getElementById('ct-status').value=r?.status||'active';document.getElementById('ct-notes').value=r?.notes||'';document.getElementById('contract-modal').style.display='flex'}async function saveContract(){try{const body={employee_id:Number(document.getElementById('ct-employee').value),contract_type:document.getElementById('ct-type').value,start_date:document.getElementById('ct-start').value,end_date:document.getElementById('ct-end').value,notice_days:document.getElementById('ct-notice').value,status:document.getElementById('ct-status').value,notes:document.getElementById('ct-notes').value},id=document.getElementById('ct-id').value;if(id)await api.put(`/contracts/${id}`,body);else await api.post('/contracts',body);closeContract();toast('Contract saved','success');load()}catch(e){toast(e.message,'error')}}if(canManage){const b='<button class="btn btn-primary" onclick="openContract()">Add Contract</button>';document.getElementById('contract-actions').innerHTML=b;document.getElementById('contract-page-action').innerHTML=b}load().catch(e=>toast(e.message,'error'));</script></body></html>

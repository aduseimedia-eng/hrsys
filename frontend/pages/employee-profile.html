<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Profile — KenadHR</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/workspace.css">
  <script>
    if (window.self !== window.top) {
      document.documentElement.classList.add('embedded-early');
    }
  </script>
  <style>
    .embedded-early body {
      overflow: auto !important;
      background: var(--bg-page) !important;
    }
    .embedded-early .app-shell {
      display: block !important;
      height: auto !important;
      min-height: 100vh !important;
      overflow: visible !important;
    }
    .embedded-early .sidebar,
    .embedded-early .topbar,
    .embedded-early .sidebar-backdrop {
      display: none !important;
    }
    .embedded-early .main-content {
      min-height: auto !important;
      width: 100% !important;
      max-width: none !important;
      padding: 22px !important;
      overflow: visible !important;
    }

    .profile-hero {
      background: linear-gradient(120deg, #08752a 0%, #118334 100%);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      padding: 28px 30px 18px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 44px rgba(35,70,150,.18);
    }
    .profile-hero::after { content: ''; position: absolute; width: 320px; height: 320px; right: -120px; top: -200px; border-radius: 50%; background: rgba(255,255,255,.08); }
    .profile-hero .avatar-wrap {
      position: relative;
      flex-shrink: 0;
      z-index: 1;
    }
    .profile-hero .avatar { border: 4px solid rgba(255,255,255,.22); box-shadow: 0 12px 28px rgba(9,67,27,.28); }
    .profile-hero .avatar-wrap .edit-photo-btn {
      position: absolute;
      bottom: 0; right: 0;
      width: 28px; height: 28px;
      background: var(--amber-500);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border: 2px solid #075b22;
      transition: background var(--duration);
    }
    .profile-hero .avatar-wrap .edit-photo-btn:hover { background: var(--amber-400); }
    .profile-hero h2 { font-size: 1.72rem; color: #fff; margin: 3px 0 4px; letter-spacing: -.03em; }
    .profile-hero > div:not(.avatar-wrap):not(.profile-actions) { position: relative; z-index: 1; }
    .profile-eyebrow { color: rgba(255,255,255,.66); font-size: .68rem; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    .profile-hero .role-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.1); font-size: .8rem; margin-top: 6px; }
    .profile-meta { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
    .profile-meta-item { display: flex; align-items: center; gap: 7px; padding: 6px 9px; border: 1px solid rgba(255,255,255,.13); border-radius: 8px; background: rgba(10,23,66,.14); font-size: .76rem; color: rgba(255,255,255,.8); }
    .profile-meta-item svg { width: 15px; height: 15px; flex-shrink: 0; }
    .profile-tabs { display:flex; gap:22px; flex-wrap:wrap; margin-top:19px; padding-top:14px; border-top:1px solid rgba(255,255,255,.18); }
    .profile-tabs button { padding:0 0 8px; border:0; border-bottom:3px solid transparent; background:transparent; color:rgba(255,255,255,.82); font-size:.86rem; font-weight:750; cursor:pointer; }
    .profile-tabs button.active, .profile-tabs button:hover { color:#fff; border-bottom-color:#fff; }

    .profile-actions { position:relative;z-index:1;margin-left:auto;display:flex;gap:8px;flex-shrink:0;align-self:flex-start; }
    .profile-actions .btn { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.15); }
    .profile-actions .btn:hover { background: rgba(255,255,255,.18); }
    .profile-actions .btn-primary { background: var(--mint-100); color: var(--navy-950); border-color: transparent; }
    .profile-actions .btn-primary:hover { background: #fff; color: var(--navy-950); }

    .secure-message-note {
      margin-top: 8px;
      color: var(--text-muted);
      font-size: .78rem;
      line-height: 1.5;
    }

    .delete-confirm-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(225,29,72,.1);
      color: var(--rose-600);
      margin-bottom: 14px;
    }
    .delete-confirm-copy {
      color: var(--text-secondary);
      font-size: .9rem;
      line-height: 1.55;
      margin-top: 8px;
    }
    .delete-confirm-name {
      color: var(--text-primary);
      font-weight: 700;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, .82fr);
      gap: 16px;
      align-items: start;
    }
    .profile-workspace { display:grid; grid-template-columns:260px minmax(0,1fr); gap:22px; align-items:start; }
    .profile-vitals { position:sticky; top:18px; padding:20px; border:1px solid var(--border); border-radius:16px; background:var(--bg-surface); box-shadow:var(--shadow-sm); }
    .profile-vitals .avatar { width:112px !important; height:112px !important; font-size:2.2rem !important; margin-bottom:16px; border-radius:16px; }
    .profile-vitals h3 { margin:0 0 5px; font-size:1.05rem; }
    .profile-vitals .vitals-role { color:var(--text-secondary); font-size:.84rem; margin-bottom:15px; }
    .vitals-list { border-top:1px solid var(--border); padding-top:11px; }
    .vital-line { display:flex; gap:8px; align-items:flex-start; padding:7px 0; color:var(--text-secondary); font-size:.82rem; line-height:1.35; }
    .vital-mark { color:#08752a; font-weight:900; }
    .profile-main .profile-hero .avatar-wrap { display:none; }
    .profile-overview { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .profile-overview-item { min-width:0;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--bg-surface);box-shadow:var(--shadow-sm); }
    .profile-overview-item span { display:block;color:var(--text-muted);font-size:.66rem;font-weight:750;letter-spacing:.07em;text-transform:uppercase; }
    .profile-overview-item strong { display:block;overflow:hidden;margin-top:5px;color:var(--text-primary);font-size:.9rem;text-overflow:ellipsis;white-space:nowrap; }
    .profile-grid .card { overflow:hidden;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm); }
    .profile-grid .card-header { padding:15px 18px;border-bottom:1px solid var(--border);background:linear-gradient(90deg,#fbfcff,#f6f8ff); }
    .profile-grid .card-header h3 { color:var(--text-primary);font-size:.82rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase; }
    .profile-grid .card-body { padding:8px 18px; }
    .profile-grid .card[data-profile-tab] { display:none; }
    .profile-grid[data-profile-active="personal"] .card[data-profile-tab="personal"],
    .profile-grid[data-profile-active="job"] .card[data-profile-tab="job"],
    .profile-grid[data-profile-active="timeoff"] .card[data-profile-tab="timeoff"],
    .profile-grid[data-profile-active="emergency"] .card[data-profile-tab="emergency"],
    .profile-grid[data-profile-active="performance"] .card[data-profile-tab="performance"],
    .profile-grid[data-profile-active="training"] .card[data-profile-tab="training"],
    .profile-grid[data-profile-active="benefits"] .card[data-profile-tab="benefits"],
    .profile-grid[data-profile-active="more"] .card[data-profile-tab="more"] { display:block; }
    .profile-grid .profile-wide { grid-column:1/-1; }
    .profile-record-list { display:grid; gap:10px; padding:8px 0; }
    .profile-record { display:flex; justify-content:space-between; gap:18px; padding:13px 0; border-bottom:1px solid var(--border); }
    .profile-record:last-child { border-bottom:0; }.profile-record strong { display:block; font-size:.88rem; }.profile-record small { display:block; margin-top:4px; color:var(--text-secondary); line-height:1.4; }.profile-record-meta { text-align:right; flex-shrink:0; }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      font-size: .875rem;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .label { color: var(--text-muted);font-size:.78rem; }
    .info-row .value { max-width:58%;color:var(--text-primary);font-size:.82rem;font-weight:650;text-align:right; }
    .quick-access-panel { display: none; width: 100%; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
    .quick-access-panel.open { display: block; }
    .quick-access-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .quick-access-panel-head h4 { font-size: 1rem; }
    .quick-access-panel .table-container { max-height: 360px; overflow: auto; }
    .quick-access-actions { display:flex;gap:10px;flex-wrap:wrap;padding:10px 0 2px; }
    .quick-access-actions .btn { min-height:38px;border-radius:9px;font-size:.78rem; }

    @media (max-width: 768px) {
      .profile-workspace { grid-template-columns:1fr; }.profile-vitals { position:static; display:flex; gap:16px; align-items:center; }.profile-vitals .vitals-list { display:none; }
      .profile-hero { flex-direction: column; text-align: center; }
      .profile-meta { justify-content: center; }
      .profile-actions { margin-left: 0; }
      .profile-grid { grid-template-columns: 1fr; }
      .profile-overview { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 500px) { .profile-hero { padding:24px 18px; }.profile-overview { grid-template-columns:1fr; }.profile-actions { width:100%;justify-content:center;flex-wrap:wrap; } }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <header class="topbar">
    <div class="topbar-title" id="page-title">Employee Profile</div>
    <div class="topbar-actions">
      <button type="button" class="btn btn-outline btn-sm" onclick="goBackToEmployees()">Back to Employees</button>
    </div>
  </header>
  <main class="main-content" id="profile-content">
    <div class="loading-state" style="height:60vh"><div class="spinner"></div></div>
  </main>
</div>

<script src="../js/api.js"></script>
<script>
const currentUser = requireAuth();
if (!currentUser) throw new Error('redirect');
buildSidebar('employees');

const params = new URLSearchParams(window.location.search);
const empId  = parseInt(params.get('id')) || currentUser.id;
const isOwn  = empId === currentUser.id;
const isAdmin= currentUser.role === 'admin';
let departments = [];
const JOB_TITLES = [
  'HR Director',
  'HR Officer',
  'Admin Officer',
  'Operations Manager',
  'Operations Officer',
  'Public Relations Lead',
  'Public Relations Officer',
  'IT Manager',
  'IT Support Officer',
  'Senior Developer',
  'Frontend Developer',
  'Account Manager',
  'Account Analyst',
  'Member Management Lead',
  'Member Officer'
];
const EMPLOYMENT_TYPES = [
  { value: 'staff', label: 'Staff' },
  { value: 'contractual', label: 'Contractual' },
  { value: 'national_service', label: 'National Service Personnel' },
  { value: 'internship', label: 'Internship Staff' }
];

function safe(value) {
  return String(value ?? '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}

function valueOrDash(value) {
  return value == null || value === '' ? '--' : safe(value);
}

function employmentTypeLabel(value) {
  return (EMPLOYMENT_TYPES.find((type) => type.value === value) || EMPLOYMENT_TYPES[0]).label;
}

function infoRow(label, value) {
  return `<div class="info-row"><span class="label">${safe(label)}</span><span class="value">${valueOrDash(value)}</span></div>`;
}

function goBackToEmployees() {
  if (window.self !== window.top) {
    window.location.replace('employees.html');
    return;
  }
  window.location.replace('employees.html');
}
function optionList(options, selectedValue, placeholder = '— Select —') {
  return `<option value="">${placeholder}</option>${options.map((option) => {
    const value = typeof option === 'object' ? option.value : option;
    const label = typeof option === 'object' ? option.label : option;
    return `<option value="${safe(value)}" ${String(value) === String(selectedValue || '') ? 'selected' : ''}>${safe(label)}</option>`;
  }).join('')}`;
}

async function loadProfile() {
  try {
    const [emp, deptRows, promotions, contracts, benefits, leaveRows, reviewRows, trainingRows] = await Promise.all([
      api.get(`/employees/${empId}`),
      api.get('/employees/departments'),
      api.get(`/employees/${empId}/promotions`),
      api.get(`/contracts/employee/${empId}`),
      api.get('/benefits?include_inactive=true'),
      api.get(currentUser.role === 'employee' ? '/leave/mine' : `/leave?employee_id=${empId}`),
      api.get(`/performance/employee/${empId}`),
      api.get(currentUser.role === 'employee' ? '/training/mine' : '/training')
    ]);
    departments = deptRows || [];
    document.getElementById('page-title').textContent = `${emp.first_name} ${emp.last_name}`;

    const canEdit = isOwn || isAdmin;

    document.getElementById('profile-content').innerHTML = `
      <div class="profile-workspace">
      <aside class="profile-vitals">
        ${emp.photo_url
          ? `<img src="${assetUrl(emp.photo_url)}" class="avatar" style="object-fit:cover" alt="">`
          : `<div class="avatar">${fmt.initials(emp.first_name,emp.last_name)}</div>`}
        ${isOwn ? `<label style="display:inline-block;margin:-8px 0 12px;font-size:.78rem;color:#08752a;font-weight:700;cursor:pointer">Change photo<input type="file" accept="image/*" style="display:none" onchange="uploadPhoto(this.files[0])"></label>` : ''}
        <h3>${emp.first_name} ${emp.last_name}</h3>
        <div class="vitals-role">${emp.job_title || 'Employee'}</div>
        <div class="vitals-list">
          <div class="vital-line"><span class="vital-mark">#</span><span>${emp.employee_code || 'Employee ID not assigned'}</span></div>
          ${emp.email ? `<div class="vital-line"><span class="vital-mark">@</span><span>${emp.email}</span></div>` : ''}
          ${emp.phone ? `<div class="vital-line"><span class="vital-mark">◷</span><span>${emp.phone}</span></div>` : ''}
          <div class="vital-line"><span class="vital-mark">⌂</span><span>${emp.department_name || 'Department not assigned'}</span></div>
          <div class="vital-line"><span class="vital-mark">◆</span><span>${employmentTypeLabel(emp.employment_type)}</span></div>
          ${emp.manager_name ? `<div class="vital-line"><span class="vital-mark">↗</span><span>Manager: ${emp.manager_name}</span></div>` : ''}
        </div>
      </aside>
      <section class="profile-main">
      <!-- Profile workspace header -->
      <div class="profile-hero">
        <div class="avatar-wrap">
          ${emp.photo_url
            ? `<img src="${assetUrl(emp.photo_url)}" class="avatar" style="width:96px;height:96px;object-fit:cover" alt="">`
            : `<div class="avatar" style="width:96px;height:96px;font-size:2rem">${fmt.initials(emp.first_name,emp.last_name)}</div>`}
          ${isOwn ? `<label class="edit-photo-btn" title="Change photo">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
            <input type="file" accept="image/*" style="display:none" onchange="uploadPhoto(this.files[0])">
          </label>` : ''}
        </div>
        <div style="flex:1">
          <div class="profile-eyebrow">Employee profile</div>
          <h2>${emp.first_name} ${emp.last_name}</h2>
          <p style="color:rgba(255,255,255,.6);font-size:.9rem">${emp.job_title || '—'}</p>
          <div style="margin-top:8px">${fmt.statusBadge(emp.role)} ${emp.department_name ? `<span class="badge badge-info" style="margin-left:6px">${emp.department_name}</span>` : ''}</div>
          <div class="profile-meta">
            ${emp.email ? `<div class="profile-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>${emp.email}</div>` : ''}
            ${emp.phone ? `<div class="profile-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8a19.79 19.79 0 01-3.07-8.66A2 2 0 012 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>${emp.phone}</div>` : ''}
            ${emp.hire_date ? `<div class="profile-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Joined ${fmt.date(emp.hire_date)}</div>` : ''}
          </div>
          <nav class="profile-tabs" aria-label="Employee profile sections">
            <button type="button" class="active" data-profile-tab-button="personal" onclick="setEmployeeProfileTab('personal')">Personal</button>
            <button type="button" data-profile-tab-button="job" onclick="setEmployeeProfileTab('job')">Job</button>
            <button type="button" data-profile-tab-button="timeoff" onclick="setEmployeeProfileTab('timeoff')">Time Off</button>
            <button type="button" data-profile-tab-button="emergency" onclick="setEmployeeProfileTab('emergency')">Emergency</button>
            <button type="button" data-profile-tab-button="performance" onclick="setEmployeeProfileTab('performance')">Performance</button>
            <button type="button" data-profile-tab-button="training" onclick="setEmployeeProfileTab('training')">Training</button>
            <button type="button" data-profile-tab-button="benefits" onclick="setEmployeeProfileTab('benefits')">Benefits</button>
            <button type="button" data-profile-tab-button="more" onclick="setEmployeeProfileTab('more')">More</button>
          </nav>
        </div>
        <div class="profile-actions">
          <button type="button" class="btn btn-sm" onclick="goBackToEmployees()">Back to Employees</button>
          ${!isOwn ? `<button class="btn btn-primary btn-sm" onclick="showSecureMessageModal()">Send Message</button>` : ''}
          ${canEdit ? `<button class="btn btn-sm" onclick="showEditModal()">Edit Profile</button>
          ${isAdmin && !isOwn ? `<button class="btn btn-primary btn-sm" onclick="showPromotionModal()">Promote</button><button class="btn btn-sm" onclick="showAccountModal(${emp.id})">Account Settings</button>
          <button class="btn btn-sm" style="background:rgba(225,29,72,.2);border-color:rgba(225,29,72,.3)" onclick="showDeleteEmployeeModal(${emp.id})">Delete Staff</button>` : ''}` : ''}
        </div>
      </div>

      <section class="profile-overview">
        <div class="profile-overview-item"><span>Employee ID</span><strong>${emp.employee_code || 'Not assigned'}</strong></div>
        <div class="profile-overview-item"><span>Department</span><strong>${emp.department_name || 'Not assigned'}</strong></div>
        <div class="profile-overview-item"><span>Employment</span><strong>${employmentTypeLabel(emp.employment_type)}</strong></div>
        <div class="profile-overview-item"><span>Started</span><strong>${emp.hire_date ? fmt.date(emp.hire_date) : 'Not recorded'}</strong></div>
      </section>

      <!-- Details grid -->
      <div class="profile-grid" id="employee-profile-grid" data-profile-active="personal">
        <!-- Personal info -->
        <div class="card" id="personal-information" data-profile-tab="personal">
          <div class="card-header"><h3>Personal Information</h3></div>
          <div class="card-body">
            <div class="info-row"><span class="label">Full Name</span><span class="value">${emp.first_name} ${emp.last_name}</span></div>
            <div class="info-row"><span class="label">Date of Birth</span><span class="value">${emp.date_of_birth ? fmt.date(emp.date_of_birth) : '—'}</span></div>
            <div class="info-row"><span class="label">Phone</span><span class="value">${emp.phone || '—'}</span></div>
            <div class="info-row"><span class="label">Email</span><span class="value">${emp.email}</span></div>
            <div class="info-row"><span class="label">Address</span><span class="value" style="max-width:200px;text-align:right">${emp.address || '—'}</span></div>
          </div>
        </div>

        <!-- Work info -->
        <div class="card" id="work-information" data-profile-tab="job">
          <div class="card-header"><h3>Work Information</h3></div>
          <div class="card-body">
            <div class="info-row"><span class="label">Department</span><span class="value">${emp.department_name || '—'}</span></div>
            <div class="info-row"><span class="label">Employment Type</span><span class="value">${employmentTypeLabel(emp.employment_type)}</span></div>
            <div class="info-row"><span class="label">Job Title</span><span class="value">${emp.job_title || '—'}</span></div>
            <div class="info-row"><span class="label">Manager</span><span class="value">${emp.manager_name || '—'}</span></div>
            <div class="info-row"><span class="label">Role</span><span class="value">${fmt.statusBadge(emp.role)}</span></div>
            <div class="info-row"><span class="label">Hire Date</span><span class="value">${emp.hire_date ? fmt.date(emp.hire_date) : '—'}</span></div>
            ${emp.salary != null ? `<div class="info-row"><span class="label">Salary</span><span class="value">${fmt.currency(emp.salary)}</span></div>` : ''}
          </div>
        </div>

        <div class="card" data-profile-tab="job">
          <div class="card-header"><h3>Contract Information</h3></div>
          <div class="card-body">${contracts.length ? contracts.slice(0, 2).map(contract => `${infoRow('Contract', contract.contract_type)}${infoRow('Expiry date', fmt.date(contract.end_date))}${infoRow('Status', contract.status)}${infoRow('Notice period', `${contract.notice_days} days`)}`).join('') : '<div class="info-row"><span class="label">Contract</span><span class="value">Not recorded</span></div>'}</div>
        </div>

        <div class="card profile-wide" id="benefits-information" data-profile-tab="benefits">
          <div class="card-header"><h3>Benefits Information</h3></div>
          <div class="card-body">
            ${infoRow('Pension ID', emp.pension_id || 'Not recorded')}
            ${benefits.filter(benefit => benefit.is_active && (!benefit.eligible_employment_type || benefit.eligible_employment_type === 'all' || benefit.eligible_employment_type === emp.employment_type)).length

function setEmployeeProfileTab(tab) {
  const allowed = ['personal','job','timeoff','emergency','performance','training','benefits','more'];
  const selected = allowed.includes(tab) ? tab : 'personal';
  const grid = document.getElementById('employee-profile-grid');
  if (grid) grid.dataset.profileActive = selected;
  document.querySelectorAll('[data-profile-tab-button]').forEach(button => {
    button.classList.toggle('active', button.dataset.profileTabButton === selected);
  });
}

async function showEmployeeLeaveHistory(employeeId) {
  const panel = document.getElementById('quick-access-panel');
  const employee = window._emp;
  if (!panel || !employee) return;

  panel.classList.add('open');
  panel.innerHTML = `<div class="loading-state" style="min-height:130px"><div class="spinner"></div></div>`;

  try {
    const rows = currentUser.role === 'employee'
      ? await api.get('/leave/mine')
      : await api.get(`/leave?employee_id=${encodeURIComponent(employeeId)}`);
    const name = safe(`${employee.first_name} ${employee.last_name}`);
    const content = rows.length ? `
      <div class="table-container">
        <table>
          <thead><tr><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th></tr></thead>
          <tbody>${rows.map((row) => {
            const days = Math.ceil((new Date(row.end_date) - new Date(row.start_date)) / 86400000) + 1;
            return `<tr><td><span class="badge badge-info">${safe(row.leave_type)}</span></td><td>${fmt.date(row.start_date)}</td><td>${fmt.date(row.end_date)}</td><td>${days}</td><td>${safe(row.reason || '—')}</td><td>${fmt.statusBadge(row.status)}</td></tr>`;
          }).join('')}</tbody>
        </table>
      </div>`
      : `<div class="empty-state"><p>No leave requests recorded for ${name}.</p></div>`;
    panel.innerHTML = `
      <div class="quick-access-panel-head">
        <h4>Leave History — ${name}</h4>
        <button type="button" class="btn btn-outline btn-sm" onclick="closeQuickAccessPanel()">Close</button>
      </div>
      ${content}`;
  } catch (error) {
    panel.innerHTML = `<div class="empty-state"><p>${safe(error.message || 'Could not load leave history.')}</p></div>`;
  }
}

function closeQuickAccessPanel() {
  const panel = document.getElementById('quick-access-panel');
  if (panel) {
    panel.classList.remove('open');
    panel.innerHTML = '';
  }
}

function openQuickAccessPanel(title) {
  const panel = document.getElementById('quick-access-panel');
  if (!panel) return null;
  panel.classList.add('open');
  panel.innerHTML = `
    <div class="quick-access-panel-head">
      <h4>${safe(title)}</h4>
      <button type="button" class="btn btn-outline btn-sm" onclick="closeQuickAccessPanel()">Close</button>
    </div>
    <div class="loading-state" style="min-height:130px"><div class="spinner"></div></div>`;
  return panel;
}

function quickAccessError(panel, error) {
  panel.innerHTML = `<div class="quick-access-panel-head"><h4>Quick Access</h4><button type="button" class="btn btn-outline btn-sm" onclick="closeQuickAccessPanel()">Close</button></div><div class="empty-state"><p>${safe(error.message || 'Could not load this staff information.')}</p></div>`;
}

async function savePromotion(id) {
  try {
    await api.post(`/employees/${id}/promotions`, {
      job_title: document.getElementById('promotion-title').value,
      employment_type: document.getElementById('promotion-employment-type').value,
      department_id: document.getElementById('promotion-department').value || null,
      manager_id: document.getElementById('promotion-manager').value || null,
      role: document.getElementById('promotion-role').value,
      salary: document.getElementById('promotion-salary').value,
      effective_date: document.getElementById('promotion-date').value,
      notes: document.getElementById('promotion-notes').value
    });
    document.querySelector('.modal-overlay')?.remove();
    toast('Promotion recorded and employee details updated', 'success');
    loadProfile();

function bytesToBase64(bytes) {
  return btoa(String.fromCharCode(...new Uint8Array(bytes)));
}

function base64ToBytes(value) {
  return Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
}

function getBrowserMessageSecret() {
  const key = 'hrconnect.secureMessage.secret';
  let secret = localStorage.getItem(key);
  if (!secret) {
    const bytes = new Uint8Array(32);
    crypto.getRandomValues(bytes);
    secret = bytesToBase64(bytes);
    localStorage.setItem(key, secret);
  }
  return base64ToBytes(secret);
}

async function getBrowserMessageKey(senderId, receiverId, salt) {
  const secret = getBrowserMessageSecret();
  const sourceKey = await crypto.subtle.importKey('raw', secret, 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      salt,
      iterations: 100000,
      hash: 'SHA-256'
    },
    sourceKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptBrowserMessage(senderId, receiverId, body) {
  if (!window.crypto?.subtle) throw new Error('Secure browser encryption is not available here.');
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await getBrowserMessageKey(senderId, receiverId, salt);
  const cipherText = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv },
    key,
    new TextEncoder().encode(body)
  );

  return {
    iv: bytesToBase64(iv),
    salt: bytesToBase64(salt),
    cipherText: bytesToBase64(cipherText)
  };
}

function saveBrowserMessage(message) {
  const key = 'hrconnect.secureMessages';
  const messages = JSON.parse(localStorage.getItem(key) || '[]');
  messages.unshift(message);
  localStorage.setItem(key, JSON.stringify(messages.slice(0, 200)));
}

function showSecureMessageModal() {
  const emp = window._emp;
  if (!emp || isOwn) return;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3>Send Message</h3>
        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">x</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">To</label>
          <input type="text" class="form-control" value="${safe(`${emp.first_name} ${emp.last_name}`)}" disabled>
        </div>
        <div class="form-group">
          <label class="form-label required">Message</label>
          <textarea id="secure-message-body" class="form-control" rows="5" placeholder="Write your message..."></textarea>
          <p class="secure-message-note">This message is encrypted with this browser's local key and saved only in this browser.</p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
        <button class="btn btn-primary" onclick="sendSecureBrowserMessage()">Send Message</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('secure-message-body')?.focus();
}

async function sendSecureBrowserMessage() {
  const emp = window._emp;
  const input = document.getElementById('secure-message-body');
  const body = input?.value.trim();
  if (!emp || !body) {
    toast('Write a message first', 'warning');
    return;
  }

  try {
    const encrypted = await encryptBrowserMessage(currentUser.id, emp.id, body);
    saveBrowserMessage({
      id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
      senderId: currentUser.id,
      receiverId: emp.id,
      receiverName: `${emp.first_name} ${emp.last_name}`,
      createdAt: new Date().toISOString(),
      encryption: 'AES-GCM',
      ...encrypted
    });
    document.querySelector('.modal-overlay')?.remove();
    toast('Encrypted message saved in this browser', 'success');
  } catch (e) {
    toast(e.message || 'Could not encrypt message', 'error');
  }
}

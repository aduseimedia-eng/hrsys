<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Profile — KenadHR</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/workspace.css" />
    <script>
      if (window.self !== window.top) {
        document.documentElement.classList.add("embedded-early");
      }
    </script>
    <style>
      .embedded-early body {
        overflow: auto !important;
        background: var(--bg-page) !important;
      }
      .embedded-early .app-shell {
        display: block !important;
        height: auto !important;
        min-height: 100vh !important;
        overflow: visible !important;
      }
      .embedded-early .sidebar,
      .embedded-early .topbar,
      .embedded-early .sidebar-backdrop {
        display: none !important;
      }
      .embedded-early .main-content {
        min-height: auto !important;
        width: 100% !important;
        max-width: none !important;
        padding: 22px !important;
        overflow: visible !important;
      }
      .profile-loader {
        min-height: min(60vh, 520px);
        display: grid;
        place-items: center;
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: linear-gradient(145deg, #fff, var(--navy-50));
      }
      .profile-loader-card { text-align:center; }
      .profile-loader-icon {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        margin: 0 auto 14px;
        border-radius: 16px;
        background: rgba(37,99,235,.12);
        color: #2563eb;
      }
      .profile-loader-icon .spinner { width: 25px; height: 25px; border-width: 3px; border-color: rgba(37,99,235,.22); border-top-color: #2563eb; }
      .profile-loader h2 { margin:0; color:var(--text-primary); font-size:1rem; }
      .profile-loader p { margin:6px 0 0; color:var(--text-secondary); font-size:.86rem; }

      .profile-hero {
        background: linear-gradient(120deg, #102c6a 0%, #1d5fc1 58%, #4d82e8 100%);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 18px;
        padding: 28px 30px 18px;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 24px;
        margin-bottom: 16px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 18px 44px rgba(29, 95, 193, 0.22);
      }
      .profile-hero::after {
        content: "";
        position: absolute;
        width: 320px;
        height: 320px;
        right: -120px;
        top: -200px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
      }
      .profile-hero .avatar-wrap {
        position: relative;
        flex-shrink: 0;
        z-index: 1;
      }
      .profile-hero .avatar {
        border: 4px solid rgba(255, 255, 255, 0.22);
        box-shadow: 0 12px 28px rgba(12, 48, 116, 0.3);
      }
      .profile-hero .avatar-wrap .edit-photo-btn {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 28px;
        height: 28px;
        background: #dbeafe;
        color: #174ea6;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border: 2px solid #174ea6;
        transition: background var(--duration);
      }
      .profile-hero .avatar-wrap .edit-photo-btn:hover {
        background: #fff;
      }
      .profile-hero h2 {
        font-size: 1.72rem;
        color: #fff;
        margin: 3px 0 4px;
        letter-spacing: -0.03em;
      }
      .profile-hero > div:not(.avatar-wrap):not(.profile-actions) {
        position: relative;
        z-index: 1;
      }
      .profile-eyebrow {
        color: rgba(255, 255, 255, 0.66);
        font-size: 0.68rem;
        font-weight: 750;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .profile-hero .role-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 0.8rem;
        margin-top: 6px;
      }
      .profile-meta {
        display: flex;
        gap: 8px;
        margin-top: 15px;
        flex-wrap: wrap;
      }
      .profile-meta-item {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 6px 9px;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 8px;
        background: rgba(10, 23, 66, 0.14);
        font-size: 0.76rem;
        color: rgba(255, 255, 255, 0.8);
      }
      .profile-meta-item svg {
        width: 15px;
        height: 15px;
        flex-shrink: 0;
      }
      .profile-tabs {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
        margin-top: 19px;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.18);
      }
      .profile-tabs button {
        padding: 0 0 8px;
        border: 0;
        border-bottom: 3px solid transparent;
        background: transparent;
        color: rgba(255, 255, 255, 0.82);
        font-size: 0.86rem;
        font-weight: 750;
        cursor: pointer;
      }
      .profile-tabs button.active,
      .profile-tabs button:hover {
        color: #fff;
        border-bottom-color: #fff;
      }

      .profile-actions {
        position: relative;
        z-index: 1;
        margin-left: auto;
        display: flex;
        gap: 8px;
        flex-shrink: 0;
        align-self: flex-start;
      }
      .profile-actions .btn {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .profile-actions .btn:hover {
        background: rgba(255, 255, 255, 0.18);
      }
      .profile-actions .btn-primary {
        background: var(--mint-100);
        color: var(--navy-950);
        border-color: transparent;
      }
      .profile-actions .btn-primary:hover {
        background: #fff;
        color: var(--navy-950);
      }

      .secure-message-note {
        margin-top: 8px;
        color: var(--text-muted);
        font-size: 0.78rem;
        line-height: 1.5;
      }

      .delete-confirm-icon {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(225, 29, 72, 0.1);
        color: var(--rose-600);
        margin-bottom: 14px;
      }
      .delete-confirm-copy {
        color: var(--text-secondary);
        font-size: 0.9rem;
        line-height: 1.55;
        margin-top: 8px;
      }
      .delete-confirm-name {
        color: var(--text-primary);
        font-weight: 700;
      }

      .profile-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(300px, 0.82fr);
        gap: 16px;
        align-items: start;
      }
      .profile-workspace {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: 22px;
        align-items: start;
      }
      .profile-vitals {
        position: sticky;
        top: 18px;
        padding: 20px;
        border: 1px solid #cfe0ff;
        border-top: 4px solid #2563eb;
        border-radius: 16px;
        background: var(--bg-surface);
        box-shadow: var(--shadow-sm);
      }
      .profile-vitals .avatar {
        width: 112px !important;
        height: 112px !important;
        font-size: 2.2rem !important;
        margin-bottom: 16px;
        border-radius: 16px;
      }
      .profile-vitals h3 {
        margin: 0 0 5px;
        font-size: 1.05rem;
      }
      .profile-vitals .vitals-role {
        color: var(--text-secondary);
        font-size: 0.84rem;
        margin-bottom: 15px;
      }
      .vitals-list {
        border-top: 1px solid var(--border);
        padding-top: 11px;
      }
      .vital-line {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 7px 0;
        color: var(--text-secondary);
        font-size: 0.82rem;
        line-height: 1.35;
      }
      .vital-mark {
        color: #2563eb;
        font-weight: 900;
      }
      .profile-main .profile-hero .avatar-wrap {
        display: none;
      }
      .profile-overview {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .profile-overview-item {
        min-width: 0;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg-surface);
        box-shadow: var(--shadow-sm);
      }
      .profile-overview-item span {
        display: block;
        color: var(--text-muted);
        font-size: 0.66rem;
        font-weight: 750;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .profile-overview-item strong {
        display: block;
        overflow: hidden;
        margin-top: 5px;
        color: var(--text-primary);
        font-size: 0.9rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .profile-grid .card {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow-sm);
      }
      .profile-grid .card-header {
        padding: 15px 18px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(90deg, #fbfcff, #f6f8ff);
      }
      .profile-grid .card-header h3 {
        color: var(--text-primary);
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .profile-grid .card-body {
        padding: 8px 18px;
      }
      .profile-grid .card[data-profile-tab] {
        display: none;
      }
      .profile-grid[data-profile-active="personal"]
        .card[data-profile-tab="personal"],
      .profile-grid[data-profile-active="job"] .card[data-profile-tab="job"],
      .profile-grid[data-profile-active="timeoff"]
        .card[data-profile-tab="timeoff"],
      .profile-grid[data-profile-active="emergency"]
        .card[data-profile-tab="emergency"],
      .profile-grid[data-profile-active="performance"]
        .card[data-profile-tab="performance"],
      .profile-grid[data-profile-active="training"]
        .card[data-profile-tab="training"],
      .profile-grid[data-profile-active="benefits"]
        .card[data-profile-tab="benefits"],
      .profile-grid[data-profile-active="assets"]
        .card[data-profile-tab="assets"],
      .profile-grid[data-profile-active="more"] .card[data-profile-tab="more"] {
        display: block;
      }
      .profile-grid .profile-wide {
        grid-column: 1/-1;
      }
      .profile-record-list {
        display: grid;
        gap: 10px;
        padding: 8px 0;
      }
      .profile-record {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        padding: 13px 0;
        border-bottom: 1px solid var(--border);
      }
      .profile-record:last-child {
        border-bottom: 0;
      }
      .profile-record strong {
        display: block;
        font-size: 0.88rem;
      }
      .profile-record small {
        display: block;
        margin-top: 4px;
        color: var(--text-secondary);
        line-height: 1.4;
      }
      .profile-record-meta {
        text-align: right;
        flex-shrink: 0;
      }
      .info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 11px 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.875rem;
      }
      .info-row:last-child {
        border-bottom: none;
      }
      .info-row .label {
        color: var(--text-muted);
        font-size: 0.78rem;
      }
      .info-row .value {
        max-width: 58%;
        color: var(--text-primary);
        font-size: 0.82rem;
        font-weight: 650;
        text-align: right;
      }
      .social-links {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        padding: 10px 0;
      }
      .social-link {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 10px;
        color: var(--text-primary);
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        text-decoration: none;
        transition:
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }
      .social-link:hover {
        border-color: #8fb0e5;
        box-shadow: 0 4px 12px rgba(19, 61, 123, 0.09);
      }
      .social-link.is-empty {
        opacity: 0.62;
      }
      .social-link-icon {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        color: #fff;
        background: #0a66c2;
      }
      .social-link-icon.instagram {
        background: linear-gradient(135deg, #833ab4, #fd1d1d 52%, #fcb045);
      }
      .social-link-icon.facebook {
        background: #1877f2;
      }
      .social-link-icon.x {
        background: #111827;
      }
      .social-link-icon svg {
        width: 17px;
        height: 17px;
      }
      .social-link span {
        min-width: 0;
        overflow: hidden;
        font-size: 0.78rem;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .profile-inline-editor {
        display: none;
        grid-column: 1 / -1;
      }
      .profile-grid[data-profile-active="personal"] .profile-inline-editor {
        display: block;
      }
      .profile-grid.profile-has-inline[data-profile-active="personal"]
        .profile-personal-card {
        display: none;
      }
      .profile-inline-editor .modal {
        width: 100%;
        max-width: none;
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow-sm);
      }
      .profile-inline-editor .modal-header {
        padding: 18px 22px;
        background: #fff;
        border-bottom: 1px solid var(--border);
      }
      .profile-inline-editor .modal-body {
        padding: 22px;
      }
      .profile-inline-editor .modal-footer {
        padding: 16px 22px;
        border-top: 1px solid var(--border);
        background: #fbfcff;
      }
      .profile-inline-editor .modal-header p {
        margin: 5px 0 0;
        color: var(--text-muted);
        font-size: 0.82rem;
      }
      .profile-inline-editor .form-grid {
        gap: 16px 18px;
      }
      body:has(.modal-overlay) {
        overflow: hidden;
      }
      .modal-overlay {
        background: rgba(18, 31, 61, 0.68);
        backdrop-filter: blur(10px) saturate(0.82);
        -webkit-backdrop-filter: blur(10px) saturate(0.82);
      }
      .modal-overlay .modal {
        border-color: rgba(255, 255, 255, 0.9);
        box-shadow: 0 30px 84px rgba(8, 18, 43, 0.4);
      }
      .form-section-title {
        grid-column: 1 / -1;
        margin: 8px 0 -2px;
        padding-top: 17px;
        border-top: 1px solid var(--border);
        color: #08752a;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .form-section-title:first-child {
        margin-top: 0;
        padding-top: 0;
        border-top: 0;
      }
      .quick-access-panel {
        display: none;
        width: 100%;
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
      }
      .quick-access-panel.open {
        display: block;
      }
      .quick-access-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .quick-access-panel-head h4 {
        font-size: 1rem;
      }
      .quick-access-panel .table-container {
        max-height: 360px;
        overflow: auto;
      }
      .quick-access-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        padding: 10px 0 2px;
      }
      .quick-access-actions .btn {
        min-height: 38px;
        border-radius: 9px;
        font-size: 0.78rem;
      }

      @media (max-width: 768px) {
        .profile-workspace {
          grid-template-columns: 1fr;
        }
        .profile-vitals {
          position: static;
          display: flex;
          gap: 16px;
          align-items: center;
        }
        .profile-vitals .vitals-list {
          display: none;
        }
        .profile-hero {
          flex-direction: column;
          text-align: center;
        }
        .profile-meta {
          justify-content: center;
        }
        .profile-actions {
          margin-left: 0;
        }
        .profile-grid {
          grid-template-columns: 1fr;
        }
        .profile-overview {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 500px) {
        .profile-hero {
          padding: 24px 18px;
        }
        .profile-overview {
          grid-template-columns: 1fr;
        }
        .profile-actions {
          width: 100%;
          justify-content: center;
          flex-wrap: wrap;
        }
      }

      /* Employee record composition: a focused header, compact summary, then live sections. */
      .profile-workspace {
        display: block;
        position: relative;
      }
      .profile-main {
        min-width: 0;
      }
      .profile-hero {
        min-height: 248px;
        align-items: flex-start;
        padding: 28px 30px 0;
        background: linear-gradient(120deg, #123a8c, #2563d9 58%, #4f86e8) !important;
        border: 0 !important;
        border-radius: 18px !important;
        box-shadow: 0 14px 30px rgba(24, 59, 143, 0.16) !important;
      }
      .profile-hero .avatar-wrap {
        display: block !important;
      }
      .profile-hero .avatar-wrap .avatar {
        width: 128px !important;
        height: 128px !important;
        border-radius: 50% !important;
        border: 4px solid rgba(255, 255, 255, 0.82);
        box-shadow: 0 10px 24px rgba(12, 38, 98, 0.28);
      }
      .profile-workspace,
      .profile-workspace button,
      .profile-workspace input,
      .profile-workspace textarea,
      .profile-workspace select {
        font-family: var(--font-body);
      }
      .profile-hero h2 {
        margin-top: 4px;
        color: #fff !important;
        font-family: var(--font-display);
        font-size: 2rem;
        white-space: nowrap;
      }
      .profile-hero p {
        color: rgba(255, 255, 255, 0.72) !important;
      }
      .profile-hero > div:nth-child(2) {
        min-width: 0;
        flex: 1;
      }
      .profile-meta {
        display: none;
      }
      .profile-tabs {
        width: 100%;
        margin-top: 20px;
        padding: 0;
        border: 0;
        gap: 8px;
        flex-wrap: nowrap;
      }
      .profile-tabs button {
        flex: 0 0 auto;
        padding: 13px 12px 14px;
        border: 0;
        border-radius: 9px 9px 0 0;
        color: #fff;
        font-size: 0.88rem;
      }
      .profile-tabs button.active {
        background: #fff;
        color: #183b8f;
      }
      .profile-tabs button:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.12);
        border: 0;
      }
      .profile-tabs button.active:hover {
        color: #183b8f;
        background: #fff;
      }
      .profile-actions {
        gap: 10px;
      }
      .profile-actions .profile-change-btn {
        background: #fff;
        color: #183b8f;
        border: 0;
        border-radius: 999px;
        font-weight: 750;
      }
      .profile-actions .profile-change-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .profile-actions .profile-more-btn {
        display: grid;
        place-items: center;
        width: 46px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: #fff;
        color: #183b8f;
      }
      .profile-actions .profile-more-btn svg {
        width: 20px;
        height: 20px;
      }
      .profile-action-menu {
        position: absolute;
        top: 52px;
        right: 0;
        display: none;
        min-width: 190px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 16px 34px rgba(19, 37, 66, 0.2);
      }
      .profile-action-menu.open {
        display: grid;
        gap: 3px;
      }
      .profile-action-menu button {
        padding: 10px 11px;
        border-radius: 8px;
        color: #39445a;
        text-align: left;
        font-size: 0.82rem;
      }
      .profile-action-menu button:hover {
        background: #eef4ff;
        color: #183b8f;
      }
      .profile-action-menu .danger {
        color: #c43c55;
      }
      .profile-vitals {
        position: absolute;
        z-index: 3;
        top: 274px;
        left: 30px;
        width: 224px;
        padding: 2px 18px 0 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }
      .profile-vitals .avatar,
      .profile-vitals h3,
      .profile-vitals .vitals-role,
      .profile-vitals label {
        display: none !important;
      }
      .profile-vitals::before {
        content: "Employee summary";
        display: block;
        margin: 0 0 12px;
        color: #183b8f;
        font-size: 0.88rem;
        font-weight: 800;
      }
      .vitals-list {
        padding-top: 4px;
      }
      .vital-line {
        padding: 8px 0;
      }
      .vital-mark {
        color: #2563d9;
      }
      .profile-overview,
      .profile-grid {
        margin-left: 270px;
      }
      .profile-overview {
        margin-top: 22px;
        gap: 0;
      }
      .profile-overview-item {
        min-height: 70px;
        padding: 10px 16px;
        border: 0;
        border-right: 1px solid #dfe7f5;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }
      .profile-overview-item:first-child { padding-left: 0; }
      .profile-overview-item:last-child { border-right: 0; }
      .profile-grid .card {
        overflow: visible;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }
      .profile-grid .card-header {
        padding: 0 0 11px;
        border-bottom: 1px solid #dfe7f5;
        background: transparent;
      }
      .profile-grid .card-header h3 {
        color: #183b8f;
      }
      .profile-grid[data-profile-active="personal"] {
        grid-template-columns: repeat(2, minmax(0, 1fr));

      }
      .profile-grid[data-profile-active="personal"]::before {
        content: "Personal";

      }
      .profile-grid[data-profile-active="personal"] .profile-personal-card,
      .profile-grid[data-profile-active="personal"] .profile-personal-wide {
        grid-column: auto;
      }
      .profile-grid[data-profile-active="personal"] .profile-personal-wide {
        grid-column: 1 / -1;
      }
      .profile-grid[data-profile-active="personal"]
        .profile-personal-card
        .card-header,
      .profile-grid[data-profile-active="personal"]
        .profile-personal-wide
        .card-header {
        padding: 2px 0 11px;
        border-bottom: 1px solid #dfe7f5;
      }
      .profile-grid[data-profile-active="personal"]
        .profile-personal-card
        .card-header
        h3,
      .profile-grid[data-profile-active="personal"]
        .profile-personal-wide
        .card-header
        h3 {
        font-family: var(--font-display);
        font-size: 1.22rem;
        text-transform: none;
        letter-spacing: 0;
      }
      .profile-grid[data-profile-active="personal"]
        .profile-personal-card
        .card-body,
      .profile-grid[data-profile-active="personal"]
        .profile-personal-wide
        .card-body {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 17px 16px;
        padding: 15px 0 10px;
      }
      .profile-grid[data-profile-active="personal"]
        .profile-personal-card
        .info-row,
      .profile-grid[data-profile-active="personal"]
        .profile-personal-wide
        .info-row {
        display: block;
        min-width: 0;
        padding: 0 0 11px;
        border: 0;
      }
      .profile-grid[data-profile-active="personal"]
        .profile-personal-card
        .info-row:only-child,
      .profile-grid[data-profile-active="personal"]
        .profile-personal-wide
        .info-row:only-child {
        grid-column: 1 / -1;
      }
      .profile-grid[data-profile-active="personal"]
        .profile-personal-card
        .info-row
        .label,
      .profile-grid[data-profile-active="personal"]
        .profile-personal-wide
        .info-row
        .label {
        display: block;
        margin: 0 0 6px;
        color: #39445a;
        font-size: 0.8rem;
        font-weight: 650;
      }
      .profile-grid[data-profile-active="personal"]
        .profile-personal-card
        .info-row
        .value,
      .profile-grid[data-profile-active="personal"]
        .profile-personal-wide
        .info-row
        .value {
        display: block;
        max-width: none;
        min-height: 0;
        padding: 0;
        overflow-wrap: anywhere;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: #26344e;
        font-size: 0.88rem;
        font-weight: 500;
        text-align: left;
      }
      @media (max-width: 900px) {
        .profile-vitals {
          position: static;
          width: auto;
          margin: 16px 0;
          padding: 16px;
          border: 1px solid var(--border);

          margin-left: 0;

      @media (max-width: 640px) {
        .profile-hero {
          min-height: 0;
          padding: 22px 18px 0;
          flex-direction: column;
          text-align: left;

        .profile-hero .avatar-wrap .avatar {
          width: 96px !important;
          height: 96px !important;
          border-radius: 16px !important;
        }
        .profile-hero h2 {
          font-size: 1.65rem;
        }
        .profile-tabs {
          margin-top: 20px;
          gap: 8px;
          overflow-x: auto;
        }
        .profile-tabs button {
          padding: 13px 10px;
        }
        .profile-grid[data-profile-active="personal"]
          .profile-personal-card
          .card-body,
        .profile-grid[data-profile-active="personal"]
          .profile-personal-wide
          .card-body {
          grid-template-columns: 1fr;
          padding: 14px 18px 20px;
        }

  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <header class="topbar">
        <div class="topbar-title" id="page-title">Employee Profile</div>
        <div class="topbar-actions"></div>
      </header>
      <main class="main-content" id="profile-content">
        <div class="profile-loader" role="status" aria-live="polite">
          <div class="profile-loader-card">
            <div class="profile-loader-icon"><div class="spinner"></div></div>
            <h2>Opening staff profile</h2>
            <p>Loading employee details and records…</p>
          </div>
        </div>
      </main>
    </div>

    <script src="../js/api.js"></script>
    <script>
      const currentUser = requireAuth();
      if (!currentUser) throw new Error("redirect");
      buildSidebar("employees");

      const params = new URLSearchParams(window.location.search);
      const empId = parseInt(params.get("id")) || currentUser.id;
      const isOwn = empId === currentUser.id;
      const isAdmin = currentUser.role === "admin";
      let departments = [];
      const JOB_TITLES = [
        "HR Director",
        "HR Officer",
        "Admin Officer",
        "Operations Manager",
        "Operations Officer",
        "Public Relations Lead",
        "Public Relations Officer",
        "IT Manager",
        "IT Support Officer",
        "Senior Developer",
        "Frontend Developer",
        "Account Manager",
        "Account Analyst",
        "Member Management Lead",
        "Member Officer",
      ];
      const EMPLOYMENT_TYPES = [
        { value: "staff", label: "Staff" },
        { value: "contractual", label: "Contractual" },
        { value: "national_service", label: "National Service Personnel" },
        { value: "internship", label: "Internship Staff" },
      ];

      function profileIcon(name) {
        const paths = {
          id: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h4M7 13h6M17 10h.01M17 14h.01"/>',
          email:
            '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
          phone:
            '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07A19.5 19.5 0 0 1 3.07 9.8 19.8 19.8 0 0 1 0 1.14 2 2 0 0 1 2 0h3a2 2 0 0 1 2 1.72c.12.95.36 1.88.7 2.81a2 2 0 0 1-.45 2.11L6.09 7.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.93.34 1.86.58 2.81.7A2 2 0 0 1 22 16.92Z"/>',
          department:
            '<path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6M9 11h.01M15 11h.01"/>',
          employment:
            '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
          manager:
            '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
          edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
          message:
            '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/>',
          more: '<circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/>',
        };
        return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.id}</svg>`;
      }

      function socialLink(platform, url) {
        const icons = {
          linkedin:
            '<path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V8.99h3.41v1.57h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.32 7.42a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.1 20.45H3.54V8.99H7.1v11.46z"/>',
          instagram:
            '<path d="M7.2 2h9.6A5.2 5.2 0 0 1 22 7.2v9.6a5.2 5.2 0 0 1-5.2 5.2H7.2A5.2 5.2 0 0 1 2 16.8V7.2A5.2 5.2 0 0 1 7.2 2zm0 2A3.2 3.2 0 0 0 4 7.2v9.6A3.2 3.2 0 0 0 7.2 20h9.6a3.2 3.2 0 0 0 3.2-3.2V7.2A3.2 3.2 0 0 0 16.8 4H7.2zm4.8 2.8a5.2 5.2 0 1 1 0 10.4 5.2 5.2 0 0 1 0-10.4zm0 2a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4zm5.4-2.95a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z"/>',
          facebook:
            '<path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.03 1.79-4.7 4.53-4.7 1.31 0 2.69.24 2.69.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.88v2.27h3.33l-.53 3.49h-2.8V24C19.61 23.09 24 18.1 24 12.07z"/>',
          x: '<path d="M18.24 2.25h3.31l-7.23 8.26 8.5 11.24h-6.66l-5.21-6.82-5.97 6.82H1.68l7.73-8.84L1.25 2.25h6.83l4.71 6.23 5.45-6.23zm-1.16 17.52h1.83L7.08 4.13H5.12L17.08 19.77z"/>',
        };
        const labels = {
          linkedin: "LinkedIn",
          instagram: "Instagram",
          facebook: "Facebook",
          x: "X",
        };
        const validUrl = /^https?:\/\//i.test(url || "");
        const content = `<span class="social-link-icon ${platform}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${icons[platform]}</svg></span><span>${labels[platform]}${validUrl ? "" : " · Not provided"}</span>`;
        return validUrl
          ? `<a class="social-link" href="${safe(url)}" target="_blank" rel="noopener noreferrer">${content}</a>`
          : `<div class="social-link is-empty">${content}</div>`;
      }

      function safe(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[char],
        );
      }

      function valueOrDash(value) {
        return value == null || value === "" ? "--" : safe(value);
      }

      function employmentTypeLabel(value) {
        return (
          EMPLOYMENT_TYPES.find((type) => type.value === value) ||
          EMPLOYMENT_TYPES[0]
        ).label;
      }

      function employeeCodePrefix() {
        return (
          String(api.getCompanyPreferences()?.employee_code_prefix || "EMP-")
            .trim()
            .toUpperCase() || "EMP-"
        );
      }

      function infoRow(label, value) {
        return `<div class="info-row"><span class="label">${safe(label)}</span><span class="value">${valueOrDash(value)}</span></div>`;
      }

      function goBackToEmployees() {
        if (window.self !== window.top) {
          window.location.replace("employees.html");
          return;
        }
        window.location.replace("employees.html");
      }
      function optionList(options, selectedValue, placeholder = "— Select —") {
        return `<option value="">${placeholder}</option>${options
          .map((option) => {
            const value = typeof option === "object" ? option.value : option;
            const label = typeof option === "object" ? option.label : option;
            return `<option value="${safe(value)}" ${String(value) === String(selectedValue || "") ? "selected" : ""}>${safe(label)}</option>`;
          })
          .join("")}`;
      }

      async function loadProfile() {
        try {
          const isHr = ["admin", "manager"].includes(currentUser.role);
          const [
            emp,
            deptRows,
            promotions,
            contracts,
            benefits,
            leaveRows,
            reviewRows,
            trainingRows,
            assetRows,
          ] = await Promise.all([
            api.get(`/employees/${empId}`),
            api.get("/employees/departments"),
            api.get(`/employees/${empId}/promotions`),
            api.get(`/contracts/employee/${empId}`),
            api.get("/benefits?include_inactive=true"),
            api.get(
              currentUser.role === "employee"
                ? "/leave/mine"
                : `/leave?employee_id=${empId}`,
            ),
            api.get(`/performance/employee/${empId}`),
            api.get(
              currentUser.role === "employee" ? "/training/mine" : "/training",
            ),
            isHr ? api.get("/assets") : Promise.resolve([]),
          ]);
          departments = deptRows || [];
          document.getElementById("page-title").textContent =
            `${emp.first_name} ${emp.last_name}`;

          const canEdit = isOwn || isAdmin;

          document.getElementById("profile-content").innerHTML = `
      <div class="profile-workspace">
      <aside class="profile-vitals">
        ${
          emp.photo_url
            ? `<img src="${assetUrl(emp.photo_url)}" class="avatar" style="object-fit:cover" alt="">`
            : `<div class="avatar">${fmt.initials(emp.first_name, emp.last_name)}</div>`
        }
        ${isOwn ? `<label style="display:inline-block;margin:-8px 0 12px;font-size:.78rem;color:#08752a;font-weight:700;cursor:pointer">Change photo<input type="file" accept="image/*" style="display:none" onchange="uploadPhoto(this.files[0])"></label>` : ""}
        <h3>${emp.first_name} ${emp.last_name}</h3>
        <div class="vitals-role">${emp.job_title || "Employee"}</div>
        <div class="vitals-list">
          <div class="vital-line"><span class="vital-mark">${profileIcon("id")}</span><span>${emp.employee_code || "Employee ID not assigned"}</span></div>
          ${emp.email ? `<div class="vital-line"><span class="vital-mark">${profileIcon("email")}</span><span>${emp.email}</span></div>` : ""}
          ${emp.phone ? `<div class="vital-line"><span class="vital-mark">${profileIcon("phone")}</span><span>${emp.phone}</span></div>` : ""}
          <div class="vital-line"><span class="vital-mark">${profileIcon("department")}</span><span>${emp.department_name || "Department not assigned"}</span></div>
          <div class="vital-line"><span class="vital-mark">${profileIcon("employment")}</span><span>${employmentTypeLabel(emp.employment_type)}</span></div>
          ${emp.manager_name ? `<div class="vital-line"><span class="vital-mark">${profileIcon("manager")}</span><span>Manager: ${emp.manager_name}</span></div>` : ""}
        </div>
      </aside>
      <section class="profile-main">
      <!-- Profile workspace header -->
      <div class="profile-hero">
        <div class="avatar-wrap">
          ${
            emp.photo_url
              ? `<img src="${assetUrl(emp.photo_url)}" class="avatar" style="width:96px;height:96px;object-fit:cover" alt="">`
              : `<div class="avatar" style="width:96px;height:96px;font-size:2rem">${fmt.initials(emp.first_name, emp.last_name)}</div>`
          }
          ${
            isOwn
              ? `<label class="edit-photo-btn" title="Change photo">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
            <input type="file" accept="image/*" style="display:none" onchange="uploadPhoto(this.files[0])">
          </label>`
              : ""
          }
        </div>
        <div style="flex:1">
          <div class="profile-eyebrow">Employee profile</div>
          <h2>${emp.first_name} ${emp.last_name}</h2>
          <p style="color:rgba(255,255,255,.6);font-size:.9rem">${emp.job_title || "—"}</p>
          <div style="margin-top:8px">${fmt.statusBadge(emp.role)} ${emp.department_name ? `<span class="badge badge-info" style="margin-left:6px">${emp.department_name}</span>` : ""}</div>
          <div class="profile-meta">
            ${emp.email ? `<div class="profile-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>${emp.email}</div>` : ""}
            ${emp.phone ? `<div class="profile-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8a19.79 19.79 0 01-3.07-8.66A2 2 0 012 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>${emp.phone}</div>` : ""}
            ${emp.hire_date ? `<div class="profile-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Joined ${fmt.date(emp.hire_date)}</div>` : ""}
          </div>
          <nav class="profile-tabs" aria-label="Employee profile sections">
            <button type="button" class="active" data-profile-tab-button="personal" onclick="setEmployeeProfileTab('personal')">Personal</button>
            <button type="button" data-profile-tab-button="job" onclick="setEmployeeProfileTab('job')">Job</button>
            <button type="button" data-profile-tab-button="timeoff" onclick="setEmployeeProfileTab('timeoff')">Time Off</button>
            <button type="button" data-profile-tab-button="emergency" onclick="setEmployeeProfileTab('emergency')">Emergency</button>
            <button type="button" data-profile-tab-button="performance" onclick="setEmployeeProfileTab('performance')">Performance</button>
            <button type="button" data-profile-tab-button="training" onclick="setEmployeeProfileTab('training')">Training</button>
            <button type="button" data-profile-tab-button="benefits" onclick="setEmployeeProfileTab('benefits')">Benefits</button>
            ${isHr ? '<button type="button" data-profile-tab-button="assets" onclick="setEmployeeProfileTab(\'assets\')">Assets</button>' : ""}
            <button type="button" data-profile-tab-button="more" onclick="setEmployeeProfileTab('more')">More</button>
          </nav>
        </div>
        <div class="profile-actions">
          ${canEdit ? `<button type="button" class="btn btn-sm profile-change-btn" onclick="showEditModal()">${profileIcon("edit")}<span>Edit profile</span></button>` : ""}
          ${!isOwn ? `<button type="button" class="btn btn-sm profile-change-btn" onclick="showSecureMessageModal()">${profileIcon("message")}<span>Send Message</span></button>` : ""}
          <button type="button" class="btn btn-sm profile-more-btn" aria-label="More profile actions" onclick="toggleProfileActionMenu()">${profileIcon("more")}</button>
          <div class="profile-action-menu" id="profile-action-menu">
            <button type="button" onclick="goBackToEmployees()">Back to employees</button>
            ${!isOwn ? `<button type="button" onclick="showSecureMessageModal()">Send message</button>` : ""}
            ${isAdmin && !isOwn ? `<button type="button" onclick="showPromotionModal()">Promote employee</button><button type="button" onclick="showAccountModal(${emp.id})">Account settings</button><button type="button" class="danger" onclick="showDeleteEmployeeModal(${emp.id})">Delete employee</button>` : ""}
          </div>
        </div>
      </div>

      <section class="profile-overview">
        <div class="profile-overview-item"><span>Employee ID</span><strong>${emp.employee_code || "Not assigned"}</strong></div>
        <div class="profile-overview-item"><span>Department</span><strong>${emp.department_name || "Not assigned"}</strong></div>
        <div class="profile-overview-item"><span>Employment</span><strong>${employmentTypeLabel(emp.employment_type)}</strong></div>
        <div class="profile-overview-item"><span>Started</span><strong>${emp.hire_date ? fmt.date(emp.hire_date) : "Not recorded"}</strong></div>
      </section>

      <!-- Details grid -->
      <div class="profile-grid" id="employee-profile-grid" data-profile-active="personal">
        <!-- Personal profile -->
        <div class="card profile-personal-card" id="personal-information" data-profile-tab="personal">
          <div class="card-header"><h3>Basic Information</h3></div>
          <div class="card-body">
            <div class="info-row"><span class="label">Full Name</span><span class="value">${emp.first_name} ${emp.last_name}</span></div>
            <div class="info-row"><span class="label">Date of Birth</span><span class="value">${emp.date_of_birth ? fmt.date(emp.date_of_birth) : "—"}</span></div>
            <div class="info-row"><span class="label">Phone</span><span class="value">${emp.phone || "—"}</span></div>
            <div class="info-row"><span class="label">Email</span><span class="value">${emp.email}</span></div>
            <div class="info-row"><span class="label">Address</span><span class="value" style="max-width:200px;text-align:right">${emp.address || "—"}</span></div>
          </div>
        </div>

        <div class="card profile-personal-card" data-profile-tab="personal"><div class="card-header"><h3>Address</h3></div><div class="card-body">${infoRow("Home Address", emp.address || "Not provided")}</div></div>
        <div class="card profile-personal-card" data-profile-tab="personal"><div class="card-header"><h3>Contact</h3></div><div class="card-body">${infoRow("Email", emp.email)}${infoRow("Phone", emp.phone || "Not provided")}</div></div>
        <div class="card profile-personal-card" data-profile-tab="personal"><div class="card-header"><h3>Social Links</h3></div><div class="card-body"><div class="social-links">${socialLink("linkedin", emp.linkedin_url)}${socialLink("instagram", emp.instagram_url)}${socialLink("facebook", emp.facebook_url)}${socialLink("x", emp.twitter_url)}</div></div></div>
        ${canEdit ? '<section id="profile-inline-editor" class="profile-inline-editor" aria-label="Edit employee profile"></section>' : ""}

        <!-- Work info -->
        <div class="card" id="work-information" data-profile-tab="job">
          <div class="card-header"><h3>Work Information</h3></div>
          <div class="card-body">
            <div class="info-row"><span class="label">Department</span><span class="value">${emp.department_name || "—"}</span></div>
            <div class="info-row"><span class="label">Employment Type</span><span class="value">${employmentTypeLabel(emp.employment_type)}</span></div>

      function setEmployeeProfileTab(tab) {
        const allowed = [
          "personal",
          "job",
          "timeoff",
          "emergency",
          "performance",
          "training",
          "benefits",
          "assets",
          "more",
        ];
        const selected = allowed.includes(tab) ? tab : "personal";
        const grid = document.getElementById("employee-profile-grid");
        if (grid) grid.dataset.profileActive = selected;
        document
          .querySelectorAll("[data-profile-tab-button]")
          .forEach((button) => {
            button.classList.toggle(
              "active",
              button.dataset.profileTabButton === selected,
            );
          });
        if (window.location.hash.slice(1) !== selected)
          window.history.replaceState(null, "", `#${selected}`);
      }

      async function showEmployeeLeaveHistory(employeeId) {
        const panel = document.getElementById("quick-access-panel");
        const employee = window._emp;
        if (!panel || !employee) return;

        panel.classList.add("open");
        panel.innerHTML = `<div class="loading-state" style="min-height:130px"><div class="spinner"></div></div>`;

        try {
          const rows =
            currentUser.role === "employee"
              ? await api.get("/leave/mine")
              : await api.get(
                  `/leave?employee_id=${encodeURIComponent(employeeId)}`,
                );
          const name = safe(`${employee.first_name} ${employee.last_name}`);
          const content = rows.length
            ? `
      <div class="table-container">
        <table>
          <thead><tr><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th></tr></thead>
          <tbody>${rows
            .map((row) => {
              const days =
                Math.ceil(
                  (new Date(row.end_date) - new Date(row.start_date)) /
                    86400000,
                ) + 1;
              return `<tr><td><span class="badge badge-info">${safe(row.leave_type)}</span></td><td>${fmt.date(row.start_date)}</td><td>${fmt.date(row.end_date)}</td><td>${days}</td><td>${safe(row.reason || "—")}</td><td>${fmt.statusBadge(row.status)}</td></tr>`;
            })
            .join("")}</tbody>
        </table>
      </div>`
            : `<div class="empty-state"><p>No leave requests recorded for ${name}.</p></div>`;
          panel.innerHTML = `
      <div class="quick-access-panel-head">
        <h4>Leave History — ${name}</h4>
        <button type="button" class="btn btn-outline btn-sm" onclick="closeQuickAccessPanel()">Close</button>
      </div>
      ${content}`;
        } catch (error) {
          panel.innerHTML = `<div class="empty-state"><p>${safe(error.message || "Could not load leave history.")}</p></div>`;
        }
      }

      function closeQuickAccessPanel() {
        const panel = document.getElementById("quick-access-panel");
        if (panel) {
          panel.classList.remove("open");
          panel.innerHTML = "";
        }
      }

      function openQuickAccessPanel(title) {
        const panel = document.getElementById("quick-access-panel");
        if (!panel) return null;
        panel.classList.add("open");
        panel.innerHTML = `
    <div class="quick-access-panel-head">
      <h4>${safe(title)}</h4>
      <button type="button" class="btn btn-outline btn-sm" onclick="closeQuickAccessPanel()">Close</button>
    </div>
    <div class="loading-state" style="min-height:130px"><div class="spinner"></div></div>`;
        return panel;
      }

      function quickAccessError(panel, error) {
        panel.innerHTML = `<div class="quick-access-panel-head"><h4>Quick Access</h4><button type="button" class="btn btn-outline btn-sm" onclick="closeQuickAccessPanel()">Close</button></div><div class="empty-state"><p>${safe(error.message || "Could not load this staff information.")}</p></div>`;
      }

            'e-license-number', 'e-license-class', 'e-license-expiry',

              group.hidden = true;

              section.dataset.profileExtended = 'true';
              section.hidden = true;

          const editor = document.getElementById("profile-inline-editor");
          const modal = overlay.querySelector(".modal");
          if (!editor || !modal) return;
          modal.querySelector(".modal-close")?.remove();
          modal.querySelector(".modal-footer .btn-outline")?.remove();
          modal.querySelector(".modal-header h3").textContent =
            "Personal information";

            .querySelector(".modal-header")
            .insertAdjacentHTML(
              "beforeend",
              "<p>Update your details below, then save all changes when you are done.</p>",

          editor.appendChild(modal);
          overlay.remove();
        }

        const extended = overlay?.querySelectorAll('[data-profile-extended]') || [];
        const show = Array.from(extended).some((element) => element.hidden);
        extended.forEach((element) => { element.hidden = !show; });
        button.textContent = show ? 'Fewer fields' : 'More fields';

      function bytesToBase64(bytes) {
        return btoa(String.fromCharCode(...new Uint8Array(bytes)));
      }

      function base64ToBytes(value) {
        return Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
      }

      function getBrowserMessageSecret() {
        const key = "hrconnect.secureMessage.secret";
        let secret = localStorage.getItem(key);
        if (!secret) {
          const bytes = new Uint8Array(32);
          crypto.getRandomValues(bytes);
          secret = bytesToBase64(bytes);
          localStorage.setItem(key, secret);
        }
        return base64ToBytes(secret);
      }

      async function getBrowserMessageKey(senderId, receiverId, salt) {
        const secret = getBrowserMessageSecret();
        const sourceKey = await crypto.subtle.importKey(
          "raw",
          secret,
          "PBKDF2",
          false,
          ["deriveKey"],
        );
        return crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt,
            iterations: 100000,
            hash: "SHA-256",
          },
          sourceKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"],
        );
      }

      async function encryptBrowserMessage(senderId, receiverId, body) {
        if (!window.crypto?.subtle)
          throw new Error("Secure browser encryption is not available here.");
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const key = await getBrowserMessageKey(senderId, receiverId, salt);
        const cipherText = await crypto.subtle.encrypt(
          { name: "AES-GCM", iv },
          key,
          new TextEncoder().encode(body),
        );

        return {
          iv: bytesToBase64(iv),
          salt: bytesToBase64(salt),
          cipherText: bytesToBase64(cipherText),
        };
      }

      function saveBrowserMessage(message) {
        const key = "hrconnect.secureMessages";
        const messages = JSON.parse(localStorage.getItem(key) || "[]");
        messages.unshift(message);
        localStorage.setItem(key, JSON.stringify(messages.slice(0, 200)));
      }

      function showSecureMessageModal() {
        const emp = window._emp;
        if (!emp || isOwn) return;

        const overlay = document.createElement("div");
        overlay.className = "modal-overlay";
        overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3>Send Message</h3>
        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">x</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">To</label>
          <input type="text" class="form-control" value="${safe(`${emp.first_name} ${emp.last_name}`)}" disabled>
        </div>
        <div class="form-group">
          <label class="form-label required">Message</label>
          <textarea id="secure-message-body" class="form-control" rows="5" placeholder="Write your message..."></textarea>
          <p class="secure-message-note">This message is encrypted with this browser's local key and saved only in this browser.</p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
        <button class="btn btn-primary" onclick="sendSecureBrowserMessage()">Send Message</button>
      </div>
    </div>`;
        document.body.appendChild(overlay);
        document.getElementById("secure-message-body")?.focus();
      }

      async function sendSecureBrowserMessage() {
        const emp = window._emp;
        const input = document.getElementById("secure-message-body");
        const body = input?.value.trim();
        if (!emp || !body) {
          toast("Write a message first", "warning");
          return;
        }

        try {
          const encrypted = await encryptBrowserMessage(
            currentUser.id,
            emp.id,
            body,
          );
          saveBrowserMessage({
            id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
            senderId: currentUser.id,
            receiverId: emp.id,
            receiverName: `${emp.first_name} ${emp.last_name}`,
            createdAt: new Date().toISOString(),
            encryption: "AES-GCM",
            ...encrypted,
          });
          document.querySelector(".modal-overlay")?.remove();
          toast("Encrypted message saved in this browser", "success");
        } catch (e) {
          toast(e.message || "Could not encrypt message", "error");
        }
      }

          await api.patch(`/employees/${id}/account`, body);

          toast("Staff account updated", "success");
          loadProfile();
        } catch (e) {
          toast(e.message || "Could not reset account", "error");

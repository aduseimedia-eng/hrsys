<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements - KenadHR</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/suite.css">
  <link rel="stylesheet" href="../css/workspace.css">
  <style>
    .ann-page-head {
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }
    .ann-page-head h1 {
      font-size: 1.55rem;
      margin: 0;
    }
    .ann-page-head p {
      color: var(--text-secondary);
      font-size: .9rem;
      margin-top: 5px;
    }
    .ann-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .ann-filters {
      display: inline-flex;
      gap: 6px;
      padding: 5px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .ann-filter {
      min-height: 34px;
      border: 0;
      border-radius: 6px;
      padding: 0 12px;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 700;
      cursor: pointer;
    }
    .ann-filter.active {
      background: var(--navy-800);
      color: #fff;
    }
    .announcement-history-panel { border:0; border-radius:0; background:transparent; box-shadow:none; }
    .announcement-history-panel .suite-panel-header,
    .announcement-history-panel .suite-panel-body { padding-left:0; padding-right:0; }
    .ann-feed { display:grid; gap:10px; }
    .ann-card { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:16px; align-items:start; padding:16px 0; border:0; border-bottom:1px solid var(--border); border-radius:0; background:transparent; transition:none; }
    .ann-card:hover { border-color:var(--border); box-shadow:none; }
    .ann-card.is-pinned { border-left:4px solid var(--navy-700); padding-left:13px; }
    /* Keep the composer light: it should not be presented as a boxed card. */
    .announcement-modal {
      max-height: none;
      overflow: visible;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .announcement-modal .modal-header,
    .announcement-modal .modal-body,
    .announcement-modal .modal-footer {
      background: transparent;
      border: 0;
    }
    .announcement-modal .modal-header::after { display: none; }
    .announcement-modal .modal-body { overflow: visible; }
    @media (max-width:640px) {
      .announcement-modal { max-height:90vh; overflow:hidden; }
      .announcement-modal .modal-body { overflow:auto; }
    }
    .ann-card-title { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
    .ann-card strong { color:var(--text-primary); font-size:.96rem; }
    .ann-card p { margin-top:5px; color:var(--text-secondary); font-size:.86rem; line-height:1.55; max-width:760px; white-space:pre-wrap; }
    .ann-card-meta { display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin-top:10px; color:var(--text-muted); font-size:.75rem; font-weight:650; }
    .ann-card-meta span + span::before { content:'·'; margin-right:7px; color:var(--navy-400); }
    .ann-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    .delete-confirm-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(225,29,72,.1);
      color: var(--rose-600);
      margin-bottom: 14px;
    }
    .delete-confirm-copy {
      color: var(--text-secondary);
      font-size: .9rem;
      line-height: 1.55;
      margin-top: 8px;
    }
    .delete-confirm-name {
      color: var(--text-primary);
      font-weight: 700;
    }
    @media (max-width: 720px) {
      .ann-page-head {
        flex-direction: column;
        align-items: stretch;
      }
      .ann-filters {
        width: 100%;
      }
      .ann-filter {
        flex: 1;
      }
      .ann-card { grid-template-columns:1fr; }
      .ann-actions { justify-content:flex-start; }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <header class="topbar">
    <div class="topbar-title">Announcements</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="notif-btn" title="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="dot hidden" id="notif-badge"></span>
      </button>
    </div>
  </header>

  <main class="main-content">
    <section class="ann-page-head">
      <div>
        <span class="suite-eyebrow">Company updates</span>
        <h1>Announcements</h1>
        <p>Create, edit, delete, and review announcement history for staff communication.</p>
      </div>
      <button class="btn btn-primary btn-sm" type="button" onclick="openAnnouncementModal()">New Announcement</button>
    </section>

    <section class="suite-kpis" id="announcement-kpis"></section>

    <article class="suite-panel announcement-history-panel">
      <div class="suite-panel-header">
        <div>
          <h3>Announcement History</h3>
          <span>Filter by status and recency</span>
        </div>
      </div>
      <div class="suite-panel-body">
        <div class="ann-toolbar">
          <div class="ann-filters" role="tablist" aria-label="Announcement filters">
            <button class="ann-filter active" type="button" data-filter="all">All</button>
            <button class="ann-filter" type="button" data-filter="pinned">Pinned</button>
            <button class="ann-filter" type="button" data-filter="recent">Recent</button>
            <button class="ann-filter" type="button" data-filter="older">Older</button>
          </div>
        </div>
        <div class="announcement-table" id="announcement-list">
          <div class="loading-state"><div class="spinner"></div><span>Loading announcements...</span></div>
        </div>
      </div>
    </article>
  </main>
</div>

<div id="announcement-modal" class="modal-overlay" style="display:none">
  <div class="modal announcement-modal">
    <div class="modal-header">
      <h3 id="announcement-modal-title">New Announcement</h3>
      <button class="modal-close" type="button" onclick="closeAnnouncementModal()">x</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label required" for="announcement-title">Title</label>
        <input type="text" id="announcement-title" class="form-control" placeholder="Announcement title">
      </div>
      <div class="form-group">
        <label class="form-label required" for="announcement-body">Message</label>
        <textarea id="announcement-body" class="form-control" rows="5" placeholder="What should staff know?"></textarea>
      </div>
      <label style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:.86rem;font-weight:700">
        <input type="checkbox" id="announcement-pinned">
        Pin this announcement
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" type="button" onclick="closeAnnouncementModal()">Cancel</button>
      <button class="btn btn-primary" type="button" id="announcement-submit" onclick="saveAnnouncement()">Save</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
const user = requireRole('admin');
if (!user) throw new Error('redirect');

let announcements = [];
let announcementFilter = 'all';
let editingAnnouncementId = null;

buildSidebar('announcements');
loadNotifCount();
bindFilters();
loadAnnouncements();

function bindFilters() {
  document.querySelectorAll('.ann-filter').forEach((button) => {
    button.addEventListener('click', () => {
      announcementFilter = button.dataset.filter;
      document.querySelectorAll('.ann-filter').forEach((btn) => btn.classList.toggle('active', btn === button));
      renderAnnouncements();
    });
  });
}

async function loadAnnouncements() {
  try {
    announcements = await api.get('/notifications/announcements');
    renderKpis();
    renderAnnouncements();
  } catch (err) {
    toast(err.message || 'Could not load announcements', 'error');
  }
}

function renderKpis() {
  const recent = announcements.filter((item) => daysSince(item.created_at) <= 7).length;
  const pinned = announcements.filter((item) => item.is_pinned).length;
  document.getElementById('announcement-kpis').innerHTML = [
    ['Total', announcements.length, 'announcements posted'],
    ['Pinned', pinned, 'shown first'],
    ['Recent', recent, 'posted in 7 days'],
    ['History', Math.max(announcements.length - recent, 0), 'older records']
  ].map(([label, value, note]) => `
    <article class="suite-kpi"><span>${escapeHtml(label)}</span><div><strong>${escapeHtml(value)}</strong><small>${escapeHtml(note)}</small></div></article>
  `).join('');
}

function renderAnnouncements() {
  const rows = announcements.filter((item) => {
    if (announcementFilter === 'pinned') return item.is_pinned;
    if (announcementFilter === 'recent') return daysSince(item.created_at) <= 7;
    if (announcementFilter === 'older') return daysSince(item.created_at) > 7;
    return true;
  });
  const target = document.getElementById('announcement-list');
  if (!rows.length) {
    target.innerHTML = '<div class="suite-empty">No announcements match this filter.</div>';
    return;
  }

  target.innerHTML = `<div class="ann-feed">${rows.map((item) => `
    <article class="ann-card ${item.is_pinned ? 'is-pinned' : ''}">
      <div>
        <div class="ann-card-title"><strong>${escapeHtml(item.title)}</strong><span class="badge badge-info">${item.is_pinned ? 'Pinned' : 'Published'}</span></div>
        <p>${escapeHtml(item.body)}</p>
        <div class="ann-card-meta"><span>${escapeHtml(item.author_name || 'HR')}</span><span>${escapeHtml(fmt.datetime(item.created_at))}</span></div>
      </div>
      <div class="ann-actions">
        <button class="btn btn-outline btn-sm" type="button" onclick="editAnnouncement(${item.id})">Edit</button>
        <button class="btn btn-danger btn-sm" type="button" onclick="showDeleteAnnouncementModal(${item.id})">Delete</button>
      </div>
    </article>
  `).join('')}</div>`;
}

function openAnnouncementModal(item = null) {
  editingAnnouncementId = item?.id || null;
  document.getElementById('announcement-modal-title').textContent = editingAnnouncementId ? 'Edit Announcement' : 'New Announcement';
  document.getElementById('announcement-title').value = item?.title || '';
  document.getElementById('announcement-body').value = item?.body || '';
  document.getElementById('announcement-pinned').checked = !!item?.is_pinned;
  document.getElementById('announcement-modal').style.display = 'flex';
  window.dispatchEvent(new Event('hrconnect:request-page-height'));
}

function closeAnnouncementModal() {
  editingAnnouncementId = null;
  document.getElementById('announcement-modal').style.display = 'none';
  window.dispatchEvent(new Event('hrconnect:request-page-height'));
}

function editAnnouncement(id) {
  const item = announcements.find((row) => Number(row.id) === Number(id));
  if (item) openAnnouncementModal(item);
}

async function saveAnnouncement() {
  const payload = {
    title: document.getElementById('announcement-title').value.trim(),
    body: document.getElementById('announcement-body').value.trim(),
    is_pinned: document.getElementById('announcement-pinned').checked
  };
  if (!payload.title || !payload.body) {
    toast('Title and message are required', 'warning');
    return;
  }

  try {
    if (editingAnnouncementId) {
      await api.put(`/notifications/announcements/${editingAnnouncementId}`, payload);
      toast('Announcement updated', 'success');
    } else {
      await api.post('/notifications/announce', payload);
      toast('Announcement posted', 'success');
    }
    closeAnnouncementModal();
    await loadAnnouncements();
  } catch (err) {
    toast(err.message || 'Could not save announcement', 'error');
  }
}

async function deleteAnnouncement(id) {
  try {
    await api.delete(`/notifications/announcements/${id}`);
    document.querySelector('.modal-overlay[data-delete-announcement]')?.remove();
    toast('Announcement deleted', 'success');
    await loadAnnouncements();
  } catch (err) {
    toast(err.message || 'Could not delete announcement', 'error');
  }
}

function showDeleteAnnouncementModal(id) {
  const item = announcements.find((row) => Number(row.id) === Number(id));
  const title = item?.title || 'this announcement';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.dataset.deleteAnnouncement = 'true';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <div>
          <div class="delete-confirm-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>
          </div>
          <h3>Delete Announcement?</h3>
          <p class="delete-confirm-copy">
            <span class="delete-confirm-name">${escapeHtml(title)}</span> will be removed from the announcement history.
            Staff will no longer see this update.
          </p>
        </div>
        <button class="modal-close" type="button" onclick="this.closest('.modal-overlay').remove()">x</button>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" type="button" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
        <button class="btn btn-danger" type="button" onclick="deleteAnnouncement(${id})">Delete Announcement</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function daysSince(date) {
  if (!date) return Infinity;
  return Math.floor((Date.now() - new Date(date)) / 86400000);
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}
</script>
</body>
</html>

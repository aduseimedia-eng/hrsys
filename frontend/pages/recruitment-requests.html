<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recruitment Requests - KenadHR</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/recruitment-platform.css"></head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Recruitment requests</div></header><main class="main-content">

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KenadHR - HR/Admin Sign In</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body { min-height:100vh; display:grid; place-items:center; padding:24px; background:#f4f7fd; }
    .auth-card { width:min(100%, 440px); background:#fff; border:1px solid #dfe7f5; border-radius:18px; box-shadow:0 22px 60px rgba(23,79,174,.13); overflow:hidden; }
    .auth-head { padding:26px 30px; color:#fff; background:#174FAE; text-align:center; }
    .auth-logo { width:190px; height:58px; object-fit:contain; filter:none; }
    .auth-body { padding:28px 30px 30px; }
    .auth-body h2 { font-size:1.22rem; margin-bottom:20px; text-align:center; }
    .auth-body > p { display:none; }
    .form-control { min-height:46px; font-size:16px; }
    .password-field { position:relative; }.password-field .form-control { padding-right:64px; }
    .password-toggle { position:absolute; right:9px; top:50%; transform:translateY(-50%); padding:7px; color:#174FAE; font-size:.76rem; font-weight:800; }
    .error-alert { display:none; margin-bottom:16px; padding:10px 12px; color:#a52640; background:#fff1f3; border-radius:8px; font-size:.84rem; }
    .setup-fields { display:none; }.setup-fields.visible { display:block; }
    .otp-fields { display:none; }.otp-fields.visible { display:block; }.otp-code-inputs { display:flex; gap:8px; margin:8px 0 12px; }.otp-code-inputs input { flex:1 1 0; min-width:0; height:48px; padding:0; text-align:center; font-size:1.2rem; font-weight:800; }
    .auth-actions { display:grid; gap:12px; margin-top:20px; }.auth-actions .btn { justify-content:center; min-height:46px; }
    .setup-link, .back-link { display:block; width:100%; color:#174FAE; font-size:.82rem; font-weight:700; text-align:center; }
    .back-link { margin-top:18px; color:#68758d; }
    @media (max-width:560px) { body { padding:0; place-items:stretch; }.auth-card { width:100%; min-height:100vh; border:0; border-radius:0; box-shadow:none; }.auth-head { padding:24px 22px 40px; }.auth-body { margin-top:-16px; min-height:calc(100vh - 130px); padding:28px 20px calc(30px + env(safe-area-inset-bottom)); border-radius:18px 18px 0 0; background:#fff; }.auth-logo { width:174px; height:52px; } }
  </style>
</head>
<body>
  <main class="auth-card">
    <header class="auth-head">
      <img class="auth-logo" src="../assets/logo white.png" alt="KenadHR">
    </header>
    <section class="auth-body">
      <h2 id="form-title">HR/Admin sign in</h2>
      <p id="form-copy"></p>
      <div class="error-alert" id="form-error"></div>
      <form id="hr-login-form">
        <div class="setup-fields" id="setup-fields">
          <div class="form-group"><label class="form-label required" for="company-name">Company name</label><input class="form-control" id="company-name" autocomplete="organization"></div>
          <div class="form-group"><label class="form-label required" for="full-name">Your full name</label><input class="form-control" id="full-name" autocomplete="name"></div>
          <div class="form-group"><label class="form-label required" for="signup-phone">Phone number</label><input type="tel" class="form-control" id="signup-phone" placeholder="024 123 4567" autocomplete="tel"></div>
        </div>
        <div id="credentials-fields"><div class="form-group"><label class="form-label required" for="email">Work email</label><input type="email" class="form-control" id="email" required autocomplete="email"></div>
        <div class="form-group"><label class="form-label required" for="password">Password</label><div class="password-field"><input type="password" class="form-control" id="password" required autocomplete="current-password"><button class="password-toggle" type="button" id="password-toggle">Show</button></div></div><div class="form-group"><label class="form-label" for="login-phone">Confirmation phone number</label><input type="tel" class="form-control" id="login-phone" placeholder="024 123 4567" autocomplete="tel"><small style="color:#68758d;font-size:.8rem;line-height:1.45">Enter this only if your HR profile needs its phone number updated.</small></div></div>
        <div class="otp-fields" id="setup-otp-fields"><div class="form-group"><label class="form-label required">Verification code</label><div class="otp-code-inputs" data-otp-inputs data-target="setup-otp-code" aria-label="Six digit verification code"><input class="form-control" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit 1"><input class="form-control" inputmode="numeric" maxlength="1" aria-label="Digit 2"><input class="form-control" inputmode="numeric" maxlength="1" aria-label="Digit 3"><input class="form-control" inputmode="numeric" maxlength="1" aria-label="Digit 4"><input class="form-control" inputmode="numeric" maxlength="1" aria-label="Digit 5"><input class="form-control" inputmode="numeric" maxlength="1" aria-label="Digit 6"></div><input type="hidden" id="setup-otp-code"></div><p style="margin:-4px 0 14px;color:#68758d;font-size:.8rem;line-height:1.45">We sent a six-digit code to your phone from KenadHR. It expires in 5 minutes.</p></div>
        <div class="otp-fields" id="login-otp-fields"><div class="form-group"><label class="form-label required">Confirmation code</label><div class="otp-code-inputs" data-otp-inputs data-target="login-otp-code" aria-label="Six digit confirmation code"><input class="form-control" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit 1"><input class="form-control" inputmode="numeric" maxlength="1" aria-label="Digit 2"><input class="form-control" inputmode="numeric" maxlength="1" aria-label="Digit 3"><input class="form-control" inputmode="numeric" maxlength="1" aria-label="Digit 4"><input class="form-control" inputmode="numeric" maxlength="1" aria-label="Digit 5"><input class="form-control" inputmode="numeric" maxlength="1" aria-label="Digit 6"></div><input type="hidden" id="login-otp-code"></div><p style="margin:-4px 0 14px;color:#68758d;font-size:.8rem;line-height:1.45">We sent a six-digit confirmation code to your phone. It expires in 5 minutes.</p></div>
        <div class="auth-actions"><button class="btn btn-primary" id="submit-btn" type="submit">Sign in</button><button class="setup-link" id="setup-link" type="button">New company? Create account</button></div>
      </form>
      <a class="back-link" href="login.html">← Back</a>
    </section>
  </main>
  <script src="../js/api.js"></script>
  <script>
    if (api.getToken() && ['admin', 'manager'].includes(api.getUser()?.role)) window.location.href = adminWorkspaceUrl('dashboard');
    else if (api.getToken()) api.clearAuth();
    let setupMode = false;
    let setupOtpId = null;
    let loginOtpId = null;
    const selectedPlan = new URLSearchParams(window.location.search).get('plan') || '';
    const errorEl = document.getElementById('form-error');
    document.getElementById('password-toggle').addEventListener('click', () => { const input=document.getElementById('password'); const show=input.type==='password'; input.type=show?'text':'password'; document.getElementById('password-toggle').textContent=show?'Hide':'Show'; });
    function setupOtpInputs() { document.querySelectorAll('[data-otp-inputs]').forEach((group) => { const inputs=[...group.querySelectorAll('input')]; const target=document.getElementById(group.dataset.target); const sync=()=>{ target.value=inputs.map(input=>input.value).join(''); }; inputs.forEach((input,index)=>{ input.addEventListener('input',()=>{ input.value=input.value.replace(/\D/g,'').slice(-1); sync(); if(input.value && inputs[index+1]) inputs[index+1].focus(); }); input.addEventListener('keydown',(event)=>{ if(event.key==='Backspace' && !input.value && inputs[index-1]) inputs[index-1].focus(); }); input.addEventListener('paste',(event)=>{ const digits=(event.clipboardData?.getData('text')||'').replace(/\D/g,'').slice(0,inputs.length); if(!digits) return; event.preventDefault(); digits.split('').forEach((digit,position)=>{ inputs[position].value=digit; }); sync(); inputs[Math.min(digits.length,inputs.length)-1].focus(); }); }); }); }
    setupOtpInputs();
    document.getElementById('setup-link').addEventListener('click', () => { setupMode=true; document.getElementById('setup-fields').classList.add('visible'); document.getElementById('company-name').required=true; document.getElementById('full-name').required=true; document.getElementById('signup-phone').required=true; document.getElementById('form-title').textContent='Create HR account'; document.getElementById('submit-btn').textContent='Send verification code'; document.getElementById('setup-link').style.display='none'; document.getElementById('company-name').focus(); });
    document.getElementById('hr-login-form').addEventListener('submit', async (event) => { event.preventDefault(); const button=document.getElementById('submit-btn'); errorEl.style.display='none'; button.disabled=true; button.textContent=setupMode ? (setupOtpId ? 'Verifying...' : 'Sending code...') : (loginOtpId ? 'Confirming...' : 'Signing in...'); try { if (setupMode && !setupOtpId) { const result=await api.post('/auth/setup/otp/request',{company_name:document.getElementById('company-name').value,full_name:document.getElementById('full-name').value,phone:document.getElementById('signup-phone').value,email:document.getElementById('email').value,password:document.getElementById('password').value,plan_key:selectedPlan}); setupOtpId=result.signup_id; document.getElementById('setup-fields').classList.remove('visible'); document.getElementById('credentials-fields').style.display='none'; document.getElementById('setup-otp-fields').classList.add('visible'); button.disabled=false; button.textContent='Verify and create account'; document.querySelector('[data-target="setup-otp-code"] input')?.focus(); return; } const data=await api.post(setupMode?'/auth/setup/otp/verify':(loginOtpId?'/auth/login/otp/verify':'/auth/login'),setupMode?{signup_id:setupOtpId,code:document.getElementById('setup-otp-code').value}:(loginOtpId?{verification_id:loginOtpId,code:document.getElementById('login-otp-code').value}:{email:document.getElementById('email').value,password:document.getElementById('password').value,phone:document.getElementById('login-phone').value})); if (!setupMode && !loginOtpId && data.requires_otp) { loginOtpId=data.verification_id; document.getElementById('credentials-fields').style.display='none'; document.getElementById('setup-link').style.display='none'; document.getElementById('login-otp-fields').classList.add('visible'); document.getElementById('form-title').textContent='Confirm your sign in'; button.disabled=false; button.textContent='Confirm and sign in'; document.querySelector('[data-target="login-otp-code"] input')?.focus(); return; } if (!setupMode && !['admin','manager'].includes(data.user?.role)) throw new Error('Only HR/Admin or manager accounts can access this portal'); api.setToken(data.token); api.setUser(data.user); if (setupMode && data.payment_required) { const checkout=await api.post('/billing/checkout',{plan_key:selectedPlan}); window.location.assign(checkout.authorization_url); return; } window.location.href=adminWorkspaceUrl('dashboard'); } catch (err) { errorEl.textContent=err.message||'Could not continue'; errorEl.style.display='block'; button.disabled=false; button.textContent=setupMode ? (setupOtpId ? 'Verify and create account' : 'Send verification code') : (loginOtpId ? 'Confirm and sign in' : 'Sign in'); } });
    if (new URLSearchParams(window.location.search).get('setup') === '1') document.getElementById('setup-link').click();
  </script>
</body>
</html>

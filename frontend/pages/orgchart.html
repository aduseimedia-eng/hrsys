<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Org Chart — KenadHR</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/workspace.css" />
    <style>
      .org-container {
        overflow: auto;
        padding: 32px;
        min-height: 560px;
        background-color: #fbfcff;
        background-image: radial-gradient(#d8e1f0 1px, transparent 1px);
        background-size: 22px 22px;
        border: 1px solid #dfe7f4;
        border-radius: 14px;
      }
      .org-tree-root {
        display: flex;
        justify-content: center;
        min-width: max-content;
        padding: 0 20px;
      }
      .org-tree-root ul {
        display: flex;
        justify-content: center;
        margin: 0;
        padding: 28px 0 0;
        position: relative;
      }
      /* Top-level people have no parent. Do not draw the sibling branch above
         them; connectors belong only to nested reporting rows. */
      .org-tree-root > .org-root-list {
        padding-top: 0;
      }
      .org-tree-root > .org-root-list > li {
        padding-top: 0;
      }
      .org-tree-root > .org-root-list > li::before,
      .org-tree-root > .org-root-list > li::after {
        display: none !important;
      }
      .org-tree-root li {
        list-style: none;
        position: relative;
        padding: 28px 12px 0;
        text-align: center;
      }
      .org-tree-root li::before,
      .org-tree-root li::after {
        content: "";
        position: absolute;
        top: 0;
        width: 50%;
        height: 28px;
        border-top: 1.5px solid #b8c7dc;
      }
      .org-tree-root li::before {
        right: 50%;
        border-right: 1.5px solid #b8c7dc;
      }
      .org-tree-root li::after {
        left: 50%;
        border-left: 1.5px solid #b8c7dc;
      }
      .org-tree-root li:only-child::before,
      .org-tree-root li:only-child::after {
        display: none;
      }
      .org-tree-root li:only-child {
        padding-top: 0;
      }
      .org-tree-root li:first-child::before,
      .org-tree-root li:last-child::after {
        border: 0 none;
      }
      .org-tree-root li:last-child::before {
        border-radius: 0 8px 0 0;
      }
      .org-tree-root li:first-child::after {
        border-radius: 8px 0 0 0;
      }
      .org-tree-root ul ul::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        width: 0;
        height: 28px;
        border-left: 1.5px solid #b8c7dc;
      }
      .org-person-card {
        display: block;
        width: 206px;
        padding: 14px;
        color: var(--text-primary);
        font: inherit;
        text-align: left;
        background: #fff;
        border: 1px solid #dce5f1;
        border-radius: 14px;
        box-shadow: 0 5px 14px rgba(24, 57, 106, 0.07);
        cursor: pointer;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          border-color 0.18s ease;
        position: relative;
        z-index: 1;
      }
      .org-person-card:hover {
        transform: translateY(-3px);
        border-color: #79a0e0;
        box-shadow: 0 12px 22px rgba(24, 57, 106, 0.14);
      }
      .org-person-card.role-admin {
        border-top: 3px solid #d89222;
      }
      .org-person-card.role-manager {
        border-top: 3px solid #2767c5;
      }
      .org-person-top {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .org-person-card .avatar {
        flex: 0 0 auto;
      }
      .node-name {
        font-size: 0.88rem;
        font-weight: 750;
        line-height: 1.25;
      }
      .node-title {
        margin-top: 3px;
        min-height: 28px;
        font-size: 0.74rem;
        line-height: 1.3;
        color: var(--text-muted);
      }
      .node-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #edf1f6;
      }
      .node-dept {
        max-width: 130px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.69rem;
        font-weight: 650;
        color: #315d9f;
      }
      .node-reports {
        font-size: 0.68rem;
        font-weight: 700;
        color: #71809a;
        white-space: nowrap;
      }
      .org-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }
      .org-filter-group {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .org-filter-group label {
        color: var(--text-primary);
        font-size: 0.88rem;
        font-weight: 700;
        white-space: nowrap;
      }
      .org-manager-filter {
        width: min(280px, 100%);
      }
      .org-search {
        width: min(280px, 100%);
        margin-left: auto;
      }
      .org-search input {
        width: 100%;
        height: 42px;
      }
      .org-empty-canvas {
        display: grid;
        min-height: 460px;
        place-items: center;
        color: var(--text-muted);
        font-size: 0.92rem;
      }
      .org-key {
        display: flex;
        gap: 12px;
        color: var(--text-muted);
        font-size: 0.74rem;
      }
      .org-key span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .org-key i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2767c5;
      }
      .org-key i.admin {
        background: #d89222;
      }
      @media (max-width: 680px) {
        .org-container {
          padding: 20px 14px 28px;
          min-height: 460px;
        }
        .org-toolbar {
          align-items: flex-start;
          flex-direction: column;
        }
        .org-filter-group,
        .org-search,
        .org-manager-filter {
          width: 100%;
        }
      }

      /* Dept view */
      .dept-card {
        background: var(--bg-surface);
        border: 1.5px solid var(--border);
        border-radius: var(--radius-xl);
        overflow: hidden;
        margin-bottom: 16px;
      }
      .dept-header {
        background: var(--navy-800);
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .dept-header h3 {
        color: #fff;
        font-size: 1rem;
      }
      .dept-header .emp-count {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.82rem;
      }
      .dept-members {
        padding: 16px 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .member-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: var(--bg-page);
        border-radius: var(--radius-md);
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <header class="topbar">
        <div class="topbar-title">Organization Chart</div>
        <div class="topbar-actions">
          <button class="icon-btn">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"
              />
            </svg>
            <span class="dot hidden" id="notif-badge"></span>
          </button>
        </div>
      </header>
      <main class="main-content">
        <div class="page-header">
          <div>
            <h1>Organization Chart</h1>
            <p>Company hierarchy and reporting structure</p>
          </div>
          <div id="org-admin-hint"></div>
        </div>

        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('tree')">
            Hierarchy Tree
          </button>
          <button class="tab-btn" onclick="switchTab('depts')">
            By Department
          </button>
        </div>

        <!-- Tree view -->
        <div id="tab-tree">
          <div class="org-toolbar">
            <div class="org-filter-group">
              <label for="org-manager-filter">Reporting manager</label>
              <select id="org-manager-filter" class="form-control form-select org-manager-filter" onchange="filterOrgChart()">
                <option value="">All reporting lines</option>
              </select>
            </div>
            <div class="org-search">
              <input id="org-search" class="form-control" type="search" placeholder="Search employee" oninput="filterOrgChart()" />
            </div>
          </div>
          <div class="org-container">
            <div id="org-tree" class="org-tree-root">
              <div class="loading-state"><div class="spinner"></div></div>
            </div>
          </div>
        </div>

        <!-- Department view -->
        <div id="tab-depts" style="display: none">
          <div id="dept-list">
            <div class="loading-state"><div class="spinner"></div></div>
          </div>
        </div>
      </main>
    </div>

    <!-- Employee Quick View Modal -->
    <div id="emp-modal" class="modal-overlay" style="display: none">
      <div class="modal">
        <div class="modal-header">
          <h3>Employee Profile</h3>
          <button
            class="modal-close"
            onclick="
              document.getElementById('emp-modal').style.display = 'none'
            "
          >
            ✕
          </button>
        </div>
        <div class="modal-body" id="emp-modal-body"></div>
        <div class="modal-footer">
          <button
            class="btn btn-outline"
            onclick="
              document.getElementById('emp-modal').style.display = 'none'
            "
          >
            Close
          </button>
          <button class="btn btn-primary" id="emp-modal-profile-btn">
            View Full Profile
          </button>
        </div>
      </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
      const user = requireAuth();
      if (!user) throw new Error("redirect");
      buildSidebar("orgchart");
      loadNotifCount();
      let orgDirectory = [];
      let orgDepartments = [];
      let orgTree = [];
      if (user.role === "admin") {
        document.getElementById("org-admin-hint").innerHTML =
          '<span class="badge badge-info">HR arrangement enabled</span>';
      }

      function switchTab(tab) {
        ["tree", "depts"].forEach(
          (t) =>
            (document.getElementById(`tab-${t}`).style.display =
              t === tab ? "" : "none"),
        );
        document
          .querySelectorAll(".tab-btn")
          .forEach((b, i) =>
            b.classList.toggle("active", ["tree", "depts"][i] === tab),
          );
        if (tab === "depts") loadDepts();
      }

      // Build recursive tree HTML
      function buildNodeHtml(node) {
        const roleClass =
          node.role === "admin"
            ? "role-admin"
            : node.role === "manager"
              ? "role-manager"
              : "";
        const reports = node.children?.length || 0;
        const childrenHtml = reports
          ? `<ul class="org-children">${node.children.map((child) => buildNodeHtml(child)).join("")}</ul>`
          : "";
        return `<li><button type="button" class="org-person-card ${roleClass}" onclick="showEmpModal(${JSON.stringify(node).replace(/"/g, "&quot;")})">
    <div class="org-person-top">${node.photo_url ? `<img src="${assetUrl(node.photo_url)}" class="avatar avatar-md" alt="">` : `<div class="avatar avatar-md">${fmt.initials(node.first_name, node.last_name)}</div>`}
      <div><div class="node-name">${node.first_name} ${node.last_name}</div><div class="node-title">${node.job_title || node.role}</div></div>
    </div>
    <div class="node-meta"><span class="node-dept">${node.department_name || "Unassigned"}</span>${reports ? `<span class="node-reports">${reports} report${reports === 1 ? "" : "s"}</span>` : '<span class="node-reports">Individual</span>'}</div>
  </button>${childrenHtml}</li>`;
      }

      function flattenOrg(nodes, people = []) {
        nodes.forEach((node) => {
          people.push(node);
          flattenOrg(node.children || [], people);
        });
        return people;
      }

      function findOrgNode(nodes, id) {
        for (const node of nodes) {
          if (Number(node.id) === Number(id)) return node;
          const result = findOrgNode(node.children || [], id);
          if (result) return result;
        }
        return null;
      }

      function nodeMatchesSearch(node, term) {
        if (!term) return true;
        const searchable = `${node.first_name || ""} ${node.last_name || ""} ${node.job_title || ""} ${node.department_name || ""}`.toLowerCase();
        return searchable.includes(term) || (node.children || []).some((child) => nodeMatchesSearch(child, term));
      }

      function renderOrgTree() {
        const container = document.getElementById("org-tree");
        const managerId = document.getElementById("org-manager-filter").value;
        const term = document.getElementById("org-search").value.trim().toLowerCase();
        const roots = managerId
          ? [findOrgNode(orgTree, managerId)].filter(Boolean)
          : orgTree;
        const visibleRoots = roots.filter((node) => nodeMatchesSearch(node, term));
        if (!visibleRoots.length) {
          container.innerHTML = `<div class="org-empty-canvas">No employees match this view.</div>`;
          return;
        }
        container.innerHTML = `<ul class="org-root-list">${visibleRoots.map((node) => buildNodeHtml(node)).join("")}</ul>`;
      }

      function filterOrgChart() {
        renderOrgTree();
      }

      function populateManagerFilter() {
        const managerFilter = document.getElementById("org-manager-filter");
        const selected = managerFilter.value;
        const managers = flattenOrg(orgTree)
          .filter((person) => (person.children || []).length)
          .sort((a, b) => `${a.first_name} ${a.last_name}`.localeCompare(`${b.first_name} ${b.last_name}`));
        managerFilter.innerHTML = `<option value="">All reporting lines</option>${managers
          .map((manager) => `<option value="${manager.id}">${manager.first_name} ${manager.last_name}${manager.job_title ? ` — ${manager.job_title}` : ""}</option>`)
          .join("")}`;
        if (managers.some((manager) => String(manager.id) === selected)) managerFilter.value = selected;
      }

      async function loadTree() {
        orgTree = await api.get("/orgchart/tree");
        if (!orgTree.length) {
          document.getElementById("org-tree").innerHTML = `<div class="org-empty-canvas">No organisation chart data is available yet.</div>`;
          return;
        }
        populateManagerFilter();
        renderOrgTree();
      }

      async function loadDepts() {
        const depts = await api.get("/orgchart/departments");
        const list = document.getElementById("dept-list");
        if (!depts.length) {
          list.innerHTML = `<div class="empty-state"><p>No departments</p></div>`;
          return;
        }
        list.innerHTML = depts
          .map(
            (d) => `
    <div class="dept-card">
      <div class="dept-header">
        <div>
          <h3>${d.name}</h3>
          <div class="emp-count">${d.employee_count} members</div>
        </div>
        ${
          d.manager_name
            ? `
          <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
            ${initialsAvatar(d.manager_name?.split(" ")[0] || "?", d.manager_name?.split(" ")[1] || "", "sm")}
            <div>
              <div style="color:#fff;font-size:.82rem;font-weight:500">${d.manager_name}</div>
              <div style="color:rgba(255,255,255,.4);font-size:.75rem">${d.manager_title || "Manager"}</div>
            </div>
          </div>`
            : ""
        }
      </div>
      <div class="dept-members">
        ${(d.members || [])
          .map(
            (m) => `
          <div class="member-chip">
            ${initialsAvatar(m.name?.split(" ")[0] || "?", m.name?.split(" ")[1] || "", "sm")}
            <div>
              <div style="font-weight:500">${m.name}</div>
              <div style="font-size:.72rem;color:var(--text-muted)">${m.job_title || "—"}</div>
            </div>
          </div>`,
          )
          .join("")}
        ${!d.members?.length ? `<div style="color:var(--text-muted);font-size:.875rem">No additional members</div>` : ""}
      </div>
    </div>`,
          )
          .join("");
      }

      function showEmpModal(node) {
        const managerOptions = orgDirectory
          .filter((employee) => employee.id !== node.id)
          .map(
            (employee) =>
              `<option value="${employee.id}" ${Number(node.manager_id) === Number(employee.id) ? "selected" : ""}>${employee.first_name} ${employee.last_name}</option>`,
          )
          .join("");
        const departmentOptions = orgDepartments
          .map(
            (department) =>
              `<option value="${department.id}" ${Number(node.department_id) === Number(department.id) ? "selected" : ""}>${department.name}</option>`,
          )
          .join("");
        document.getElementById("emp-modal-body").innerHTML = `
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
      ${
        node.photo_url
          ? `<img src="${assetUrl(node.photo_url)}" class="avatar avatar-xl" alt="">`
          : `<div class="avatar avatar-xl">${fmt.initials(node.first_name, node.last_name)}</div>`
      }
      <div>
        <h3>${node.first_name} ${node.last_name}</h3>
        <p>${node.job_title || node.role}</p>
        ${fmt.statusBadge(node.role)}
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${node.department_name ? `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span class="text-muted">Department</span><span>${node.department_name}</span></div>` : ""}
    </div>
    ${
      user.role === "admin"
        ? `
      <div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--border)">
        <h4 style="font-size:.82rem;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px">Arrange hierarchy</h4>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Reports To</label>
            <select id="org-manager" class="form-control form-select">
              <option value="">Top level</option>
              ${managerOptions}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Department</label>
            <select id="org-department" class="form-control form-select">
              <option value="">Unassigned</option>
              ${departmentOptions}
            </select>
          </div>
        </div>
      </div>`
        : ""
    }`;
        document.getElementById("emp-modal-profile-btn").onclick = () => {
          window.location.href = appUrl(
            `/pages/employee-profile.html?id=${node.id}`,
          );
        };
        const footer = document.querySelector("#emp-modal .modal-footer");
        let saveBtn = document.getElementById("org-save-btn");
        if (saveBtn) saveBtn.remove();
        if (user.role === "admin") {
          saveBtn = document.createElement("button");
          saveBtn.id = "org-save-btn";
          saveBtn.className = "btn btn-primary";
          saveBtn.textContent = "Save Hierarchy";
          saveBtn.onclick = () => saveHierarchy(node.id);
          footer.insertBefore(
            saveBtn,
            document.getElementById("emp-modal-profile-btn"),
          );
        }
        document.getElementById("emp-modal").style.display = "flex";
      }

      async function saveHierarchy(id) {
        try {
          await api.put(`/employees/${id}`, {
            manager_id: document.getElementById("org-manager").value || null,
            department_id:
              document.getElementById("org-department").value || null,
          });
          toast("Hierarchy updated", "success");
          document.getElementById("emp-modal").style.display = "none";
          await loadTree();
          await loadDepts();
        } catch (e) {
          toast(e.message || "Could not update hierarchy", "error");
        }
      }

      async function initOrgChart() {
        [orgDirectory, orgDepartments] = await Promise.all([
          api.get("/employees/directory"),
          api.get("/employees/departments"),
        ]);
        await loadTree();
      }

      initOrgChart();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Calendar - KenadHR</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/workspace.css"><style>
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-header{text-align:center;padding:7px 3px;color:var(--text-muted);font-size:.72rem;font-weight:800;text-transform:uppercase}.cal-day{aspect-ratio:1;display:grid;place-items:center;position:relative;border-radius:8px;font-size:.84rem}.cal-day.today{background:var(--navy-800);color:#fff;font-weight:800}.cal-day.public-holiday{background:var(--mint-100);color:var(--navy-950);font-weight:800}.cal-day.company-event{background:var(--violet-100);color:var(--violet-600);font-weight:800}.cal-day.on-leave{outline:2px solid var(--amber-500);outline-offset:-2px}.cal-day.public-holiday::after,.cal-day.company-event::after{content:'';width:5px;height:5px;border-radius:50%;position:absolute;bottom:5px;background:currentColor}.calendar-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%}.calendar-actions{display:flex;gap:8px}.calendar-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:.8rem}.legend{display:flex;gap:6px;align-items:center}.legend i{width:14px;height:14px;border-radius:4px}@media(max-width:640px){.calendar-nav h3{font-size:.95rem}.calendar-actions .btn{padding:0 10px}.cal-header{font-size:.62rem}.cal-day{font-size:.76rem}.calendar-grid{gap:3px}}
</style></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Company Calendar</div><div class="topbar-actions"><button class="icon-btn" id="notif-btn" aria-label="Notifications">🔔<span class="dot hidden" id="notif-badge"></span></button></div></header><main class="main-content"><div class="page-header"><div><h1>Company Calendar</h1><p>Company events, public holidays, and approved leave in one view.</p></div></div><section class="card"><div class="card-header"><div class="calendar-nav"><button class="btn btn-outline btn-sm" onclick="changeMonth(-1)">←</button><h3 id="calendar-title"></h3><div class="calendar-actions"><button class="btn btn-primary btn-sm" id="add-event" style="display:none" onclick="openEventModal()">Add event</button><button class="btn btn-outline btn-sm" onclick="changeMonth(1)">→</button></div></div></div><div class="card-body"><div class="calendar-grid" id="calendar-grid"></div><div class="calendar-legend"><span class="legend"><i style="background:var(--navy-800)"></i>Today</span><span class="legend"><i style="background:var(--mint-100)"></i>Public holiday</span><span class="legend"><i style="background:var(--violet-100)"></i>Company event</span><span class="legend"><i style="background:var(--amber-100);border:2px solid var(--amber-500)"></i>Approved leave</span></div></div></section></main></div><div id="event-modal" class="modal-overlay" style="display:none"><div class="modal"><div class="modal-header"><h3>Add company event</h3><button class="modal-close" onclick="closeEventModal()">×</button></div><div class="modal-body"><div class="form-group"><label class="form-label required">Title</label><input class="form-control" id="event-title" placeholder="e.g. Team planning day"></div><div class="form-grid"><div class="form-group"><label class="form-label required">Start</label><input class="form-control" type="date" id="event-start"></div><div class="form-group"><label class="form-label required">End</label><input class="form-control" type="date" id="event-end"></div></div><div class="form-group"><label class="form-label">Category</label><select class="form-control form-select" id="event-category"><option value="event">Company event</option><option value="meeting">Meeting</option><option value="payday">Payday</option><option value="shutdown">Office shutdown</option><option value="holiday">Company holiday</option></select></div><div class="form-group"><label class="form-label">Notes</label><textarea class="form-control" id="event-description" rows="3"></textarea></div></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeEventModal()">Cancel</button><button class="btn btn-primary" onclick="saveEvent()">Save event</button></div></div></div><script src="../js/api.js"></script><script>
const user=api.getUser();if(!user||!api.getToken()){window.location.href=appUrl('/pages/login.html');throw new Error('Authentication required')}buildSidebar('calendar');loadNotifCount();if(['admin','manager'].includes(user.role))document.getElementById('add-event').style.display='inline-flex';let view=new Date();
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function renderCalendar(){const y=view.getFullYear(),m=view.getMonth(),start=`${y}-${String(m+1).padStart(2,'0')}-01`,end=`${y}-${String(m+1).padStart(2,'0')}-${String(new Date(y,m+1,0).getDate()).padStart(2,'0')}`;const [leaves,holidays,events]=await Promise.all([api.get(`/leave/calendar?year=${y}&month=${m+1}`),api.get(`/leave/public-holidays?year=${y}`),api.get(`/company-calendar?from=${start}&to=${end}`)]);const mark={};const add=(date,type,label)=>{(mark[date]??=[]).push({type,label})};holidays.holidays.forEach(h=>add(h.date,'public-holiday',h.name));events.forEach(e=>{for(let d=new Date(`${e.start_date}T00:00:00`),last=new Date(`${e.end_date}T00:00:00`);d<=last;d.setDate(d.getDate()+1)add(iso(d),'company-event',e.title)});leaves.forEach(l=>{for(let d=new Date(l.start_date),last=new Date(l.end_date);d<=last;d.setDate(d.getDate()+1)add(iso(d),'on-leave',`${l.employee_name} on leave`)});document.getElementById('calendar-title').textContent=view.toLocaleDateString('en-GH',{month:'long',year:'numeric'});let html=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="cal-header">${x}</div>`).join('');for(let i=0;i<new Date(y,m,1).getDay();i++)html+='<div></div>';const today=iso(new Date());for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,items=mark[date]||[],classes=['cal-day',date===today?'today':'',...items.map(x=>x.type)];html+=`<div class="${[...new Set(classes)].join(' ')}" title="${esc(items.map(x=>x.label).join(' · '))}">${d}</div>`}document.getElementById('calendar-grid').innerHTML=html}
function changeMonth(amount){view.setMonth(view.getMonth()+amount);renderCalendar()}function openEventModal(){const today=iso(new Date());document.getElementById('event-start').value=today;document.getElementById('event-end').value=today;document.getElementById('event-modal').style.display='flex'}function closeEventModal(){document.getElementById('event-modal').style.display='none'}async function saveEvent(){try{await api.post('/company-calendar',{title:document.getElementById('event-title').value,start_date:document.getElementById('event-start').value,end_date:document.getElementById('event-end').value,category:document.getElementById('event-category').value,description:document.getElementById('event-description').value});closeEventModal();document.getElementById('event-title').value='';document.getElementById('event-description').value='';await renderCalendar();toast('Company event added','success')}catch(e){toast(e.message||'Could not save event','error')}}renderCalendar();
</script></body></html>

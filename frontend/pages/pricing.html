<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Choose a plan - KenadHR</title><link rel="stylesheet" href="../css/main.css"><style>body{min-height:100vh;background:#f4f7fd;padding:48px 22px}.wrap{max-width:980px;margin:auto}.heading{text-align:center;margin-bottom:30px}.heading h1{color:#174fae}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.plan{background:#fff;border:1px solid #dfe7f5;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}.plan p{min-height:42px;color:var(--text-muted)}.price{font-size:1.8rem;font-weight:800;color:#174fae}.plan .btn{margin-top:auto;justify-content:center}@media(max-width:720px){.plans{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="heading"><h1>Choose your yearly plan</h1><p>Select the employee tier before creating your HR account.</p></div><div class="plans" id="plans">Loading plans…</div></main><script src="../js/api.js"></script><script>const money=(a,c)=>new Intl.NumberFormat('en-GH',{style:'currency',currency:c}).format(Number(a)/100);api.get('/billing/plans').then(({plans,billing_enabled})=>{if(!billing_enabled)throw new Error('Pricing is unavailable.');document.getElementById('plans').innerHTML=plans.map(p=>`<section class="plan"><h2>${escapeUi(p.name)}</h2><p>${escapeUi(p.description)}</p><div class="price">${escapeUi(money(p.amount,p.currency))} <small>/ year</small></div><a class="btn btn-primary" href="hr-login.html?setup=1&plan=${encodeURIComponent(p.key)}">Choose this plan</a></section>`).join('');}).catch(e=>document.getElementById('plans').textContent=e.message);</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employees — KenadHR</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/workspace.css">
  <script>
    if (window.self !== window.top) {
      document.documentElement.classList.add('embedded-early');
    }
  </script>
  <style>
    .embedded-early body {
      overflow: auto !important;
      background: var(--bg-page) !important;
    }
    .embedded-early .app-shell {
      display: block !important;
      height: auto !important;
      min-height: 100vh !important;
      overflow: visible !important;
    }
    .embedded-early .sidebar,
    .embedded-early .topbar,
    .embedded-early .sidebar-backdrop {
      display: none !important;
    }
    .embedded-early .main-content {
      min-height: auto !important;
      width: 100% !important;
      max-width: none !important;
      padding: 22px !important;
      overflow: visible !important;
    }

    .emp-card {
      background: var(--bg-surface);
      border: 1px solid #dfe7f5;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      text-align: left;
      transition: all var(--duration);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .emp-card:hover { background: #fff; border-color: #bcd0f4; box-shadow: 0 8px 18px rgba(28, 62, 128, 0.08); transform: translateY(-1px); }
    .emp-card::before { display: none; }
    .emp-card-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: flex-start; gap: 10px; }
    .emp-person { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .emp-person .avatar { flex: 0 0 auto; }
    .emp-person > div:last-child { min-width: 0; flex: 1; }
    .emp-card .emp-name { overflow: hidden; color: var(--text-primary); font-weight: 750; font-size: .92rem; text-overflow: ellipsis; white-space: nowrap; }
    .emp-card .emp-title { overflow: hidden; color: var(--text-secondary); font-size: .76rem; text-overflow: ellipsis; white-space: nowrap; }
    .emp-card .emp-dept  { display: inline-flex; width: fit-content; margin-top: 13px; padding: 4px 8px; border-radius: 999px; background: var(--navy-50); color: var(--navy-800); font-size: .7rem; font-weight: 700; }
    .emp-card .emp-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .emp-meta-item { min-width: 0; }
    .emp-meta-label { display: block; color: var(--text-muted); font-size: .61rem; font-weight: 750; letter-spacing: .035em; text-transform: uppercase; }
    .emp-meta-value { display: block; overflow: hidden; margin-top: 2px; color: var(--text-secondary); font-size: .72rem; text-overflow: ellipsis; white-space: nowrap; }
    .emp-card-actions { display: flex; gap: 8px; margin-top: 15px; }
    .emp-card-actions .btn { justify-content: center; min-height: 31px; padding: 6px 10px; font-size: .72rem; }
    .employee-editor-dialog { max-width: 820px; }
    .employee-editor-dialog .modal-body { max-height: min(60vh, 560px); }
    .employment-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .employment-tile {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      padding: 14px;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }
    .employment-tile span {
      color: var(--text-muted);
      display: block;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .employment-tile strong {
      color: var(--text-primary);
      display: block;
      font-size: 1.35rem;
      margin-top: 6px;
    }
    .employment-tile small {
      color: var(--text-secondary);
      display: block;
      font-size: .76rem;
      margin-top: 2px;
    }
    .employment-chip {
      align-self: flex-start;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--type-bg);
      color: var(--type-fg);
      font-size: .68rem;
      font-weight: 800;
      padding: 4px 9px;
      white-space: nowrap;
    }
    .type-staff { --type-accent: var(--navy-400); --type-bg: var(--navy-50); --type-fg: var(--navy-800); }
    .type-contractual { --type-accent: var(--amber-500); --type-bg: var(--amber-100); --type-fg: #92400e; }
    .type-national-service { --type-accent: var(--mint-500); --type-bg: var(--mint-100); --type-fg: var(--navy-950); }
    .type-internship { --type-accent: var(--rose-600); --type-bg: var(--rose-100); --type-fg: var(--rose-600); }
    .emp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .filters-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
    .filters-bar .form-control { max-width: 200px; }
    @media (max-width: 900px) {
      .employment-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .employment-summary { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <header class="topbar">
    <div class="topbar-title">Employees</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="notif-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="dot hidden" id="notif-badge"></span>
      </button>
    </div>
  </header>
  <main class="main-content">
    <div class="page-header">
      <div><h1>Employees</h1><p>Manage your team members</p></div>
      <div style="display:flex;gap:10px" id="admin-actions"></div>
    </div>

    <div class="employment-summary" id="employment-summary"></div>

    <div class="filters-bar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="search-input" class="form-control" placeholder="Search employees…">
      </div>
      <select id="dept-filter" class="form-control form-select"><option value="">All Departments</option></select>
      <select id="role-filter" class="form-control form-select">
        <option value="">All Roles</option>
        <option value="admin">Admin</option>
        <option value="manager">Manager</option>
        <option value="employee">Employee</option>
      </select>
      <select id="employment-filter" class="form-control form-select"></select>
      <div style="margin-left:auto;color:var(--text-muted);font-size:.875rem" id="emp-count"></div>
    </div>

    <div id="emp-grid" class="emp-grid">
      <div class="emp-card"><div class="skeleton" style="width:60px;height:60px;border-radius:50%"></div><div class="skeleton mt-8" style="width:120px;height:16px"></div><div class="skeleton mt-4" style="width:90px;height:12px"></div></div>
      <div class="emp-card"><div class="skeleton" style="width:60px;height:60px;border-radius:50%"></div><div class="skeleton mt-8" style="width:120px;height:16px"></div><div class="skeleton mt-4" style="width:90px;height:12px"></div></div>
      <div class="emp-card"><div class="skeleton" style="width:60px;height:60px;border-radius:50%"></div><div class="skeleton mt-8" style="width:120px;height:16px"></div><div class="skeleton mt-4" style="width:90px;height:12px"></div></div>
      <div class="emp-card"><div class="skeleton" style="width:60px;height:60px;border-radius:50%"></div><div class="skeleton mt-8" style="width:120px;height:16px"></div><div class="skeleton mt-4" style="width:90px;height:12px"></div></div>
    </div>

    <div id="pagination" style="display:flex;justify-content:center;gap:8px;margin-top:24px"></div>
  </main>
</div>

<!-- Add Employee Modal -->
<div id="add-modal" class="modal-overlay" style="display:none">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3>Add New Employee</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label class="form-label required">First Name</label><input type="text" id="f-first" class="form-control"></div>
        <div class="form-group"><label class="form-label required">Last Name</label><input type="text" id="f-last" class="form-control"></div>
        <div class="form-group"><label class="form-label required">Email</label><input type="email" id="f-email" class="form-control"></div>
        <div class="form-group"><label class="form-label">Employee ID</label><input type="text" id="f-employee-code" class="form-control" maxlength="50" placeholder="Leave blank to generate automatically"><p class="form-hint">Leave blank to use the company employee-ID prefix.</p></div>
        <div class="form-group"><label class="form-label required">Password</label><input type="password" id="f-pass" class="form-control" placeholder="Temporary password"></div>
        <div class="form-group"><label class="form-label">Role</label>
          <select id="f-role" class="form-control form-select">
            <option value="employee">Employee</option>
            <option value="manager">Manager</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Employment Type</label>
          <select id="f-employment-type" class="form-control form-select"></select>
        </div>
        <div class="form-group"><label class="form-label">Department</label><select id="f-dept" class="form-control form-select"><option value="">— Select —</option></select></div>
        <div class="form-group"><label class="form-label">Reports To</label><select id="f-manager" class="form-control form-select"><option value="">Top level</option></select></div>
        <div class="form-group"><label class="form-label">Job Title</label><select id="f-title" class="form-control form-select"><option value="">— Select —</option></select></div>
        <div class="form-group"><label class="form-label" data-currency-label="Salary">Salary</label><input type="number" id="f-salary" class="form-control" step="0.01" data-currency-input></div>
        <div class="form-group"><label class="form-label">Hire Date</label><input type="date" id="f-hire" class="form-control"></div>
        <div class="form-group"><label class="form-label">Date of Birth</label><input type="date" id="f-dob" class="form-control"></div>
        <div class="form-group"><label class="form-label required">Phone</label><input type="tel" id="f-phone" class="form-control" placeholder="024 123 4567" required></div>
        <div class="form-group span-2"><label class="form-label">Address</label><textarea id="f-address" class="form-control" rows="2"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createEmployee()">Add Employee</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
const user = requireRole('admin', 'manager');
if (!user) throw new Error('redirect');
buildSidebar('employees');
loadNotifCount();

let departments = [];
let directory = [];
let currentPage = 1;
const employeePreferences = (() => { try { return JSON.parse(localStorage.getItem(`hrconnect.company-preferences.${user.company_id}`) || '{}'); } catch (_) { return {}; } })();
const limit = Math.min(200, Math.max(5, Number(employeePreferences.default_records_per_page) || 25));
document.getElementById('f-employee-code').placeholder = `e.g. ${(employeePreferences.employee_code_prefix || 'EMP-')}0001 (or leave blank)`;
const JOB_TITLES = [
  'HR Director',
  'HR Officer',
  'Admin Officer',
  'Operations Manager',
  'Operations Officer',
  'Public Relations Lead',
  'Public Relations Officer',
  'IT Manager',
  'IT Support Officer',
  'Senior Developer',
  'Frontend Developer',
  'Account Manager',
  'Account Analyst',
  'Member Management Lead',
  'Member Officer'
];
const EMPLOYMENT_TYPES = [
  { value: 'staff', label: 'Staff', note: 'Core team', className: 'type-staff' },
  { value: 'contractual', label: 'Contractual', note: 'Fixed-term staff', className: 'type-contractual' },
  { value: 'national_service', label: 'National Service Personnel', note: 'Service personnel', className: 'type-national-service' },
  { value: 'internship', label: 'Internship Staff', note: 'Intern staff', className: 'type-internship' }
];

function employmentTypeMeta(value) {
  return EMPLOYMENT_TYPES.find((type) => type.value === value) || EMPLOYMENT_TYPES[0];
}

function employmentTypeOptions(selectedValue = '', includeAll = false) {
  const options = includeAll ? '<option value="">All Employment Types</option>' : '';
  return options + EMPLOYMENT_TYPES.map((type) =>
    `<option value="${type.value}" ${type.value === selectedValue ? 'selected' : ''}>${type.label}</option>`
  ).join('');
}

function renderEmploymentSummary() {
  const counts = EMPLOYMENT_TYPES.reduce((acc, type) => ({ ...acc, [type.value]: 0 }), {});
  directory.forEach((employee) => {
    const type = employee.employment_type || 'staff';
    counts[type] = (counts[type] || 0) + 1;
  });
  document.getElementById('employment-summary').innerHTML = EMPLOYMENT_TYPES.map((type) => `
    <article class="employment-tile ${type.className}">
      <span>${type.label}</span>
      <strong>${counts[type.value] || 0}</strong>
      <small>${type.note}</small>
    </article>
  `).join('');
}

async function init() {
  try {
    departments = await api.get('/employees/departments');
    directory = await api.get('/employees/directory');
    const deptFilter = document.getElementById('dept-filter');
    const deptSelect = document.getElementById('f-dept');
    const managerSelect = document.getElementById('f-manager');
    const titleSelect = document.getElementById('f-title');
    document.getElementById('employment-filter').innerHTML = employmentTypeOptions('', true);
    document.getElementById('f-employment-type').innerHTML = employmentTypeOptions('staff');
    departments.forEach(d => {
      deptFilter.innerHTML += `<option value="${d.id}">${d.name}</option>`;
      if (deptSelect) deptSelect.innerHTML += `<option value="${d.id}">${d.name}</option>`;
    });
    JOB_TITLES.forEach(title => {
      if (titleSelect) titleSelect.innerHTML += `<option value="${escapeHtml(title)}">${escapeHtml(title)}</option>`;
    });
    directory.forEach(e => {
      if (managerSelect) managerSelect.innerHTML += `<option value="${e.id}">${e.first_name} ${e.last_name} - ${e.job_title || e.role}</option>`;
    });
    renderEmploymentSummary();
    if (user.role === 'admin') {
      document.getElementById('admin-actions').innerHTML =
        `<button class="btn btn-primary" onclick="document.getElementById('add-modal').style.display='flex'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Employee
        </button>`;
    }
    await loadEmployees();
  } catch(e) { toast(e.message, 'error'); }
}

async function loadEmployees() {
  const search = document.getElementById('search-input').value;
  const dept   = document.getElementById('dept-filter').value;
  const role   = document.getElementById('role-filter').value;
  const employmentType = document.getElementById('employment-filter').value;

  let qs = `?page=${currentPage}&limit=${limit}`;
  if (search) qs += `&search=${encodeURIComponent(search)}`;
  if (dept)   qs += `&department_id=${dept}`;
  if (role)   qs += `&role=${role}`;
  if (employmentType) qs += `&employment_type=${encodeURIComponent(employmentType)}`;

  const data = await api.get(`/employees${qs}`);
  document.getElementById('emp-count').textContent = `${data.total} employees`;

  const grid = document.getElementById('emp-grid');
  if (!data.employees.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><p>No employees found</p></div>`;
    return;
  }
  grid.innerHTML = data.employees.map((e) => {
    const type = employmentTypeMeta(e.employment_type || 'staff');
    const employeeName = `${e.first_name} ${e.last_name}`;
    return `
    <div class="emp-card ${type.className}" onclick="window.location.href='employee-profile.html?id=${e.id}&v=${Date.now()}'">
      <div class="emp-card-top">
        <div class="emp-person">
          ${avatarEl(e, 'md')}
          <div>
            <div class="emp-name">${employeeName}</div>
            <div class="emp-title">${e.job_title || 'No job title'}</div>
            <div style="font-size:.75rem;color:var(--text-muted);margin-top:2px">${e.employee_code || 'Employee ID not assigned'}</div>
          </div>
        </div>
        <span class="employment-chip">${type.label}</span>
      </div>
      <div class="emp-dept">${e.department_name || 'No department assigned'}</div>
      <div class="emp-meta">
        <div class="emp-meta-item"><span class="emp-meta-label">System access</span><span class="emp-meta-value">${e.role || 'Employee'}</span></div>
        <div class="emp-meta-item"><span class="emp-meta-label">Joined</span><span class="emp-meta-value">${e.hire_date ? fmt.date(e.hire_date) : 'Not recorded'}</span></div>
      </div>
      <div class="emp-card-actions">
        <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); window.location.href='employee-profile.html?id=${e.id}'">View profile</button>
        ${user.role === 'admin' ? `<button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); openEmployeeEditor(${e.id})">Edit</button>` : ''}
      </div>
    </div>`;
  }).join('');

  // Pagination
  const total = Math.ceil(data.total / limit);
  const pag = document.getElementById('pagination');
  pag.innerHTML = total > 1 ? Array.from({length:total},(_,i) =>
    `<button class="btn ${i+1===currentPage?'btn-primary':'btn-outline'} btn-sm" onclick="gotoPage(${i+1})">${i+1}</button>`
  ).join('') : '';
}

function gotoPage(p) { currentPage = p; loadEmployees(); }

function employeeEditorOptions(items, selected, label) {
  return `<option value="">${label}</option>` + items.map((item) =>
    `<option value="${escapeHtml(item.value)}" ${String(item.value) === String(selected || '') ? 'selected' : ''}>${escapeHtml(item.label)}</option>`
  ).join('');
}

async function openEmployeeEditor(id) {
  try {
    const employee = await api.get(`/employees/${id}`);
    const prefix = String(api.getCompanyPreferences()?.employee_code_prefix || 'EMP-').trim().toUpperCase() || 'EMP-';
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal modal-lg employee-editor-dialog">
        <div class="modal-header"><div><h3>Edit staff member</h3><p style="margin:4px 0 0;color:var(--text-secondary);font-size:.82rem">Update the essential staff record without leaving the directory.</p></div><button class="modal-close" type="button" onclick="this.closest('.modal-overlay').remove()">×</button></div>
        <div class="modal-body"><div class="form-grid">
          <div class="form-section-title">Personal details</div>
          <div class="form-group"><label class="form-label required">First name</label><input id="edit-employee-first" class="form-control" value="${escapeHtml(employee.first_name || '')}"></div>
          <div class="form-group"><label class="form-label required">Last name</label><input id="edit-employee-last" class="form-control" value="${escapeHtml(employee.last_name || '')}"></div>
          <div class="form-group"><label class="form-label">Phone</label><input id="edit-employee-phone" class="form-control" value="${escapeHtml(employee.phone || '')}"></div>
          <div class="form-group"><label class="form-label">Date of birth</label><input id="edit-employee-dob" type="date" class="form-control" value="${employee.date_of_birth ? String(employee.date_of_birth).slice(0, 10) : ''}"></div>
          <div class="form-section-title">Employment details</div>
          <div class="form-group"><label class="form-label required">Employee ID</label><input id="edit-employee-code" class="form-control" maxlength="50" value="${escapeHtml(employee.employee_code || '')}" placeholder="e.g. ${escapeHtml(`${prefix}0001`)}"><small class="form-hint">Company prefix: ${escapeHtml(prefix)}. It applies to automatically generated IDs for new staff.</small></div>
          <div class="form-group"><label class="form-label">Department</label><select id="edit-employee-department" class="form-control form-select">${employeeEditorOptions(departments.map((department) => ({ value: department.id, label: department.name })), employee.department_id, 'No department')}</select></div>
          <div class="form-group"><label class="form-label">Job title</label><select id="edit-employee-title" class="form-control form-select">${employeeEditorOptions(JOB_TITLES.map((title) => ({ value: title, label: title })), employee.job_title, 'No job title')}</select></div>
          <div class="form-group"><label class="form-label">Employment type</label><select id="edit-employee-type" class="form-control form-select">${employeeEditorOptions(EMPLOYMENT_TYPES.map((type) => ({ value: type.value, label: type.label })), employee.employment_type, 'Select type')}</select></div>
          <div class="form-group"><label class="form-label">Reports to</label><select id="edit-employee-manager" class="form-control form-select">${employeeEditorOptions(directory.filter((person) => Number(person.id) !== Number(employee.id)).map((person) => ({ value: person.id, label: `${person.first_name} ${person.last_name}` })), employee.manager_id, 'Top level')}</select></div>
          <div class="form-group"><label class="form-label">Hire date</label><input id="edit-employee-hire-date" type="date" class="form-control" value="${employee.hire_date ? String(employee.hire_date).slice(0, 10) : ''}"></div>
          <div class="form-group"><label class="form-label" data-currency-label="Salary">Salary</label><input id="edit-employee-salary" type="number" min="0" step="${fmt.currencyStep()}" class="form-control" value="${escapeHtml(employee.salary ?? '')}"></div>
        </div></div>
        <div class="modal-footer"><button class="btn btn-outline" type="button" onclick="this.closest('.modal-overlay').remove()">Cancel</button><button class="btn btn-primary" type="button" onclick="saveEmployeeEditor(${employee.id})">Save changes</button></div>
      </div>`;
    document.body.appendChild(overlay);
  } catch (error) {
    toast(error.message || 'Could not open the staff editor', 'error');
  }
}

async function saveEmployeeEditor(id) {
  const body = {
    first_name: document.getElementById('edit-employee-first').value,
    last_name: document.getElementById('edit-employee-last').value,
    phone: document.getElementById('edit-employee-phone').value,
    date_of_birth: document.getElementById('edit-employee-dob').value,
    employee_code: document.getElementById('edit-employee-code').value,
    department_id: document.getElementById('edit-employee-department').value || null,
    job_title: document.getElementById('edit-employee-title').value,
    employment_type: document.getElementById('edit-employee-type').value,
    manager_id: document.getElementById('edit-employee-manager').value || null,
    hire_date: document.getElementById('edit-employee-hire-date').value,
    salary: document.getElementById('edit-employee-salary').value
  };
  try {
    await api.put(`/employees/${id}`, body);
    document.querySelector('.modal-overlay')?.remove();
    directory = await api.get('/employees/directory');
    renderEmploymentSummary();
    await loadEmployees();
    toast('Staff record updated', 'success');
  } catch (error) {
    toast(error.message || 'Could not update the staff record', 'error');
  }
}

let searchTimeout;
document.getElementById('search-input').addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => { currentPage=1; loadEmployees(); }, 350);
});
document.getElementById('dept-filter').addEventListener('change', () => { currentPage=1; loadEmployees(); });
document.getElementById('role-filter').addEventListener('change', () => { currentPage=1; loadEmployees(); });
document.getElementById('employment-filter').addEventListener('change', () => { currentPage=1; loadEmployees(); });

async function createEmployee() {
  try {
    await api.post('/employees', {
      first_name:    document.getElementById('f-first').value,
      last_name:     document.getElementById('f-last').value,
      email:         document.getElementById('f-email').value,
      employee_code: document.getElementById('f-employee-code').value,
      password:      document.getElementById('f-pass').value,
      role:          document.getElementById('f-role').value,
      employment_type: document.getElementById('f-employment-type').value,
      department_id: document.getElementById('f-dept').value || null,
      manager_id:    document.getElementById('f-manager').value || null,
      job_title:     document.getElementById('f-title').value,
      salary:        document.getElementById('f-salary').value,
      hire_date:     document.getElementById('f-hire').value,
      date_of_birth: document.getElementById('f-dob').value,
      phone:         document.getElementById('f-phone').value,
      address:       document.getElementById('f-address').value,
    });
    closeModal();
    toast('Employee added successfully!', 'success');
    await loadEmployees();
  } catch(e) { toast(e.message, 'error'); }
}

function closeModal() { document.getElementById('add-modal').style.display='none'; }

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

init();
</script>

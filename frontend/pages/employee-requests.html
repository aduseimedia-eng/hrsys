<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Requests - KenadHR</title><link rel="stylesheet" href="../css/main.css"><style>
.request-toolbar{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px}.request-list{display:grid;gap:0;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px}.request-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:16px 18px;border-bottom:1px solid var(--border)}.request-row:last-child{border:0}.request-row h3{margin:0;font-size:.96rem}.request-meta,.request-row p{margin:6px 0 0;color:var(--text-secondary);font-size:.84rem;line-height:1.5}.request-meta{color:var(--text-muted);font-size:.76rem}.request-actions{min-width:155px}.request-actions select{width:100%;margin-top:8px}.request-actions button{width:100%;margin-top:8px}@media(max-width:680px){.request-row{grid-template-columns:1fr}.request-actions{min-width:0}.request-toolbar{align-items:stretch;flex-direction:column}}
</style></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Employee Requests</div></header><main class="main-content"><div class="page-header"><div><h1 id="page-title">Employee Requests</h1><p id="page-intro">Submit workplace requests and track their progress.</p></div><button class="btn btn-primary" type="button" id="new-request">New request</button></div><div class="request-toolbar"><div><label class="form-label" for="request-filter">Status</label><select class="form-control form-select" id="request-filter"><option value="all">All requests</option><option value="pending">Pending</option><option value="in_review">In review</option><option value="approved">Approved</option><option value="declined">Declined</option><option value="completed">Completed</option></select></div></div><section class="request-list" id="request-list"><div class="empty-state"><p>Loading requests…</p></div></section></main></div>
<div class="modal-overlay" id="request-modal" style="display:none"><div class="modal"><div class="modal-header"><h3>New employee request</h3><button class="modal-close" type="button" onclick="closeRequestModal()">&times;</button></div><div class="modal-body"><div class="form-group"><label class="form-label required" for="request-type">Request type</label><select id="request-type" class="form-control form-select"><option value="employment_letter">Employment letter</option><option value="employment_confirmation">Employment confirmation</option><option value="salary_advance">Salary advance</option><option value="document">Document request</option><option value="workplace">Workplace request</option><option value="other">Other request</option></select></div><div class="form-group"><label class="form-label required" for="request-subject">Subject</label><input id="request-subject" maxlength="180" class="form-control" placeholder="What do you need?"></div><div class="form-group"><label class="form-label required" for="request-details">Details</label><textarea id="request-details" maxlength="4000" rows="5" class="form-control" placeholder="Include the details HR needs to process this request."></textarea></div></div><div class="modal-footer"><button class="btn btn-outline" type="button" onclick="closeRequestModal()">Cancel</button><button class="btn btn-primary" type="button" onclick="submitRequest()">Submit request</button></div></div></div>
<script src="../js/api.js"></script><script>
const user=requireAuth();if(!user)throw Error('redirect');const canManage=['admin','manager'].includes(user.role);let requests=[],filter='all';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const label=v=>String(v||'other').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());buildSidebar('employee-requests');loadNotifCount();if(canManage){document.getElementById('page-title').textContent='Employee Requests';document.getElementById('page-intro').textContent='Review and respond to employee letters, document, salary advance, and workplace requests.';document.getElementById('new-request').style.display='none'}
function closeRequestModal(){document.getElementById('request-modal').style.display='none'}function render(){const rows=requests.filter(r=>filter==='all'||r.status===filter),target=document.getElementById('request-list');target.innerHTML=rows.length?rows.map(r=>`<article class="request-row"><div><h3>${esc(r.subject)}</h3><div class="request-meta">${esc(label(r.request_type))}${canManage?` · ${esc(r.employee_name||'Employee')}`:''} · ${esc(fmt.datetime(r.created_at))}</div><p>${esc(r.details)}</p>${r.reviewer_note?`<p><strong>HR response:</strong> ${esc(r.reviewer_note)}</p>`:''}</div><div class="request-actions">${fmt.statusBadge(r.status)}${canManage?`<select class="form-control form-select" id="status-${r.id}">${['pending','in_review','approved','declined','completed'].map(s=>`<option value="${s}" ${s===r.status?'selected':''}>${label(s)}</option>`).join('')}</select><button class="btn btn-outline btn-sm" type="button" onclick="updateRequest(${r.id})">Update status</button>`:''}</div></article>`).join(''):'<div class="empty-state"><p>No employee requests found.</p></div>'}
async function loadRequests(){try{requests=await api.get('/employee-requests');render()}catch(e){toast(e.message||'Could not load employee requests','error')}}function openRequestModal(){document.getElementById('request-modal').style.display='flex';document.getElementById('request-subject').focus()}async function submitRequest(){const type=document.getElementById('request-type').value,subject=document.getElementById('request-subject').value.trim(),details=document.getElementById('request-details').value.trim();if(!subject||!details)return toast('Add a subject and request details','error');try{await api.post('/employee-requests',{request_type:type,subject,details});closeRequestModal();document.getElementById('request-subject').value='';document.getElementById('request-details').value='';toast('Request submitted','success');loadRequests()}catch(e){toast(e.message||'Could not submit request','error')}}async function updateRequest(id){const request=requests.find(r=>Number(r.id)===Number(id)),status=document.getElementById(`status-${id}`).value,reviewer_note=prompt('Optional response for the employee:',request.reviewer_note||'');if(reviewer_note===null)return;try{await api.patch(`/employee-requests/${id}`,{status,reviewer_note});toast('Request updated','success');loadRequests()}catch(e){toast(e.message||'Could not update request','error')}}document.getElementById('new-request').onclick=openRequestModal;document.getElementById('request-filter').onchange=e=>{filter=e.target.value;render()};document.getElementById('request-modal').onclick=e=>{if(e.target===e.currentTarget)closeRequestModal()};loadRequests();
</script></body></html>

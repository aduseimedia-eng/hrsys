<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payroll Runs - KenadHR</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/workspace.css">
  <style>
    .payroll-runs-page {
      --border: #e3e4e7;
      --border-dark: #cfd1d5;
    }

    .payroll-runs-page .table-container {
      border-color: #e3e4e7;
    }

    .payroll-runs-page .btn-outline {
      border-color: #cfd1d5;
    }

    .payroll-runs-page .btn-outline:hover {
      border-color: #b8bbc1;
      background: #f7f7f8;
      color: var(--text-primary);
    }

    .payroll-runs-page .form-control,
    .payroll-runs-page .modal {
      border-color: #e3e4e7;
    }

    .payroll-runs-page .form-control:focus {
      border-color: #cfd1d5;
    }

    .payroll-runs-page .modal-header::after {
      display: none;
    }

    .run-dialog-note {
      padding: 12px;
      border: 1px solid #e3e4e7;
      border-radius: 4px;
      background: #fafafa;
      color: var(--text-secondary);
      font-size: .84rem;
      line-height: 1.45;
    }

    .run-dialog-summary {
      margin-top: 16px;
      padding: 14px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-size: .86rem;
    }

    .run-dialog-summary div {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 5px 0;
    }

    .run-dialog-summary span,
    .run-payment-date {
      color: var(--text-muted);
    }

    .run-period {
      white-space: nowrap;
    }

    .run-payment-date {
      display: block;
      margin-top: 4px;
      font-size: .74rem;
      white-space: nowrap;
    }

    .run-complete {
      color: var(--success-fg);
      font-weight: 650;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .run-dialog-summary div {
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
      }
    }
  </style>
</head>
<body class="payroll-runs-page">
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <header class="topbar"><div class="topbar-title">Payroll Runs</div></header>
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Payroll Runs</h1>
        <p>Create, calculate, approve, and finalise payroll separately from payslips.</p>
      </div>
      <button class="btn btn-primary" type="button" onclick="showCreateRunModal()">Create payroll run</button>
    </div>
    <div class="table-container">
      <table>
        <caption class="sr-only">Payroll runs and their processing status</caption>
        <thead>
          <tr>
            <th scope="col">Period</th>
            <th scope="col">Pay group</th>
            <th scope="col">Country</th>
            <th scope="col">Status</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody id="run-rows">
          <tr><td colspan="5"><div class="loading-state"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
<script src="../js/api.js"></script>
<script src="../js/payroll-runs.js?v=20260904c"></script>
</body>
</html>

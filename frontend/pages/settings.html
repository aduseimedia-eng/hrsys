<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - HRConnect</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/workspace.css">
  <style>
    .settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); gap: 18px; }
    .settings-profile { display: flex; align-items: center; gap: 16px; }
    .settings-profile .avatar { width: 76px; height: 76px; font-size: 1.45rem; }
    .department-card { grid-column: 1 / -1; }
    .department-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin-bottom: 16px; }
    .department-list { display: grid; gap: 10px; }
    .department-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .department-row:last-child { border-bottom: 0; }
    .department-row strong { display: block; color: var(--text-primary); font-size: .92rem; }
    .department-row span { display: block; color: var(--text-muted); font-size: .78rem; margin-top: 3px; }
    .department-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    @media (max-width: 900px) { .settings-grid { grid-template-columns: 1fr; } }
    @media (max-width: 640px) {
      .department-form { grid-template-columns: 1fr; }
      .department-row { align-items: flex-start; flex-direction: column; }
      .department-actions, .department-actions .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <header class="topbar">
    <div class="topbar-title">Settings</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="notif-btn" title="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="dot hidden" id="notif-badge"></span>
      </button>
    </div>
  </header>
  <main class="main-content">
    <div class="page-header">
      <div><h1>Settings</h1><p>Manage your HR account, password, and avatar</p></div>
    </div>

    <div class="settings-grid">
      <article class="card">
        <div class="card-header"><h3>Account Details</h3></div>
        <div class="card-body">
          <div class="settings-profile" style="margin-bottom:20px">
            <div id="settings-avatar"></div>
            <div>
              <h3 id="settings-name">HR account</h3>
              <p id="settings-role" style="color:var(--text-muted);font-size:.88rem"></p>
              <label class="btn btn-outline btn-sm" style="margin-top:10px">
                Upload Avatar
                <input type="file" accept="image/*" style="display:none" onchange="uploadAvatar(this.files[0])">
              </label>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" id="settings-email" class="form-control">
          </div>
          <button class="btn btn-primary" onclick="saveAccount()">Save Email</button>
        </div>
      </article>

      <article class="card">
        <div class="card-header"><h3>Password</h3></div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">Current Password</label>
            <input type="password" id="current-password" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" id="new-password" class="form-control">
          </div>
          <button class="btn btn-primary" onclick="savePassword()">Change Password</button>
        </div>
      </article>

      <article class="card department-card">
        <div class="card-header"><h3>Departments</h3></div>
        <div class="card-body">
          <form class="department-form" id="department-form">
            <input type="text" id="department-name" class="form-control" placeholder="New department name" required>
            <button class="btn btn-primary" type="submit">Add Department</button>
          </form>
          <div class="department-list" id="department-list">
            <div class="loading-state"><div class="spinner"></div><span>Loading departments...</span></div>
          </div>
        </div>
      </article>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script>
const user = requireRole('admin');
if (!user) throw new Error('redirect');
buildSidebar('settings');
loadNotifCount();
let profile = user;
let departments = [];

document.getElementById('department-form').addEventListener('submit', addDepartment);
loadSettings();

async function loadSettings() {
  [profile, departments] = await Promise.all([
    api.get('/auth/me'),
    api.get('/employees/departments')
  ]);
  api.setUser(profile);
  renderSettings();
  renderDepartments();
}

function renderSettings() {
  document.getElementById('settings-avatar').innerHTML = avatarEl(profile, 'xl');
  document.getElementById('settings-name').textContent = `${profile.first_name} ${profile.last_name}`;
  document.getElementById('settings-role').textContent = `${profile.job_title || 'HR'} ${profile.department_name ? '- ' + profile.department_name : ''}`;
  document.getElementById('settings-email').value = profile.email || '';
}

function renderDepartments() {
  const target = document.getElementById('department-list');
  if (!departments.length) {
    target.innerHTML = '<div class="empty-state"><p>No departments yet.</p></div>';
    return;
  }
  target.innerHTML = departments.map((department) => `
    <div class="department-row">
      <div>
        <strong>${escapeHtml(department.name)}</strong>
        <span>${Number(department.employee_count || 0)} staff${Number(department.employee_count || 0) === 1 ? '' : ' members'}${department.manager_name ? ' - Manager: ' + escapeHtml(department.manager_name) : ''}</span>
      </div>
      <div class="department-actions">
        <button class="btn btn-outline btn-sm" type="button" onclick="deleteDepartment(${department.id})">Delete</button>
      </div>
    </div>
  `).join('');
}

async function addDepartment(event) {
  event.preventDefault();
  try {
    const input = document.getElementById('department-name');
    await api.post('/employees/departments', { name: input.value });
    input.value = '';
    toast('Department added', 'success');
    await loadSettings();
  } catch (e) {
    toast(e.message || 'Could not add department', 'error');
  }
}

async function deleteDepartment(id) {
  const department = departments.find((item) => Number(item.id) === Number(id));
  if (!department) return;
  const count = Number(department.employee_count || 0);
  const message = count
    ? `Delete ${department.name}? ${count} staff member${count === 1 ? '' : 's'} will become unassigned.`
    : `Delete ${department.name}?`;
  if (!confirm(message)) return;
  try {
    await api.delete(`/employees/departments/${id}`);
    toast('Department deleted', 'success');
    await loadSettings();
  } catch (e) {
    toast(e.message || 'Could not delete department', 'error');
  }
}

async function uploadAvatar(file) {
  if (!file) return;
  const form = new FormData();
  form.append('photo', file);
  try {
    await api.upload('/employees/me/photo', form);
    toast('Avatar updated', 'success');
    await loadSettings();
    buildSidebar('settings');
  } catch (e) {
    toast(e.message || 'Could not upload avatar', 'error');
  }
}

async function saveAccount() {
  try {
    const updated = await api.patch(`/employees/${profile.id}/account`, { email: document.getElementById('settings-email').value });
    api.setUser({ ...profile, ...updated });
    toast('Email updated', 'success');
    await loadSettings();
  } catch (e) {
    toast(e.message || 'Could not update email', 'error');
  }
}

async function savePassword() {
  try {
    await api.put('/auth/password', {
      current_password: document.getElementById('current-password').value,
      new_password: document.getElementById('new-password').value
    });
    document.getElementById('current-password').value = '';
    document.getElementById('new-password').value = '';
    toast('Password updated', 'success');
  } catch (e) {
    toast(e.message || 'Could not update password', 'error');
  }
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}
</script>
</body>
</html>

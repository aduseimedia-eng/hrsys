<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - KenadHR</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/workspace.css">
  <style>
    .settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); gap: 18px; }
    .settings-profile { display: flex; align-items: center; gap: 16px; }
    .settings-profile .avatar { width: 76px; height: 76px; font-size: 1.45rem; }
    .billing-card { margin-top:18px; }
    .billing-status { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:14px; background:#f5f8ff; border:1px solid #dfe7f5; border-radius:10px; margin-bottom:16px; }
    .billing-plans { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .billing-plan { padding:16px; border:1px solid #dfe7f5; border-radius:12px; background:#fff; display:flex; flex-direction:column; gap:10px; }
    .billing-plan.current { border-color:#174FAE; box-shadow:0 0 0 2px rgba(23,79,174,.1); }
    .billing-plan h4, .billing-plan p { margin:0; }
    .billing-plan p { min-height:36px; color:var(--text-muted); font-size:.82rem; }
    .billing-price { color:#174FAE; font-size:1.3rem; font-weight:800; }
    .billing-plan .btn { margin-top:auto; justify-content:center; }
    @media (max-width:700px) { .billing-plans { grid-template-columns:1fr; } }
    @media (max-width: 900px) { .settings-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <header class="topbar">
    <div class="topbar-title">Settings</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="notif-btn" title="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="dot hidden" id="notif-badge"></span>
      </button>
    </div>

  </header>
  <main class="main-content">
    <div class="page-header">
      <div><h1>Settings</h1><p>Manage your HR account, password, and avatar</p></div>
    </div>

    <div class="settings-grid">
      <article class="card">
        <div class="card-header"><h3>Account Details</h3></div>
        <div class="card-body">
          <div class="settings-profile" style="margin-bottom:20px">
            <div id="settings-avatar"></div>
            <div>
              <h3 id="settings-name">HR account</h3>
              <p id="settings-role" style="color:var(--text-muted);font-size:.88rem"></p>
              <label class="btn btn-outline btn-sm" style="margin-top:10px">
                Upload Avatar
                <input type="file" accept="image/*" style="display:none" onchange="uploadAvatar(this.files[0])">
              </label>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" id="settings-email" class="form-control">
          </div>
          <button class="btn btn-primary" onclick="saveAccount()">Save Email</button>
        </div>
      </article>

      <article class="card">
        <div class="card-header"><h3>Password</h3></div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">Current Password</label>
            <input type="password" id="current-password" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" id="new-password" class="form-control">
          </div>
          <button class="btn btn-primary" onclick="savePassword()">Change Password</button>
        </div>
      </article>
    </div>

    <article class="card billing-card">
      <div class="card-header"><h3>Billing &amp; annual plan</h3></div>
      <div class="card-body">
        <div class="billing-status" id="billing-status"><span>Loading billing details…</span></div>
        <div class="billing-plans" id="billing-plans"></div>
      </div>
    </article>
  </main>
</div>

<script src="../js/api.js"></script>
<script>
const user = requireRole('admin');
if (!user) throw new Error('redirect');
buildSidebar('settings');
loadNotifCount();
let profile = user;
loadSettings();
(async () => {
  await loadBilling();
  const checkoutPlan = new URLSearchParams(window.location.search).get('checkout');
  if (checkoutPlan) await startCheckout(checkoutPlan);
})();

async function loadSettings() {
  profile = await api.get('/auth/me');
  api.setUser(profile);
  renderSettings();
}

function renderSettings() {
  document.getElementById('settings-avatar').innerHTML = avatarEl(profile, 'xl');
  document.getElementById('settings-name').textContent = `${profile.first_name} ${profile.last_name}`;
  document.getElementById('settings-role').textContent = `${profile.job_title || 'HR'} ${profile.department_name ? '- ' + profile.department_name : ''}`;
  document.getElementById('settings-email').value = profile.email || '';
}

async function uploadAvatar(file) {
  if (!file) return;
  const form = new FormData();
  form.append('photo', file);
  try {
    await api.upload('/employees/me/photo', form);
    toast('Avatar updated', 'success');
    await loadSettings();
    buildSidebar('settings');
  } catch (e) {
    toast(e.message || 'Could not upload avatar', 'error');
  }
}

async function saveAccount() {
  try {
    const updated = await api.patch(`/employees/${profile.id}/account`, { email: document.getElementById('settings-email').value });
    api.setUser({ ...profile, ...updated });
    toast('Email updated', 'success');
    await loadSettings();
  } catch (e) {
    toast(e.message || 'Could not update email', 'error');
  }
}

async function savePassword() {
  try {
    await api.put('/auth/password', {
      current_password: document.getElementById('current-password').value,
      new_password: document.getElementById('new-password').value
    });
    document.getElementById('current-password').value = '';
    document.getElementById('new-password').value = '';
    toast('Password updated', 'success');
  } catch (e) {
    toast(e.message || 'Could not update password', 'error');
  }
}

function money(amount, currency) {
  return new Intl.NumberFormat('en-GH', { style: 'currency', currency }).format(Number(amount || 0) / 100);
}

function billingStatus(subscription, enabled) {
  if (!enabled) return 'Online payments are not configured yet. Please contact KenadHR.';
  if (!subscription) return 'Choose an annual plan to start your KenadHR subscription.';
  if (subscription.status === 'active' && subscription.ends_at) {
    return `Your ${subscription.plan_key} plan is active until ${fmt.date(subscription.ends_at)}.`;
  }
  if (subscription.status === 'pending') return 'You have a payment waiting to be completed.';
  return `Subscription status: ${subscription.status}.`;
}

async function loadBilling() {
  const status = document.getElementById('billing-status');
  const plansEl = document.getElementById('billing-plans');
  try {
    const [plansResult, current] = await Promise.all([api.get('/billing/plans'), api.get('/billing/current')]);
    const subscription = current.subscription;
    status.innerHTML = `<span>${escapeUi(billingStatus(subscription, plansResult.billing_enabled))}</span>${subscription?.status === 'active' ? '<span class="badge badge-success">Active</span>' : ''}`;
    plansEl.innerHTML = plansResult.plans.map((plan) => `
      <section class="billing-plan ${subscription?.plan_key === plan.key ? 'current' : ''}">
        <h4>${escapeUi(plan.name)}</h4>
        <p>${escapeUi(plan.description || 'Annual KenadHR access.')}</p>
        <div class="billing-price">${escapeUi(money(plan.amount, plan.currency))}<small style="font-size:.75rem;color:var(--text-muted);font-weight:600"> / year</small></div>
        <button class="btn ${subscription?.plan_key === plan.key && subscription?.status === 'active' ? 'btn-outline' : 'btn-primary'} btn-sm" type="button" ${plansResult.billing_enabled ? '' : 'disabled'} onclick="startCheckout('${escapeUi(plan.key)}')">${subscription?.plan_key === plan.key && subscription?.status === 'active' ? 'Current plan' : (subscription?.status === 'active' && Number(plan.amount) > Number(subscription.amount) ? 'Upgrade plan' : 'Choose plan')}</button>
      </section>`).join('');
  } catch (error) {
    status.textContent = error.message || 'Could not load billing details.';
    plansEl.innerHTML = '';
  }
}

async function startCheckout(planKey) {
  try {
    const result = await api.post('/billing/checkout', { plan_key: planKey });
    // Paystack Checkout must run in the top-level browser window, not inside
    // the HR workspace iframe.
    if (window.top !== window.self) window.top.location.assign(result.authorization_url);
    else window.location.assign(result.authorization_url);
  } catch (error) {
    toast(error.message || 'Could not start checkout', 'error');
  }
}

async function verifyReturnedPayment() {
  const params = new URLSearchParams(window.location.search);
  const reference = params.get('reference');
  if (!reference) return;
  try {
    const result = await api.get(`/billing/verify/${encodeURIComponent(reference)}`);
    toast(`Payment confirmed. Your plan is active until ${fmt.date(result.subscription.ends_at)}.`, 'success', 6000);
    window.history.replaceState({}, document.title, window.location.pathname);
    await loadBilling();
  } catch (error) {
    toast(error.message || 'We could not confirm the payment yet. Please refresh shortly.', 'error', 6000);
  }
}

verifyReturnedPayment();

</script>
</body>
</html>

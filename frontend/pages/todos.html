<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List - KenadHR</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/suite.css">
  <link rel="stylesheet" href="../css/workspace.css">
  <style>
    .todo-page-head {
      margin-bottom: 18px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }
    .todo-page-head h1 {
      font-size: 1.55rem;
      margin: 0;
    }
    .todo-page-head p {
      color: var(--text-secondary);
      font-size: .9rem;
      margin-top: 5px;
    }
    .todo-filters {
      display: inline-flex;
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-surface);
      box-shadow: var(--shadow-sm);
    }
    .todo-filter {
      min-height: 34px;
      border: 0;
      border-radius: 6px;
      padding: 0 12px;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 700;
      cursor: pointer;
    }
    .todo-filter.active {
      background: var(--navy-800);
      color: #fff;
    }
    .todo-list-page {
      display: grid;
      gap: 12px;
    }
    .todo-modal { width:min(640px,100%); max-width:640px; max-height:none; overflow:visible; border-radius:12px; }
    .todo-modal .modal-header { min-height:auto; padding:20px 22px 14px; }
    .todo-modal .modal-header::after { display:none; }
    .todo-modal .modal-header h3 { font-size:1.05rem; }
    .todo-modal .modal-header p { margin:4px 0 0; color:var(--text-muted); font-size:.8rem; }
    .todo-modal .modal-body { padding:20px 22px; overflow:visible; }
    .todo-modal .modal-footer { padding:14px 22px; background:#fff; }
    .todo-modal .form-grid { gap:0 14px; }
    .todo-modal .form-group { margin-bottom:15px; }
    .todo-modal .form-control { min-height:40px; }
    .todo-modal .modal-close { border-radius:7px; font-size:1.25rem; }
    @media (max-width:640px) { .todo-modal { max-height:90vh; overflow:hidden; } .todo-modal .modal-body { overflow:auto; } }
    .todo-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      box-shadow: var(--shadow-sm);
    }
    .todo-card.completed {
      background: var(--navy-50);
    }
    .todo-card h3 {
      font-size: .98rem;
      margin: 0;
    }
    .todo-card p {
      color: var(--text-secondary);
      font-size: .84rem;
      line-height: 1.45;
      margin-top: 5px;
    }
    .todo-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .todo-actions {
      display: flex;
      align-items: flex-end;
      flex-direction: column;
      gap: 8px;
      text-align: right;
    }
    .todo-action-row {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }
    .todo-history-note {
      color: var(--text-muted);
      font-size: .78rem;
    }
    @media (max-width: 720px) {
      .todo-page-head,
      .todo-card {
        grid-template-columns: 1fr;
        flex-direction: column;
        align-items: stretch;
      }
      .todo-filters {
        width: 100%;
      }
      .todo-filter {
        flex: 1;
      }
      .todo-actions {
        align-items: flex-start;
        text-align: left;
      }
      .todo-action-row {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <header class="topbar">
    <div class="topbar-title">To Do List</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="notif-btn" title="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="dot hidden" id="notif-badge"></span>
      </button>
      <button class="btn btn-primary btn-sm" type="button" onclick="openTodoModal()">New To Do</button>
    </div>
  </header>

  <main class="main-content">
    <section class="todo-page-head">
      <div>
        <span class="suite-eyebrow">Shared work</span>
        <h1>To Do List</h1>
        <p>Everyone can mark items complete when the work is done, then check the completed history later.</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end">
        <button class="btn btn-primary btn-sm" type="button" onclick="openTodoModal()">New To Do</button>
        <div class="todo-filters" role="tablist" aria-label="To do filters">
          <button class="todo-filter active" type="button" data-filter="open">Open</button>
          <button class="todo-filter" type="button" data-filter="completed">History</button>
          <button class="todo-filter" type="button" data-filter="all">All</button>
        </div>
      </div>
    </section>

    <section class="suite-kpis" id="todo-kpis"></section>

    <section class="todo-list-page" id="todo-list">
      <div class="loading-state"><div class="spinner"></div><span>Loading to do list...</span></div>
    </section>
  </main>
</div>

<div id="todo-modal" class="modal-overlay" style="display:none">
  <div class="modal todo-modal">
    <div class="modal-header">
      <div><h3 id="todo-modal-title">New To Do</h3><p>Assign a clear next step to the right people.</p></div>
      <button class="modal-close" type="button" aria-label="Close" onclick="closeTodoModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group span-2">
          <label class="form-label required" for="todo-title">Title</label>
          <input type="text" id="todo-title" class="form-control" placeholder="What needs to be done?">
        </div>
        <div class="form-group span-2">
          <label class="form-label" for="todo-detail">Details</label>
          <textarea id="todo-detail" class="form-control" rows="3" placeholder="Add useful context"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label required" for="todo-owner-type">Assign to</label>
          <select id="todo-owner-type" class="form-control form-select" onchange="toggleEmployeeAssignee()">
            <option value="everyone">Everyone</option>
            <option value="hr">HR</option>
            <option value="managers">Managers</option>
            <option value="employee">Specific employee</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="todo-employee">Employee</label>
          <select id="todo-employee" class="form-control form-select" disabled></select>
        </div>
        <div class="form-group">
          <label class="form-label" for="todo-priority">Priority</label>
          <select id="todo-priority" class="form-control form-select">
            <option value="Normal">Normal</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="todo-due">Due date</label>
          <input type="date" id="todo-due" class="form-control">
        </div>
        <div class="form-group span-2">
          <label class="form-label" for="todo-link">Linked page</label>
          <select id="todo-link" class="form-control form-select">
            <option value="">None</option>
            <option value="/pages/dashboard.html">Dashboard</option>
            <option value="/pages/leave.html">Leave</option>
            <option value="/pages/payroll.html">Payroll</option>
            <option value="/pages/documents.html">Documents</option>
            <option value="/pages/performance.html">Performance</option>
            <option value="/pages/onboarding.html">Onboarding</option>
            <option value="/pages/employees.html">Employees</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" type="button" onclick="closeTodoModal()">Cancel</button>
      <button class="btn btn-primary" type="button" onclick="saveTodo()">Save To Do</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
const user = requireAuth();
if (!user) throw new Error('redirect');

let todoFilter = 'open';
let todoRows = [];
let todoDirectory = [];
let editingTodoId = null;

buildSidebar('todos');
loadNotifCount();
bindTodoFilters();
loadTodos();
loadTodoDirectory();

function bindTodoFilters() {
  document.querySelectorAll('.todo-filter').forEach((button) => {
    button.addEventListener('click', () => {
      todoFilter = button.dataset.filter;
      document.querySelectorAll('.todo-filter').forEach((btn) => btn.classList.toggle('active', btn === button));
      renderTodos();
    });
  });
}

async function loadTodos() {
  try {
    todoRows = await api.get('/todos?status=all');
    renderKpis();
    renderTodos();
  } catch (err) {
    toast(err.message || 'Could not load to do list', 'error');
  }
}

async function loadTodoDirectory() {
  try {
    todoDirectory = await api.get('/employees/directory');
    renderEmployeeOptions();
  } catch (err) {
    todoDirectory = [];
  }
}

function renderEmployeeOptions() {
  const select = document.getElementById('todo-employee');
  if (!select) return;
  select.innerHTML = '<option value="">Select employee</option>' + todoDirectory
    .map((employee) => `<option value="${employee.id}">${escapeHtml(employee.first_name)} ${escapeHtml(employee.last_name)}</option>`)
    .join('');
}

function renderKpis() {
  const open = todoRows.filter((todo) => !todo.completed).length;
  const completed = todoRows.filter((todo) => todo.completed).length;
  const dueSoon = todoRows.filter((todo) => !todo.completed && daysUntil(todo.due_date) <= 2).length;
  document.getElementById('todo-kpis').innerHTML = [
    ['Open', open, 'items to finish'],
    ['Completed', completed, 'available in history'],
    ['Due soon', dueSoon, 'within two days'],
    ['Total', todoRows.length, 'shared items']
  ].map(([label, value, note]) => `
    <article class="suite-kpi"><span>${escapeHtml(label)}</span><div><strong>${escapeHtml(value)}</strong><small>${escapeHtml(note)}</small></div></article>
  `).join('');
}

function renderTodos() {
  const rows = todoRows.filter((todo) => {
    if (todoFilter === 'open') return !todo.completed;
    if (todoFilter === 'completed') return todo.completed;
    return true;
  });
  const target = document.getElementById('todo-list');
  if (!rows.length) {
    target.innerHTML = '<div class="suite-empty">No to do items match this filter.</div>';
    return;
  }

  target.innerHTML = rows.map((todo) => `
    <article class="todo-card ${todo.completed ? 'completed' : ''}">
      <div>
        <h3>${escapeHtml(todo.title)}</h3>
        <p>${escapeHtml(todo.detail)}</p>
        <div class="todo-meta">
          <span class="suite-pill ${priorityTone(todo.priority)}">${escapeHtml(todo.priority || 'Normal')}</span>
          <span class="suite-pill">${escapeHtml(todo.owner || 'Everyone')}</span>
          <span class="suite-pill ${dueTone(todo)}">${todo.completed ? 'Completed' : 'Due ' + escapeHtml(fmt.date(todo.due_date))}</span>
        </div>
      </div>
      <div class="todo-actions">
        ${todo.completed
          ? `<span class="todo-history-note">Completed by ${escapeHtml(todo.completed_by_name || 'someone')}<br>${escapeHtml(fmt.datetime(todo.completed_at))}</span>
             <div class="todo-action-row">
               <button class="btn btn-outline btn-sm" type="button" onclick="editTodo(${todo.id})">Edit</button>
               <button class="btn btn-outline btn-sm" type="button" onclick="reopenTodo(${todo.id})">Reopen</button>
               <button class="btn btn-danger btn-sm" type="button" onclick="deleteTodo(${todo.id})">Delete</button>
             </div>`
          : `<div class="todo-action-row">
               <button class="btn btn-primary btn-sm" type="button" onclick="completeTodo(${todo.id})">Mark Completed</button>
               <button class="btn btn-outline btn-sm" type="button" onclick="editTodo(${todo.id})">Edit</button>
               <button class="btn btn-danger btn-sm" type="button" onclick="deleteTodo(${todo.id})">Delete</button>
             </div>
             ${todo.link ? `<a class="btn btn-outline btn-sm" href="${escapeHtml(pageHref(todo.link))}">Open</a>` : ''}`
        }
      </div>
    </article>
  `).join('');
}

function openTodoModal(todo = null) {
  editingTodoId = todo?.id || null;
  document.getElementById('todo-modal-title').textContent = editingTodoId ? 'Edit To Do' : 'New To Do';
  document.getElementById('todo-title').value = todo?.title || '';
  document.getElementById('todo-detail').value = todo?.detail || '';
  document.getElementById('todo-owner-type').value = todo?.owner_type || 'everyone';
  document.getElementById('todo-employee').value = todo?.assigned_employee_id || '';
  document.getElementById('todo-priority').value = todo?.priority || 'Normal';
  document.getElementById('todo-due').value = todo?.due_date || '';
  document.getElementById('todo-link').value = todo?.link || '';
  toggleEmployeeAssignee();
  document.getElementById('todo-modal').style.display = 'flex';
  window.dispatchEvent(new Event('hrconnect:request-page-height'));
}

function closeTodoModal() {
  editingTodoId = null;
  document.getElementById('todo-modal').style.display = 'none';
  window.dispatchEvent(new Event('hrconnect:request-page-height'));
}

function toggleEmployeeAssignee() {
  const select = document.getElementById('todo-employee');
  select.disabled = document.getElementById('todo-owner-type').value !== 'employee';
}

function editTodo(id) {
  const todo = todoRows.find((item) => Number(item.id) === Number(id));
  if (todo) openTodoModal(todo);
}

async function saveTodo() {
  const ownerType = document.getElementById('todo-owner-type').value;
  const payload = {
    title: document.getElementById('todo-title').value.trim(),
    detail: document.getElementById('todo-detail').value.trim(),
    owner_type: ownerType,
    assigned_employee_id: ownerType === 'employee' ? document.getElementById('todo-employee').value : null,
    priority: document.getElementById('todo-priority').value,
    due_date: document.getElementById('todo-due').value,
    link: document.getElementById('todo-link').value
  };

  try {
    if (editingTodoId) {
      await api.put(`/todos/${editingTodoId}`, payload);
      toast('To do item updated', 'success');
    } else {
      await api.post('/todos', payload);
      toast('To do item created', 'success');
    }
    closeTodoModal();
    await loadTodos();
  } catch (err) {
    toast(err.message || 'Could not save to do item', 'error');
  }
}

async function completeTodo(id) {
  try {
    await api.patch(`/todos/${id}/complete`);
    toast('To do item completed', 'success');
    await loadTodos();
  } catch (err) {
    toast(err.message || 'Could not complete item', 'error');
  }
}

async function reopenTodo(id) {
  try {
    await api.patch(`/todos/${id}/reopen`);
    toast('To do item reopened', 'info');
    await loadTodos();
  } catch (err) {
    toast(err.message || 'Could not reopen item', 'error');
  }
}

async function deleteTodo(id) {
  if (!confirm('Delete this to do item?')) return;
  try {
    await api.delete(`/todos/${id}`);
    toast('To do item deleted', 'success');
    await loadTodos();
  } catch (err) {
    toast(err.message || 'Could not delete item', 'error');
  }
}

function pageHref(link) {
  const page = String(link || '').split('/').pop();
  return page || '#';
}

function daysUntil(date) {
  if (!date) return Infinity;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.ceil((new Date(date) - today) / 86400000);
}

function dueTone(todo) {
  const days = daysUntil(todo.due_date);
  if (todo.completed) return 'good';
  if (days < 0) return 'danger';
  if (days <= 2) return 'warn';
  return '';
}

function priorityTone(priority) {
  if (priority === 'High') return 'danger';
  if (priority === 'Medium') return 'warn';
  return '';
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}
</script>
</body>
</html>

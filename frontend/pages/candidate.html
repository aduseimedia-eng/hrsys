<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidate - KenadHR</title><link rel="stylesheet" href="../css/main.css"><style>.candidate-layout{display:grid;grid-template-columns:1fr 340px;gap:20px}.detail-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:15px}.detail-card h3{margin-top:0}.timeline{padding:0;list-style:none}.timeline li{padding:9px 0;border-bottom:1px solid var(--border)}@media(max-width:800px){.candidate-layout{grid-template-columns:1fr}}</style></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Candidate profile</div></header><main class="main-content"><div id="content" class="loading-state"><div class="spinner"></div></div></main></div><script src="../js/api.js"></script><script>const user=requireAuth();if(!user)throw Error('redirect');buildSidebar('hiring');const id=new URLSearchParams(location.search).get('id'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let c;async function load(){c=await api.get('/recruitment/applications/'+id);render()}function render(){document.getElementById('content').className='candidate-layout';document.getElementById('content').innerHTML=`<section><div class="page-header"><div><h1>${esc(c.full_name)}</h1><p>${esc(c.email)} · ${esc(c.phone||'No phone')}</p></div><a class="btn btn-outline" href="hiring.html">Back to hiring</a></div><div class="detail-card"><h3>${esc(c.requisition_title||c.role_applied||'General application')}</h3><p>${esc(c.cover_note||'No cover note provided.')}</p><p><strong>Documents:</strong> ${c.documents.map(d=>`<button class="btn btn-outline btn-sm" onclick="downloadDoc(${d.id})">${esc(d.name)}</button>`).join(' ')||'None'}</p></div><div class="detail-card"><h3>Private notes</h3><ul class="timeline">${c.notes.map(n=>`<li>${esc(n.body)}<br><small>${esc(n.author_name||'HR team')} · ${new Date(n.created_at).toLocaleString()}</small></li>`).join('')||'<li>No notes yet.</li>'}</ul><textarea id="note" class="form-control" rows="3" placeholder="Add an internal note"></textarea><p><button class="btn btn-primary btn-sm" onclick="addNote()">Save note</button></p></div><div class="detail-card"><h3>Interviews</h3><ul class="timeline">${c.interviews.map(i=>`<li><strong>${new Date(i.scheduled_at).toLocaleString()}</strong> · ${esc(i.status)}<br><small>${esc(i.meeting_location||'Location not set')} ${i.score?` · Score ${i.score}/5`:''}</small></li>`).join('')||'<li>No interviews scheduled.</li>'}</ul><input id="interview-date" type="datetime-local" class="form-control"><input id="interview-location" class="form-control" style="margin-top:8px" placeholder="Meeting link or location"><p><button class="btn btn-outline btn-sm" onclick="schedule()">Schedule interview</button></p></div></section><aside><div class="detail-card"><h3>Candidate controls</h3><label class="form-label">Pipeline stage</label><select id="stage" class="form-control" onchange="setStage()">${['submitted','screening','interview','assessment','offer','hired','rejected'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select><label class="form-label" style="margin-top:12px">Rating</label><select id="rating" class="form-control" onchange="setStage()"><option value="">Not rated</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${c.rating===n?'selected':''}>${n} / 5</option>`).join('')}</select></div><div class="detail-card"><h3>Offer</h3><input id="salary" type="number" class="form-control" placeholder="Annual salary" value="${c.offer?.salary||''}"><input id="start" type="date" class="form-control" style="margin-top:8px" value="${c.offer?.start_date?.slice(0,10)||''}"><textarea id="offer-message" class="form-control" rows="3" style="margin-top:8px" placeholder="Offer message">${esc(c.offer?.message||'')}</textarea><select id="offer-status" class="form-control" style="margin-top:8px"><option value="draft">Draft</option><option value="sent">Sent</option><option value="accepted">Accepted</option><option value="declined">Declined</option></select><p><button class="btn btn-primary btn-sm" onclick="saveOffer()">Save offer</button></p><button class="btn btn-outline btn-sm" onclick="hire()" ${c.hired_employee_id?'disabled':''}>${c.hired_employee_id?'Sent to onboarding':'Create onboarding record'}</button></div></aside>`}async function setStage(){await api.patch('/recruitment/applications/'+id,{status:stage.value,rating:rating.value||null});toast('Candidate updated','success')}async function addNote(){if(!note.value.trim())return;await api.post('/recruitment/applications/'+id+'/notes',{body:note.value});load()}async function schedule(){if(!document.getElementById('interview-date').value)return toast('Choose an interview time','error');await api.post('/recruitment/applications/'+id+'/interviews',{scheduled_at:document.getElementById('interview-date').value,meeting_location:document.getElementById('interview-location').value});load()}async function saveOffer(){await api.put('/recruitment/applications/'+id+'/offer',{salary:salary.value,start_date:start.value,message:document.getElementById('offer-message').value,status:document.getElementById('offer-status').value});toast('Offer saved','success');load()}async function hire(){try{await api.post('/recruitment/applications/'+id+'/hire',{});toast('Draft employee sent to onboarding','success');load()}catch(e){toast(e.message,'error')}}async function downloadDoc(d){const r=await fetch(`${API_BASE}/recruitment/applications/${id}/documents/${d}`,{headers:{Authorization:'Bearer '+localStorage.getItem('token')}});const u=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=u;a.download='candidate-document';a.click();URL.revokeObjectURL(u)}load().catch(e=>toast(e.message,'error'));</script></body></html>

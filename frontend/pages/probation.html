<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Probation Tracker - KenadHR</title><link rel="stylesheet" href="../css/main.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Probation Tracker</div><div class="topbar-actions" id="probation-actions"></div></header><main class="main-content"><div class="page-header"><div><h1 id="probation-title">Probation Tracker</h1><p id="probation-intro">Track probation periods, reviews, and outcomes.</p></div><div id="probation-page-action"></div></div><div class="table-container"><table><thead><tr><th>Employee</th><th>Start</th><th>End</th><th>Review date</th><th>Days remaining</th><th>Status</th><th>Outcome notes</th><th id="probation-action-head"></th></tr></thead><tbody id="probation-body"></tbody></table></div></main></div><div id="probation-modal" class="modal-overlay" style="display:none"><div class="modal"><div class="modal-header"><h3 id="probation-modal-title">Add Probation Record</h3><button class="modal-close" onclick="closeProbation()">x</button></div><div class="modal-body"><input type="hidden" id="pr-id"><div class="form-grid"><div class="form-group"><label class="form-label">Employee</label><select id="pr-employee" class="form-control form-select"></select></div><div class="form-group"><label class="form-label">Status</label><select id="pr-status" class="form-control form-select"><option value="active">Active</option><option value="passed">Passed</option><option value="extended">Extended</option><option value="failed">Failed</option></select></div><div class="form-group"><label class="form-label required">Start date</label><input id="pr-start" type="date" class="form-control"></div><div class="form-group"><label class="form-label required">End date</label><input id="pr-end" type="date" class="form-control"></div><div class="form-group"><label class="form-label">Review date</label><input id="pr-review" type="date" class="form-control"></div><div class="form-group span-2"><label class="form-label">Outcome notes</label><textarea id="pr-notes" rows="3" class="form-control"></textarea></div></div></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeProbation()">Cancel</button><button class="btn btn-primary" onclick="saveProbation()">Save</button></div></div></div><script src="../js/api.js"></script><script>const user=requireAuth();if(!user)throw Error('redirect');const canManage=['admin','manager'].includes(user.role);let rows=[],employees=[];buildSidebar('probation');loadNotifCount();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function closeProbation(){document.getElementById('probation-modal').style.display='none'}function daysRemaining(end,status){if(!['active','extended'].includes(status))return '—';return Math.max(0,Math.ceil((new Date(end)-new Date())/86400000))+' days'}async function load(){if(canManage){[rows,employees]=await Promise.all([api.get('/probation'),api.get('/employees?limit=1000')]);employees=employees.employees;}else{rows=await api.get('/probation/mine');document.getElementById('probation-title').textContent='My Probation';document.getElementById('probation-intro').textContent='Your probation period and review outcome.';}render()}function render(){document.getElementById('probation-action-head').textContent=canManage?'Action':'';document.getElementById('probation-body').innerHTML=rows.length?rows.map(r=>`<tr><td>${canManage?`${esc(r.employee_name)}<br><small>${esc(r.employee_code||'')}</small>`:'You'}</td><td>${fmt.date(r.start_date)}</td><td>${fmt.date(r.end_date)}</td><td>${r.review_date?fmt.date(r.review_date):'—'}</td><td>${daysRemaining(r.end_date,r.status)}</td><td>${fmt.statusBadge(r.status)}</td><td>${esc(r.outcome_notes||'—')}</td><td>${canManage?`<button class="btn btn-outline btn-sm" onclick="openProbation(${r.id})">Edit</button>`:''}</td></tr>`).join(''):`<tr><td colspan="8"><div class="empty-state"><p>No probation records yet.</p></div></td></tr>`}function openProbation(id){const r=id?rows.find(x=>x.id===id):null;document.getElementById('probation-modal-title').textContent=r?'Edit Probation Record':'Add Probation Record';document.getElementById('pr-id').value=r?.id||'';document.getElementById('pr-employee').innerHTML=employees.map(e=>`<option value="${e.id}" ${r?.employee_id===e.id?'selected':''}>${esc(e.first_name+' '+e.last_name)}</option>`).join('');document.getElementById('pr-start').value=r?.start_date||'';document.getElementById('pr-end').value=r?.end_date||'';document.getElementById('pr-review').value=r?.review_date||'';document.getElementById('pr-status').value=r?.status||'active';document.getElementById('pr-notes').value=r?.outcome_notes||'';document.getElementById('probation-modal').style.display='flex'}async function saveProbation(){try{const body={employee_id:Number(document.getElementById('pr-employee').value),start_date:document.getElementById('pr-start').value,end_date:document.getElementById('pr-end').value,review_date:document.getElementById('pr-review').value,status:document.getElementById('pr-status').value,outcome_notes:document.getElementById('pr-notes').value},id=document.getElementById('pr-id').value;if(id)await api.put(`/probation/${id}`,body);else await api.post('/probation',body);closeProbation();toast('Probation record saved','success');load()}catch(e){toast(e.message,'error')}}if(canManage){const button='<button class="btn btn-primary" onclick="openProbation()">Add Probation</button>';document.getElementById('probation-actions').innerHTML=button;document.getElementById('probation-page-action').innerHTML=button}load().catch(e=>toast(e.message,'error'));</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salary Details - KenadHR</title><link rel="stylesheet" href="../css/main.css"><style>.comp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.comp-card{border:1px solid var(--border);background:var(--bg-surface);border-radius:13px;padding:17px}.comp-card span{color:var(--text-muted);font-size:.75rem}.comp-card strong{display:block;margin-top:5px;font-size:1.2rem}.comp-section{margin:20px 0}.comp-section h2{font-size:1rem;margin:0 0 12px}@media(max-width:700px){.comp-grid{grid-template-columns:1fr}}</style></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Salary Details</div></header><main class="main-content"><div class="page-header"><div><h1 id="title">Salary Details</h1><p id="subtitle">Review current compensation and salary history.</p></div><button class="btn btn-outline" onclick="back()">Back to Salary Management</button></div><div id="detail"><div class="loading-state"><div class="spinner"></div></div></div></main></div><script src="../js/api.js"></script><script>const user=requireAuth();if(!user)throw Error('redirect');if(user.role!=='admin'){location.href=appUrl('/pages/workspace.html#payroll');throw Error('restricted')}buildSidebar('compensation');loadNotifCount();const id=new URLSearchParams(location.search).get('employee_id');const card=(l,v)=>`<article class="comp-card"><span>${l}</span><strong>${fmt.currency(v)}</strong></article>`;function back(){if(isEmbeddedWorkspacePage()){window.parent.postMessage({type:'hrconnect:navigate',route:'compensation'},window.location.origin);return}location.href=appUrl('/pages/workspace.html#compensation')}async function load(){if(!id){detail.innerHTML='<div class="empty-state"><p>Select an employee from Salary Management.</p></div>';return}try{const r=await api.get('/compensation/'+id),e=r.employee,c=r.records.find(x=>x.status==='current');title.textContent=`${e.first_name} ${e.last_name}`;subtitle.textContent=`${e.job_title||'Employee'} · ${e.department_name||'Unassigned'} · ${e.employee_code||''}`;detail.innerHTML=c?`<section class="comp-section"><h2>Current Compensation</h2><div class="comp-grid">${card('Basic salary',c.basic_salary)}${card('Allowances',c.allowances)}${card('Gross salary',c.gross_salary)}${card('Estimated net salary',c.estimated_net_salary)}</div></section><section class="comp-section"><h2>Statutory Contributions</h2><div class="comp-grid">${card('Employee SSNIT (5.5%)',c.employee_ssnit)}${card('Employer SSNIT (13%)',c.employer_ssnit)}${card('Tier 1 / SSNIT (13.5%)',c.tier1_contribution)}${card('Tier 2 pension (5%)',c.tier2_contribution)}${card('PAYE',c.paye)}${card('Other deductions',c.other_deductions)}</div></section>`:'<div class="empty-state"><p>No current salary has been set for this employee.</p></div>';detail.innerHTML+=`<section class="comp-section"><h2>Salary History</h2><div class="table-container"><table><thead><tr><th>Effective from</th><th>Effective to</th><th>Basic</th><th>Allowances</th><th>Gross</th><th>Net salary</th><th>Status</th></tr></thead><tbody>${r.records.map(x=>`<tr><td>${x.effective_from}</td><td>${x.effective_to||'Current'}</td><td>${fmt.currency(x.basic_salary)}</td><td>${fmt.currency(x.allowances)}</td><td>${fmt.currency(x.gross_salary)}</td><td>${fmt.currency(x.estimated_net_salary)}</td><td>${fmt.statusBadge(x.status)}</td></tr>`).join('')||'<tr><td colspan="7">No salary history.</td></tr>'}</tbody></table></div></section>`}catch(e){detail.innerHTML=`<div class="empty-state"><p>${e.message||'Could not load salary details.'}</p></div>`}}load();</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Departments - KenadHR</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/workspace.css"><style>
.departments-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:22px}.departments-head h1{margin:0}.departments-head p{color:var(--text-secondary);margin-top:5px}.department-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.department-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.department-card{padding:18px;border:1px solid var(--border);border-radius:14px;background:var(--bg-surface);box-shadow:var(--shadow-sm)}.department-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.department-name{display:flex;gap:11px;min-width:0}.department-symbol{width:40px;height:40px;display:grid;place-items:center;border-radius:11px;background:#e8f0ff;color:#2865d9;font-weight:850}.department-card h3{margin:0;color:var(--text-primary);font-size:1rem}.department-card p{margin:4px 0 0;color:var(--text-muted);font-size:.8rem}.department-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.department-meta div{padding:10px;border-radius:9px;background:var(--bg-page)}.department-meta span{display:block;color:var(--text-muted);font-size:.7rem}.department-meta strong{display:block;margin-top:4px;color:var(--text-primary);font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.department-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:13px;border-top:1px solid var(--border)}.department-footer span{color:var(--text-secondary);font-size:.78rem}.department-delete-dialog{max-width:420px}.department-delete-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:#fff0f2;color:#d63350;font-size:1.35rem;font-weight:850;margin-bottom:14px}.department-delete-dialog p{color:var(--text-secondary);line-height:1.55}.department-delete-impact{margin-top:14px;padding:12px;border:1px solid #ffd6df;border-radius:10px;background:#fff7f8;color:#8b3445;font-size:.84rem}.department-delete-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}@media(max-width:640px){.departments-head{align-items:stretch;flex-direction:column}.department-form{grid-template-columns:1fr}.department-delete-actions .btn{flex:1}}
</style></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Departments</div><div class="topbar-actions"><button class="icon-btn" id="notif-btn" type="button" title="Notifications"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg><span class="dot hidden" id="notif-badge"></span></button></div></header><main class="main-content"><div class="departments-head"><div><h1>Departments</h1><p>Organize your workforce into clear, manageable teams.</p></div><form class="department-form" id="department-form"><input id="department-name" class="form-control" placeholder="New department name" required><button class="btn btn-primary" type="submit">Add Department</button></form></div><section class="department-grid" id="department-list"><div class="loading-state"><div class="spinner"></div><span>Loading departments...</span></div></section></main></div>
<script src="../js/api.js"></script><script>
const user=requireRole('admin');if(!user)throw new Error('redirect');buildSidebar('departments');loadNotifCount();let departments=[];document.getElementById('department-form').addEventListener('submit',addDepartment);loadDepartments();
async function loadDepartments(){try{departments=await api.get('/employees/departments');renderDepartments()}catch(error){document.getElementById('department-list').innerHTML=`<div class="empty-state"><p>${escapeHtml(error.message||'Could not load departments')}</p></div>`}}
function renderDepartments(){const target=document.getElementById('department-list');if(!departments.length){target.innerHTML='<div class="empty-state"><p>No departments yet. Add your first team above.</p></div>';return}target.innerHTML=departments.map(d=>{const name=String(d.name||'Department'),staff=Number(d.employee_count||0);return `<article class="department-card"><div class="department-top"><div class="department-name"><div class="department-symbol">${escapeHtml(name.slice(0,2).toUpperCase())}</div><div><h3>${escapeHtml(name)}</h3><p>${staff} staff member${staff===1?'':'s'}</p></div></div><button class="btn btn-outline btn-sm" type="button" onclick="deleteDepartment(${d.id})">Delete</button></div><div class="department-meta"><div><span>Manager</span><strong>${escapeHtml(d.manager_name||'Not assigned')}</strong></div><div><span>Team size</span><strong>${staff} member${staff===1?'':'s'}</strong></div></div><div class="department-footer"><span>Manage assignments from Employees.</span><a class="btn btn-outline btn-sm" href="employees.html">View staff</a></div></article>`}).join('')}
async function addDepartment(e){e.preventDefault();const input=document.getElementById('department-name');try{await api.post('/employees/departments',{name:input.value.trim()});input.value='';toast('Department added','success');await loadDepartments()}catch(error){toast(error.message||'Could not add department','error')}}
function deleteDepartment(id){const d=departments.find(x=>Number(x.id)===Number(id));if(!d)return;const staff=Number(d.employee_count||0),overlay=document.createElement('div');overlay.className='modal-overlay';overlay.innerHTML=`<div class="modal department-delete-dialog" role="dialog" aria-modal="true"><div class="department-delete-icon">!</div><h3>Delete ${escapeHtml(d.name)}?</h3><p>This permanently removes the department from KenadHR.</p>${staff?`<div class="department-delete-impact"><strong>${staff} staff member${staff===1?'':'s'} will become unassigned.</strong><br>Reassign them from the Employees page afterwards.</div>`:'<div class="department-delete-impact">There are no staff members assigned to this department.</div>'}<div class="department-delete-actions"><button class="btn btn-outline" type="button" data-cancel>Keep Department</button><button class="btn btn-danger" type="button" data-confirm>Delete Department</button></div></div>`;document.body.appendChild(overlay);overlay.querySelector('[data-cancel]').onclick=()=>overlay.remove();overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});overlay.querySelector('[data-confirm]').onclick=async()=>{const button=overlay.querySelector('[data-confirm]');button.disabled=true;button.textContent='Deleting...';try{await api.delete(`/employees/departments/${id}`);overlay.remove();toast('Department deleted','success');await loadDepartments()}catch(error){button.disabled=false;button.textContent='Delete Department';toast(error.message||'Could not delete department','error')}}}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>

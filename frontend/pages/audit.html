<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit History - KenadHR</title><link rel="stylesheet" href="../css/main.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Audit History</div></header><main class="main-content"><div class="page-header"><div><h1>Audit History</h1><p>Review sensitive payroll and financial changes made in your company.</p></div></div><div class="table-container"><table><thead><tr><th>When</th><th>Action</th><th>Area</th><th>Record</th><th>Performed by</th></tr></thead><tbody id="audit-rows"><tr><td colspan="5"><div class="loading-state"><div class="spinner"></div></div></td></tr></tbody></table></div></main></div><script src="../js/api.js"></script><script>const user=requireAuth();if(!user)throw Error('redirect');if(user.role!=='admin')location.href=appUrl('/pages/dashboard.html');buildSidebar('audit');loadNotifCount();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const label=v=>({financial_transactions:'Financial transaction',payroll:'Payroll'}[v]||v);api.get('/audit').then(rows=>{document.getElementById('audit-rows').innerHTML=rows.length?rows.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString()}</td><td><span class="badge badge-info">${esc(r.action)}</span></td><td>${label(r.entity_type)}</td><td>${esc(r.summary)}</td><td>${esc(r.actor_name||'System')}</td></tr>`).join(''):'<tr><td colspan="5"><div class="empty-state"><p>No audited changes yet.</p></div></td></tr>'}).catch(e=>toast(e.message||'Could not load audit history','error'));</script></body></html>

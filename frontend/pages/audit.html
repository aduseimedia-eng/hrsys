<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit History - KenadHR</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .audit-intro { max-width:760px; color:var(--text-secondary); }
    .audit-table td { vertical-align:middle; }
    .audit-user { color:var(--text-primary); font-weight:700; }
    .audit-record { color:var(--text-secondary); }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <header class="topbar"><div class="topbar-title">Audit History</div></header>
  <main class="main-content">
    <div class="page-header"><div><h1>Audit History</h1><p class="audit-intro">Review important actions across your workspace, including changes to people records, approvals, payroll, finance, and settings.</p></div></div>
    <div class="table-container audit-table"><table><thead><tr><th>Date &amp; time</th><th>User</th><th>Action</th><th>Module</th><th>Record</th></tr></thead><tbody id="audit-rows"><tr><td colspan="5"><div class="loading-state"><div class="spinner"></div><span>Loading audit history...</span></div></td></tr></tbody></table></div>
  </main>
</div>
<script src="../js/api.js"></script>
<script>
const user=requireAuth();if(!user)throw Error('redirect');if(user.role!=='admin')location.href=appUrl('/pages/dashboard.html');buildSidebar('audit');loadNotifCount();
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const labels={financial_transactions:'Financials',payroll:'Payroll',employees:'Employees',leave:'Leave',disciplinary:'Discipline',settings:'Settings'};
const formatWhen=value=>value?new Intl.DateTimeFormat(undefined,{day:'2-digit',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(value)):'—';
api.get('/audit').then(rows=>{document.getElementById('audit-rows').innerHTML=rows.length?rows.map(row=>`<tr><td>${esc(formatWhen(row.created_at))}</td><td class="audit-user">${esc(row.actor_name||'System')}</td><td><span class="badge badge-info">${esc(row.action)}</span></td><td>${esc(labels[row.entity_type]||row.entity_type||'Workspace')}</td><td class="audit-record">${esc(row.summary||'—')}</td></tr>`).join(''):'<tr><td colspan="5"><div class="empty-state"><p>No audited changes yet.</p></div></td></tr>'}).catch(error=>toast(error.message||'Could not load audit history','error'));
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exit &amp; Clearance - KenadHR</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>.operations-modal{max-height:none;overflow:visible}.operations-modal .modal-body{overflow:visible}@media(max-width:640px){.operations-modal{max-height:90vh;overflow:hidden}.operations-modal .modal-body{overflow:auto}}</style>
</head>
<body>
<div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Exit &amp; Clearance</div><div class="topbar-actions" id="operations-actions"></div></header>
  <main class="main-content"><div class="page-header"><div><h1>Exit &amp; Clearance</h1><p>Maintain employee exit and clearance records.</p></div><div id="operations-page-action"></div></div>
    <div class="table-container"><table><thead><tr><th>Exit date</th><th>Employee</th><th>Department / supervisor</th><th>Clearance reference</th><th>Final clearance date</th><th>Status</th><th></th></tr></thead><tbody id="op-body"></tbody></table></div>
  </main>
</div>
<div id="op-modal" class="modal-overlay" style="display:none"><div class="modal modal-lg operations-modal" role="dialog" aria-modal="true" aria-labelledby="op-modal-title"><div class="modal-header"><h3 id="op-modal-title">Add exit &amp; clearance record</h3><button class="modal-close" type="button" onclick="closeEntry()" aria-label="Close exit and clearance form">&times;</button></div><div class="modal-body"><input id="op-id" type="hidden"><div class="form-grid"><div class="form-group"><label class="form-label required" for="op-date">Exit date</label><input id="op-date" type="date" class="form-control" required></div><div class="form-group"><label class="form-label required" for="op-title">Employee / staff member</label><input id="op-title" class="form-control" required></div><div class="form-group"><label class="form-label" for="op-contact">Department / supervisor</label><input id="op-contact" class="form-control"></div><div class="form-group"><label class="form-label" for="op-reference">Clearance reference</label><input id="op-reference" class="form-control"></div><div class="form-group"><label class="form-label" for="op-due">Final clearance date</label><input id="op-due" type="date" class="form-control"></div><div class="form-group"><label class="form-label" for="op-status">Clearance status</label><select id="op-status" class="form-control form-select"><option value="pending">Pending</option><option value="completed">Completed</option><option value="closed">Closed</option></select></div><div class="form-group span-2"><label class="form-label" for="op-notes">Notes</label><textarea id="op-notes" rows="3" class="form-control" placeholder="Outstanding items, handover notes, or approvals."></textarea></div></div></div><div class="modal-footer"><button class="btn btn-outline" type="button" onclick="closeEntry()">Cancel</button><button class="btn btn-primary" id="save-operation-btn" type="button" onclick="saveEntry()">Save clearance record</button></div></div></div>
<script src="../js/api.js"></script><script>
const user=requireAuth();if(!user)throw Error('redirect');if(!['admin','manager'].includes(user.role))location.href=appUrl('/pages/dashboard.html');
const EXIT_REGISTER_TYPE='resignation_exit';let rows=[];buildSidebar('operations');loadNotifCount();
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));const dateValue=value=>value?String(value).slice(0,10):'';
function closeEntry(){document.getElementById('op-modal').style.display='none';window.dispatchEvent(new Event('hrconnect:request-page-height'))}
async function load(){rows=await api.get(`/operations?type=${EXIT_REGISTER_TYPE}`);render()}
function render(){document.getElementById('op-body').innerHTML=rows.length?rows.map(row=>`<tr><td>${fmt.date(row.entry_date)}</td><td><strong>${esc(row.title)}</strong>${row.notes?`<br><small>${esc(row.notes)}</small>`:''}</td><td>${esc(row.contact_name||'—')}</td><td>${esc(row.reference_no||'—')}</td><td>${row.due_date?fmt.date(row.due_date):'—'}</td><td>${fmt.statusBadge(row.status)}</td><td><button class="btn btn-outline btn-sm" type="button" onclick="openEntry(${row.id})">Edit</button></td></tr>`).join(''):'<tr><td colspan="7"><div class="empty-state"><p>No exit and clearance records yet.</p></div></td></tr>'}
function openEntry(id){const record=id?rows.find(row=>Number(row.id)===Number(id)):null;document.getElementById('op-modal-title').textContent=record?'Edit exit & clearance record':'Add exit & clearance record';document.getElementById('op-id').value=record?.id||'';document.getElementById('op-date').value=dateValue(record?.entry_date)||new Date().toISOString().slice(0,10);document.getElementById('op-title').value=record?.title||'';document.getElementById('op-contact').value=record?.contact_name||'';document.getElementById('op-reference').value=record?.reference_no||'';document.getElementById('op-due').value=dateValue(record?.due_date);document.getElementById('op-status').value=['pending','completed','closed'].includes(record?.status)?record.status:'pending';document.getElementById('op-notes').value=record?.notes||'';document.getElementById('op-modal').style.display='flex';window.dispatchEvent(new Event('hrconnect:request-page-height'))}
async function saveEntry(){const date=document.getElementById('op-date'),employee=document.getElementById('op-title');if(!date.value||!employee.value.trim()){toast('Exit date and employee are required','error');return}const button=document.getElementById('save-operation-btn');button.disabled=true;try{const id=document.getElementById('op-id').value,body={register_type:EXIT_REGISTER_TYPE,entry_date:date.value,title:employee.value.trim(),contact_name:document.getElementById('op-contact').value,reference_no:document.getElementById('op-reference').value,amount:'',due_date:document.getElementById('op-due').value,status:document.getElementById('op-status').value,notes:document.getElementById('op-notes').value};if(id)await api.put(`/operations/${id}`,body);else await api.post('/operations',body);closeEntry();toast('Exit and clearance record saved','success');await load()}catch(error){toast(error.message||'Could not save exit and clearance record','error')}finally{button.disabled=false}}
const addButton='<button class="btn btn-primary" type="button" onclick="openEntry()">Add exit &amp; clearance</button>';document.getElementById('operations-actions').innerHTML=addButton;document.getElementById('operations-page-action').innerHTML=addButton;document.getElementById('op-modal').addEventListener('click',event=>{if(event.target===event.currentTarget)closeEntry()});load().catch(error=>toast(error.message||'Could not load exit and clearance records','error'));
</script></body></html>

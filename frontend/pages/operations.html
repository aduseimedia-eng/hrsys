<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations Registers - KenadHR</title><link rel="stylesheet" href="../css/main.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Operations Registers</div><div class="topbar-actions" id="operations-actions"></div></header><main class="main-content"><div class="page-header"><div><h1 id="operations-title">Operations Registers</h1><p id="operations-intro">Maintain office, finance, facilities, vehicle, and exit records.</p></div><div id="operations-page-action"></div></div><div class="filters-bar"><div class="form-group" style="min-width:280px"><label class="form-label">Register</label><select id="op-type" class="form-control form-select" onchange="load()"></select></div></div><div class="table-container"><table><thead><tr><th>Date</th><th>Record details</th><th id="op-contact-head">Contact / person</th><th>Reference</th><th>Amount</th><th>Due / next date</th><th>Status</th><th></th></tr></thead><tbody id="op-body"></tbody></table></div></main></div><div id="op-modal" class="modal-overlay" style="display:none"><div class="modal modal-lg"><div class="modal-header"><h3 id="op-modal-title">Add Record</h3><button class="modal-close" onclick="closeEntry()">x</button></div><div class="modal-body"><input id="op-id" type="hidden"><div class="form-grid"><div class="form-group"><label class="form-label required">Record date</label><input id="op-date" type="date" class="form-control"></div><div class="form-group"><label class="form-label required" id="op-title-label">Record details</label><input id="op-title" class="form-control"></div><div class="form-group"><label class="form-label" id="op-contact-label">Contact / person</label><input id="op-contact" class="form-control"></div><div class="form-group"><label class="form-label" id="op-reference-label">Reference / account no.</label><input id="op-reference" class="form-control"></div><div class="form-group" id="op-amount-group"><label class="form-label">Amount (GHS)</label><input id="op-amount" type="number" min="0" step="0.01" class="form-control"></div><div class="form-group"><label class="form-label" id="op-due-label">Due / next date</label><input id="op-due" type="date" class="form-control"></div><div class="form-group"><label class="form-label">Status</label><select id="op-status" class="form-control form-select"><option value="open">Open</option><option value="pending">Pending</option><option value="paid">Paid</option><option value="active">Active</option><option value="completed">Completed</option><option value="closed">Closed</option></select></div><div class="form-group span-2"><label class="form-label">Notes</label><textarea id="op-notes" rows="3" class="form-control"></textarea></div></div></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeEntry()">Cancel</button><button class="btn btn-primary" onclick="saveEntry()">Save Record</button></div></div></div><script src="../js/api.js"></script><script>const user=requireAuth();if(!user)throw Error('redirect');if(!['admin','manager'].includes(user.role))location.href=appUrl('/pages/dashboard.html');const config={resignation_exit:['Resignation & Exit Clearance Register','Employee / staff member','Resignation date','Last working day','Clearance status'],quarterly_rent:['Quarterly Rent Register','Property / premises','Landlord / agent','Rent period / reference','Next rent due date'],ecg_bill:['ECG Bill Tracker','Bill period','Account number','Meter number','Payment due date'],ghana_water_bill:['Ghana Water Bill Tracker','Bill period','Account number','Meter number','Payment due date'],internet_telephone:['Internet & Telephone Bills','Service / bill period','Provider','Account number','Payment due date'],petty_cash:['Petty Cash Register','Expense details','Paid to / requested by','Voucher number','Reconciliation date'],office_expense:['Office Expense Register','Expense details','Supplier / payee','Receipt / invoice no.','Payment date'],asset:['Asset Register','Asset name / description','Custodian / assigned to','Asset tag / serial no.','Next service date'],visitor:['Visitor Register','Visitor name / purpose','Host / staff member','ID / company','Expected exit date'],service_provider:['Service Provider Register','Service provider / service','Contact person','Contract / account no.','Renewal date'],contract:['Contract Register','Contract title / service','Supplier / counterparty','Contract reference','Expiry / renewal date'],vehicle_fuel:['Vehicle Fuel Log','Vehicle / fuel details','Driver','Fuel receipt / vehicle no.','Next service date'],vehicle_maintenance:['Vehicle Maintenance Log','Vehicle / maintenance work','Service provider','Vehicle / job card no.','Next service date'],office_maintenance:['Office Maintenance Log','Maintenance work / location','Service provider','Work order / reference','Next service date']};let rows=[];buildSidebar('operations');loadNotifCount();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function type(){return document.getElementById('op-type').value}function cfg(){return config[type()]}function closeEntry(){document.getElementById('op-modal').style.display='none'}function setLabels(){const c=cfg();document.getElementById('operations-title').textContent=c[0];document.getElementById('operations-intro').textContent='Record and track '+c[0].toLowerCase()+'.';document.getElementById('op-title-label').textContent=c[1];document.getElementById('op-contact-label').textContent=c[2];document.getElementById('op-reference-label').textContent=c[3];document.getElementById('op-due-label').textContent=c[4];document.getElementById('op-contact-head').textContent=c[2]}async function load(){setLabels();rows=await api.get('/operations?type='+encodeURIComponent(type()));render()}function render(){document.getElementById('op-body').innerHTML=rows.length?rows.map(r=>`<tr><td>${fmt.date(r.entry_date)}</td><td><strong>${esc(r.title)}</strong>${r.notes?`<br><small>${esc(r.notes)}</small>`:''}</td><td>${esc(r.contact_name||'—')}</td><td>${esc(r.reference_no||'—')}</td><td>${r.amount===null||r.amount===undefined?'—':fmt.currency(r.amount)}</td><td>${r.due_date?fmt.date(r.due_date):'—'}</td><td>${fmt.statusBadge(r.status)}</td><td><button class="btn btn-outline btn-sm" onclick="openEntry(${r.id})">Edit</button></td></tr>`).join(''):`<tr><td colspan="8"><div class="empty-state"><p>No records in this register yet.</p></div></td></tr>`}function openEntry(id){const r=id?rows.find(x=>x.id===id):null;document.getElementById('op-modal-title').textContent=r?'Edit '+cfg()[0]:'Add '+cfg()[0];document.getElementById('op-id').value=r?.id||'';document.getElementById('op-date').value=r?.entry_date||new Date().toISOString().slice(0,10);document.getElementById('op-title').value=r?.title||'';document.getElementById('op-contact').value=r?.contact_name||'';document.getElementById('op-reference').value=r?.reference_no||'';document.getElementById('op-amount').value=r?.amount??'';document.getElementById('op-due').value=r?.due_date||'';document.getElementById('op-status').value=r?.status||'open';document.getElementById('op-notes').value=r?.notes||'';document.getElementById('op-modal').style.display='flex'}async function saveEntry(){try{const id=document.getElementById('op-id').value,body={register_type:type(),entry_date:document.getElementById('op-date').value,title:document.getElementById('op-title').value,contact_name:document.getElementById('op-contact').value,reference_no:document.getElementById('op-reference').value,amount:document.getElementById('op-amount').value,due_date:document.getElementById('op-due').value,status:document.getElementById('op-status').value,notes:document.getElementById('op-notes').value};if(id)await api.put('/operations/'+id,body);else await api.post('/operations',body);closeEntry();toast('Register record saved','success');load()}catch(e){toast(e.message,'error')}}document.getElementById('op-type').innerHTML=Object.entries(config).map(([key,value])=>`<option value="${key}">${value[0]}</option>`).join('');const add='<button class="btn btn-primary" onclick="openEntry()">Add Record</button>';document.getElementById('operations-actions').innerHTML=add;document.getElementById('operations-page-action').innerHTML=add;load().catch(e=>toast(e.message,'error'));</script></body></html>

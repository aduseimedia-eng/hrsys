<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Operations Registers - KenadHR</title><link rel="stylesheet" href="../css/main.css" /><style>.operations-modal{max-height:none;overflow:visible}.operations-modal .modal-body{overflow:visible}@media(max-width:640px){.operations-modal{max-height:90vh;overflow:hidden}.operations-modal .modal-body{overflow:auto}}</style></head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Operations Registers</div><div class="topbar-actions" id="operations-actions"></div></header><main class="main-content"><div class="page-header"><div><h1 id="operations-title">Operations Registers</h1><p id="operations-intro">Maintain office, finance, facilities, vehicle, and exit records.</p></div><div id="operations-page-action"></div></div><div class="filters-bar"><div class="form-group" style="min-width:280px"><label class="form-label" for="op-type">Register</label><select id="op-type" class="form-control form-select"></select></div></div><div class="table-container"><table><thead><tr><th>Date</th><th>Record details</th><th id="op-contact-head">Contact / person</th><th>Reference</th><th>Amount</th><th>Due / next date</th><th>Status</th><th></th></tr></thead><tbody id="op-body"></tbody></table></div></main></div>
<div id="op-modal" class="modal-overlay" style="display:none"><div class="modal modal-lg operations-modal" role="dialog" aria-modal="true" aria-labelledby="op-modal-title"><div class="modal-header"><h3 id="op-modal-title">Add record</h3><button class="modal-close" type="button" onclick="closeEntry()" aria-label="Close record form">&times;</button></div><div class="modal-body"><input id="op-id" type="hidden" /><div class="form-grid"><div class="form-group"><label class="form-label required" for="op-date">Record date</label><input id="op-date" type="date" class="form-control" required /></div><div class="form-group"><label class="form-label required" id="op-title-label" for="op-title">Record details</label><input id="op-title" class="form-control" required /></div><div class="form-group"><label class="form-label" id="op-contact-label" for="op-contact">Contact / person</label><input id="op-contact" class="form-control" /></div><div class="form-group"><label class="form-label" id="op-reference-label" for="op-reference">Reference / account no.</label><input id="op-reference" class="form-control" /></div><div class="form-group" id="op-amount-group"><label class="form-label" data-currency-label="Amount" for="op-amount">Amount</label><input id="op-amount" type="number" min="0" step="0.01" data-currency-input class="form-control" /></div><div class="form-group"><label class="form-label" id="op-due-label" for="op-due">Due / next date</label><input id="op-due" type="date" class="form-control" /></div><div class="form-group"><label class="form-label" for="op-status">Status</label><select id="op-status" class="form-control form-select"><option value="open">Open</option><option value="pending">Pending</option><option value="paid">Paid</option><option value="active">Active</option><option value="completed">Completed</option><option value="closed">Closed</option></select></div><div class="form-group span-2"><label class="form-label" for="op-notes">Notes</label><textarea id="op-notes" rows="3" class="form-control"></textarea></div></div></div><div class="modal-footer"><button class="btn btn-outline" type="button" onclick="closeEntry()">Cancel</button><button class="btn btn-primary" id="save-operation-btn" type="button" onclick="saveEntry()">Save record</button></div></div></div>
<script src="../js/api.js"></script><script>
const user=requireAuth();if(!user)throw Error('redirect');if(!['admin','manager'].includes(user.role))location.href=appUrl('/pages/dashboard.html');const config={resignation_exit:['Resignation & Exit Clearance Register','Employee / staff member','Resignation date','Last working day','Clearance status'],quarterly_rent:['Quarterly Rent Register','Property / premises','Landlord / agent','Rent period / reference','Next rent due date'],ecg_bill:['ECG Bill Tracker','Bill period','Account number','Meter number','Payment due date'],ghana_water_bill:['Ghana Water Bill Tracker','Bill period','Account number','Meter number','Payment due date'],internet_telephone:['Internet & Telephone Bills','Service / bill period','Provider','Account number','Payment due date'],petty_cash:['Petty Cash Register','Expense details','Paid to / requested by','Voucher number','Reconciliation date'],office_expense:['Office Expense Register','Expense details','Supplier / payee','Receipt / invoice no.','Payment date'],asset:['Asset Register','Asset name / description','Custodian / assigned to','Asset tag / serial no.','Next service date'],visitor:['Visitor Register','Visitor name / purpose','Host / staff member','ID / company','Expected exit date'],service_provider:['Service Provider Register','Service provider / service','Contact person','Contract / account no.','Renewal date'],contract:['Contract Register','Contract title / service','Supplier / counterparty','Contract reference','Expiry / renewal date'],vehicle_fuel:['Vehicle Fuel Log','Vehicle / fuel details','Driver','Fuel receipt / vehicle no.','Next service date'],vehicle_maintenance:['Vehicle Maintenance Log','Vehicle / maintenance work','Service provider','Vehicle / job card no.','Next service date'],office_maintenance:['Office Maintenance Log','Maintenance work / location','Service provider','Work order / reference','Next service date']};let rows=[];buildSidebar('operations');loadNotifCount();const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));const dateValue=value=>value?String(value).slice(0,10):'';function type(){return document.getElementById('op-type').value}function cfg(){return config[type()]}function closeEntry(){document.getElementById('op-modal').style.display='none';window.dispatchEvent(new Event('hrconnect:request-page-height'))}function setLabels(){const current=cfg();document.getElementById('operations-title').textContent=current[0];document.getElementById('operations-intro').textContent='Record and track '+current[0].toLowerCase()+'.';document.getElementById('op-title-label').textContent=current[1];document.getElementById('op-contact-label').textContent=current[2];document.getElementById('op-reference-label').textContent=current[3];document.getElementById('op-due-label').textContent=current[4];document.getElementById('op-contact-head').textContent=current[2]}
async function load(){setLabels();rows=await api.get('/operations?type='+encodeURIComponent(type()));render()}function render(){document.getElementById('op-body').innerHTML=rows.length?rows.map(row=>`<tr><td>${fmt.date(row.entry_date)}</td><td><strong>${esc(row.title)}</strong>${row.notes?`<br><small>${esc(row.notes)}</small>`:''}</td><td>${esc(row.contact_name||'—')}</td><td>${esc(row.reference_no||'—')}</td><td>${row.amount===null||row.amount===undefined?'—':fmt.currency(row.amount)}</td><td>${row.due_date?fmt.date(row.due_date):'—'}</td><td>${fmt.statusBadge(row.status)}</td><td><button class="btn btn-outline btn-sm" type="button" onclick="openEntry(${row.id})">Edit</button></td></tr>`).join(''):'<tr><td colspan="8"><div class="empty-state"><p>No records in this register yet.</p></div></td></tr>'}function openEntry(id){const record=id?rows.find(row=>Number(row.id)===Number(id)):null;document.getElementById('op-modal-title').textContent=record?'Edit '+cfg()[0]:'Add '+cfg()[0];document.getElementById('op-id').value=record?.id||'';document.getElementById('op-date').value=dateValue(record?.entry_date)||new Date().toISOString().slice(0,10);document.getElementById('op-title').value=record?.title||'';document.getElementById('op-contact').value=record?.contact_name||'';document.getElementById('op-reference').value=record?.reference_no||'';document.getElementById('op-amount').value=record?.amount??'';document.getElementById('op-due').value=dateValue(record?.due_date);document.getElementById('op-status').value=record?.status||'open';document.getElementById('op-notes').value=record?.notes||'';document.getElementById('op-modal').style.display='flex';window.dispatchEvent(new Event('hrconnect:request-page-height'))}
async function saveEntry(){const date=document.getElementById('op-date'),title=document.getElementById('op-title'),amount=document.getElementById('op-amount');if(!date.value||!title.value.trim()){toast('Record date and details are required','error');return}if(amount.value&&(!Number.isFinite(Number(amount.value))||Number(amount.value)<0)){toast('Amount must be a valid non-negative number','error');amount.focus();return}const button=document.getElementById('save-operation-btn');button.disabled=true;try{const id=document.getElementById('op-id').value,body={register_type:type(),entry_date:date.value,title:title.value.trim(),contact_name:document.getElementById('op-contact').value,reference_no:document.getElementById('op-reference').value,amount:amount.value,due_date:document.getElementById('op-due').value,status:document.getElementById('op-status').value,notes:document.getElementById('op-notes').value};if(id)await api.put('/operations/'+id,body);else await api.post('/operations',body);closeEntry();toast('Register record saved','success');load()}catch(error){toast(error.message||'Could not save register record','error')}finally{button.disabled=false}}
document.getElementById('op-type').innerHTML=Object.entries(config).map(([key,value])=>`<option value="${key}">${value[0]}</option>`).join('');document.getElementById('op-type').addEventListener('change',()=>load().catch(error=>toast(error.message||'Could not load register records','error')));const addButton='<button class="btn btn-primary" type="button" onclick="openEntry()">Add record</button>';document.getElementById('operations-actions').innerHTML=addButton;document.getElementById('operations-page-action').innerHTML=addButton;document.getElementById('op-modal').addEventListener('click',event=>{if(event.target===event.currentTarget)closeEntry()});load().catch(error=>toast(error.message||'Could not load register records','error'));
</script></body></html>

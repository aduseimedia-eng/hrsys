<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Management — KenadHR</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/workspace.css">
  <style>
    .leave-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .leave-type-card {
      background: var(--bg-surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      text-align: center;
    }
    .leave-type-card .days { font-family: var(--font-display); font-size: 2rem; font-weight: 700; color: var(--navy-800); }
    .leave-type-card .label { font-size: .8rem; color: var(--text-muted); margin-top: 2px; }

    .leave-person-button {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text-primary);
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .leave-person-button:hover span { color: var(--navy-800); text-decoration: underline; }
    .leave-balance-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 68px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--mint-100);
      color: var(--navy-950);
      font-size: .74rem;
      font-weight: 800;
    }
    .leave-balance-pill.low {
      background: var(--amber-100);
      color: #92400e;
    }
    .leave-balance-pill.empty {
      background: var(--rose-100);
      color: var(--rose-600);
    }
    .leave-balance-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .leave-balance-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-page);
      padding: 12px;
    }
    .leave-balance-card span {
      display: block;
      color: var(--text-muted);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .leave-balance-card strong {
      display: block;
      color: var(--text-primary);
      font-size: 1.35rem;
      margin-top: 4px;
    }
    .leave-request-detail {
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
      color: var(--text-secondary);
      font-size: .88rem;
      line-height: 1.55;
    }
    @media (max-width: 720px) {
      .leave-balance-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <header class="topbar">
    <div class="topbar-title">Leave Management</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="notif-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="dot hidden" id="notif-badge"></span>
      </button>
    </div>
  </header>
  <main class="main-content">
    <div class="page-header">
      <div><h1 id="leave-page-title">Leave Management</h1><p id="leave-page-subtitle">Request, track, and manage leave</p></div>
      <button class="btn btn-primary" onclick="showRequestModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Request Leave
      </button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('my')">My Leave</button>
      <button class="tab-btn" id="hr-tab" style="display:none" onclick="switchTab('all')">All Requests</button>
    </div>

    <!-- My Leave -->
    <div id="tab-my">
      <div class="table-container">
        <table>
          <thead><tr><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th><th>Applied</th></tr></thead>
          <tbody id="my-leave-tbody"><tr><td colspan="7"><div class="loading-state"><div class="spinner"></div></div></td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- All requests (HR) -->
    <div id="tab-all" style="display:none">
      <div id="selected-employee-context" class="card" style="display:none;margin-bottom:16px">
        <div class="card-body" style="padding:14px 16px">
          <strong id="selected-employee-name"></strong>
          <span style="color:var(--text-secondary);font-size:.86rem"> — leave history</span>
        </div>
      </div>
      <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">
        <select id="hr-status-filter" class="form-control form-select" style="max-width:160px" onchange="loadAllLeaves()">
          <option value="">All Status</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div class="table-container">
        <table>
          <thead><tr><th>Employee</th><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Leave Left</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="all-leave-tbody"><tr><td colspan="8"><div class="loading-state"><div class="spinner"></div></div></td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Request Leave Modal -->
<div id="req-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <h3>Request Leave</h3>
      <button class="modal-close" onclick="document.getElementById('req-modal').style.display='none'">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label required">Leave Type</label>
        <select id="req-type" class="form-control form-select">
          <option value="annual">Annual Leave</option>
          <option value="sick">Sick Leave</option>
          <option value="maternity">Maternity Leave</option>
          <option value="paternity">Paternity Leave</option>
          <option value="unpaid">Unpaid Leave</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label required">Start Date</label>
          <input type="date" id="req-start" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label required">End Date</label>
          <input type="date" id="req-end" class="form-control">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Reason</label>
        <textarea id="req-reason" class="form-control" rows="3" placeholder="Optional: briefly describe the reason"></textarea>
      </div>
      <div id="req-days-preview" style="font-size:.875rem;color:var(--text-muted)"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="document.getElementById('req-modal').style.display='none'">Cancel</button>
      <button class="btn btn-primary" onclick="submitRequest()">Submit Request</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
const user = requireAuth();
if (!user) throw new Error('redirect');
buildSidebar('leave');
loadNotifCount();

if (['admin','manager'].includes(user.role)) {
  document.getElementById('hr-tab').style.display = '';
}

let hrLeaveRows = [];
const selectedEmployeeId = new URLSearchParams(window.location.search).get('employee_id');
const selectedEmployeeName = new URLSearchParams(window.location.search).get('employee_name');

if (selectedEmployeeId && selectedEmployeeName) {
  document.getElementById('leave-page-title').textContent = 'Staff Leave History';
  document.getElementById('leave-page-subtitle').textContent = `Viewing leave requests for ${selectedEmployeeName}`;
  document.getElementById('selected-employee-name').textContent = selectedEmployeeName;
  document.getElementById('selected-employee-context').style.display = '';
  document.getElementById('hr-tab').textContent = 'Staff History';
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}

function typeLabel(value) {
  return String(value || '').replace(/[_-]/g, ' ').replace(/\b\w/g, (letter) => letter.toUpperCase());
}

const LEAVE_DAY_MS = 86400000;
const DEFAULT_LEAVE_WORKING_DAYS = Object.freeze([1, 2, 3, 4, 5]);
const LEAVE_WEEKDAY_NAMES = Object.freeze(['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']);

function leaveDateOnly(value) {
  const match = String(value || '').match(/^(\d{4}-\d{2}-\d{2})/);
  return match ? match[1] : '';
}

function calendarLeaveDays(startDate, endDate) {
  const start = leaveDateOnly(startDate);
  const end = leaveDateOnly(endDate);
  if (!start || !end || end < start) return 0;
  return Math.floor((Date.parse(`${end}T00:00:00.000Z`) - Date.parse(`${start}T00:00:00.000Z`)) / LEAVE_DAY_MS) + 1;
}

function leaveDayPolicy(balance = {}) {
  const selectedWorkingDays = new Set(Array.isArray(balance.working_days)
    ? balance.working_days.map(Number).filter((day) => Number.isInteger(day) && day >= 0 && day <= 6)
    : []);
  const configuredWorkingDays = [1, 2, 3, 4, 5, 6, 0].filter((day) => selectedWorkingDays.has(day));
  return {
    working_days: configuredWorkingDays.length ? configuredWorkingDays : [...DEFAULT_LEAVE_WORKING_DAYS],
    count_non_working_days: (balance.count_non_working_days ?? balance.count_weekends) !== false,
    count_public_holidays: balance.count_public_holidays !== false
  };
}

function chargeableLeaveDays(startDate, endDate, leaveType, policy, companyEvents = []) {
  const start = leaveDateOnly(startDate);
  const end = leaveDateOnly(endDate);
  const duration = calendarLeaveDays(start, end);
  if (!duration || leaveType !== 'annual') return duration;

  const holidayRanges = policy.count_public_holidays ? [] : companyEvents
    .filter((event) => event.category === 'holiday')
    .map((event) => [leaveDateOnly(event.start_date), leaveDateOnly(event.end_date)])
    .filter(([holidayStart, holidayEnd]) => holidayStart && holidayEnd);

  let total = 0;
  const startMs = Date.parse(`${start}T00:00:00.000Z`);
  for (let offset = 0; offset < duration; offset++) {
    const currentMs = startMs + (offset * LEAVE_DAY_MS);
    const current = new Date(currentMs);
    const date = current.toISOString().slice(0, 10);
    if (!policy.count_non_working_days && !policy.working_days.includes(current.getUTCDay())) continue;
    if (!policy.count_public_holidays
      && holidayRanges.some(([holidayStart, holidayEnd]) => date >= holidayStart && date <= holidayEnd)) continue;
    total++;
  }
  return total;
}

function leaveRowsDateRange(rows) {
  const dates = rows.flatMap((row) => [leaveDateOnly(row.start_date), leaveDateOnly(row.end_date)]).filter(Boolean);
  if (!dates.length) return null;
  dates.sort();
  return { from: dates[0], to: dates[dates.length - 1] };
}

async function loadLeaveDayContext(rows, year = new Date().getFullYear()) {
  const balance = await api.get(`/leave/balance?year=${year}`);
  const policy = leaveDayPolicy(balance);
  const range = leaveRowsDateRange(rows.filter((row) => row.leave_type === 'annual'));
  const companyEvents = !policy.count_public_holidays && range
    ? await api.get(`/company-calendar?from=${range.from}&to=${range.to}`)
    : [];
  return { balance, policy, companyEvents };
}

function availableAnnualLeave(row) {
  const entitlement = Number(row.annual_entitlement ?? 20);
  const used = Number(row.annual_used_days ?? 0);
  const pending = Number(row.annual_pending_days ?? 0);
  const approvedRemaining = Number(row.annual_remaining_days ?? Math.max(0, entitlement - used));
  return Math.max(0, approvedRemaining - pending);
}

function switchTab(tab) {
  ['my','all'].forEach(t => {
    document.getElementById(`tab-${t}`).style.display = t === tab ? '' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach((button) => button.classList.remove('active'));
  document.querySelector(tab === 'my' ? '.tab-btn' : '#hr-tab')?.classList.add('active');
  if (tab === 'all') loadAllLeaves();
}

// My leave history
async function loadMyLeaves() {
  const rows = await api.get('/leave/mine');
  const tbody = document.getElementById('my-leave-tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><p>No leave requests yet</p></div></td></tr>`;
    return;
  }
  const { policy, companyEvents } = await loadLeaveDayContext(rows);
  tbody.innerHTML = rows.map(r => {
    const days = chargeableLeaveDays(r.start_date, r.end_date, r.leave_type, policy, companyEvents);
    return `<tr>
      <td><span class="badge badge-info">${r.leave_type}</span></td>
      <td>${fmt.date(r.start_date)}</td>
      <td>${fmt.date(r.end_date)}</td>
      <td>${days}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.reason || '—'}</td>
      <td>${fmt.statusBadge(r.status)}</td>
      <td>${fmt.date(r.created_at)}</td>
    </tr>`;
  }).join('');
}

// All leave (HR)
async function loadAllLeaves() {
  const status = document.getElementById('hr-status-filter')?.value || '';
  const params = new URLSearchParams();
  if (status) params.set('status', status);
  if (selectedEmployeeId) params.set('employee_id', selectedEmployeeId);
  const qs = params.size ? `?${params.toString()}` : '';
  const rows = await api.get(`/leave${qs}`);
  const tbody = document.getElementById('all-leave-tbody');
  if (!rows.length) {
    hrLeaveRows = [];
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><p>No requests found</p></div></td></tr>`;
    return;
  }
  const { policy, companyEvents } = await loadLeaveDayContext(rows);
  hrLeaveRows = rows.map((row) => ({
    ...row,
    chargeable_days: chargeableLeaveDays(row.start_date, row.end_date, row.leave_type, policy, companyEvents)
  }));
  tbody.innerHTML = hrLeaveRows.map(r => {
    const days = r.chargeable_days;
    const available = availableAnnualLeave(r);
    const balanceClass = available <= 0 ? 'empty' : available <= 5 ? 'low' : '';
    const actions = r.status === 'pending' ? `
      <button class="btn btn-success btn-sm" onclick="updateLeave(${r.id},'approved')">Approve</button>
      <button class="btn btn-danger btn-sm" onclick="updateLeave(${r.id},'rejected')">Reject</button>
    ` : `<span class="text-muted text-sm">${r.approver_name ? `By ${r.approver_name}` : '--'}</span>`;
    return `<tr>
      <td><button class="leave-person-button" type="button" onclick="showLeaveBalance(${r.id})">${leaveEmployeeAvatar(r, 'sm')}<span>${r.employee_name}</span></button></td>
      <td><span class="badge badge-info">${r.leave_type}</span></td>
      <td>${fmt.date(r.start_date)}</td>
      <td>${fmt.date(r.end_date)}</td>
      <td>${days}</td>
      <td><button class="leave-balance-pill ${balanceClass}" type="button" onclick="showLeaveBalance(${r.id})">${available} left</button></td>
      <td>${fmt.statusBadge(r.status)}</td>
      <td style="display:flex;gap:6px">${actions}</td>
    </tr>`;
  }).join('');
}

function showLeaveBalance(id) {
  const row = hrLeaveRows.find((leave) => Number(leave.id) === Number(id));
  if (!row) return;

  const days = Number(row.chargeable_days ?? calendarLeaveDays(row.start_date, row.end_date));
  const entitlement = Number(row.annual_entitlement ?? 20);
  const used = Number(row.annual_used_days ?? 0);
  const pending = Number(row.annual_pending_days ?? 0);
  const available = availableAnnualLeave(row);

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <div style="display:flex;align-items:center;gap:10px">
          ${leaveEmployeeAvatar(row, 'sm')}
          <div>
          <h3>${escapeHtml(row.employee_name || 'Staff Leave')}</h3>
          <span style="display:block;color:var(--text-muted);font-size:.82rem;margin-top:3px">${escapeHtml(row.department_name || 'No department')}</span>
          </div>
        </div>
        <button class="modal-close" type="button" onclick="this.closest('.modal-overlay').remove()">x</button>
      </div>
      <div class="modal-body">
        <div class="leave-balance-grid">
          <div class="leave-balance-card"><span>Entitlement</span><strong>${entitlement}</strong></div>
          <div class="leave-balance-card"><span>Used</span><strong>${used}</strong></div>
          <div class="leave-balance-card"><span>Pending</span><strong>${pending}</strong></div>
          <div class="leave-balance-card"><span>Available</span><strong>${available}</strong></div>
        </div>
        <div class="leave-request-detail">
          <strong style="color:var(--text-primary)">Current request</strong><br>
          ${escapeHtml(typeLabel(row.leave_type))} leave, ${days} ${row.leave_type === 'annual' ? 'chargeable' : 'calendar'} day${days === 1 ? '' : 's'} from ${fmt.date(row.start_date)} to ${fmt.date(row.end_date)}.
          ${row.reason ? `<br><span>Reason: ${escapeHtml(row.reason)}</span>` : ''}
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" type="button" onclick="this.closest('.modal-overlay').remove()">Close</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function leaveEmployeeAvatar(row, size = 'sm') {
  const parts = String(row.employee_name || '').trim().split(/\s+/);
  return avatarEl({
    first_name: parts[0] || '?',
    last_name: parts.slice(1).join(' '),
    photo_url: row.photo_url || null
  }, size);
}
async function updateLeave(id, status) {
  try {
    await api.patch(`/leave/${id}/status`, { status });
    toast(`Leave ${status}`, 'success');
    loadAllLeaves();
  } catch(e) { toast(e.message, 'error'); }
}

// Calendar
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

async function renderCalendar() {
  const monthStart = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-01`;
  const monthEnd = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(new Date(calYear, calMonth + 1, 0).getDate()).padStart(2, '0')}`;
  const [leaves, holidayResult, companyEvents] = await Promise.all([
    api.get(`/leave/calendar?year=${calYear}&month=${calMonth + 1}`),
    api.get(`/leave/public-holidays?year=${calYear}`),
    api.get(`/company-calendar?from=${monthStart}&to=${monthEnd}`)
  ]);
  const holidayDates = Object.fromEntries((holidayResult.holidays || []).map(holiday => [holiday.date, holiday.name]));
  const companyEventDates = {};
  companyEvents.forEach(event => {
    for (let day = new Date(`${event.start_date}T00:00:00`), end = new Date(`${event.end_date}T00:00:00`); day <= end; day.setDate(day.getDate() + 1)) {
      const key = `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, '0')}-${String(day.getDate()).padStart(2, '0')}`;
      if (!companyEventDates[key]) companyEventDates[key] = [];
      companyEventDates[key].push(event.title);
    }
  });

  // Build set of leave dates
  const leaveDates = {};
  leaves.forEach(l => {
    let d = new Date(l.start_date);
    const end = new Date(l.end_date);
    while (d <= end) {
      const key = d.toISOString().split('T')[0];
      if (!leaveDates[key]) leaveDates[key] = [];
      leaveDates[key].push(l.employee_name);
      d.setDate(d.getDate() + 1);
    }
  });

  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-title').textContent = `${monthNames[calMonth]} ${calYear}`;

  const grid = document.getElementById('cal-grid');
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html = days.map(d => `<div class="cal-header">${d}</div>`).join('');

  const first = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today = new Date().toISOString().split('T')[0];

  // Empty cells before month starts
  for (let i = 0; i < first; i++) html += `<div class="cal-day other-month"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === today;
    const onLeave = leaveDates[dateStr];
    const holiday = holidayDates[dateStr];
    const companyEvent = companyEventDates[dateStr];
    const cls = `cal-day${isToday?' today':''}${holiday?' public-holiday':''}${companyEvent?' company-event':''}${onLeave?' on-leave':''}`;
    const title = [holiday, companyEvent?.join(', '), onLeave ? `${onLeave.join(', ')} on leave` : ''].filter(Boolean).join(' · ');
    html += `<div class="${cls}" ${title ? `title="${title}"` : ''}>${d}</div>`;
  }

  grid.innerHTML = html;

  // Legend
  const legend = document.getElementById('cal-legend');
  legend.innerHTML = `
    <div style="display:flex;align-items:center;gap:6px;font-size:.8rem">
      <div style="width:14px;height:14px;border-radius:3px;background:var(--navy-800)"></div> Today
    </div>
    <div style="display:flex;align-items:center;gap:6px;font-size:.8rem">
      <div style="width:14px;height:14px;border-radius:3px;background:var(--amber-100)"></div> On Leave
    </div>
    <div style="display:flex;align-items:center;gap:6px;font-size:.8rem">
      <div style="width:14px;height:14px;border-radius:3px;background:var(--mint-100)"></div> Public Holiday
    </div>
    <div style="display:flex;align-items:center;gap:6px;font-size:.8rem"><div style="width:14px;height:14px;border-radius:3px;background:var(--violet-100)"></div> Company Event</div>
  `;
}

function showCompanyEventModal() {
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('company-event-start').value = today;
  document.getElementById('company-event-end').value = today;
  document.getElementById('company-event-modal').style.display = 'flex';
}
function closeCompanyEventModal() { document.getElementById('company-event-modal').style.display = 'none'; }
async function saveCompanyEvent() {
  try {
    await api.post('/company-calendar', { title: document.getElementById('company-event-title').value, start_date: document.getElementById('company-event-start').value, end_date: document.getElementById('company-event-end').value, category: document.getElementById('company-event-category').value, description: document.getElementById('company-event-description').value });
    closeCompanyEventModal(); document.getElementById('company-event-title').value = ''; document.getElementById('company-event-description').value = '';
    await renderCalendar(); toast('Company event added', 'success');
  } catch (error) { toast(error.message || 'Could not save company event', 'error'); }
}

function prevMonth() {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
}
function nextMonth() {
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

function showRequestModal() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('req-start').value = today;
  document.getElementById('req-end').value = today;
  document.getElementById('req-modal').style.display = 'flex';
  updateRequestPreview();
}

let requestPreviewVersion = 0;

function leavePolicySummary(policy) {
  const parts = [];
  if (policy.count_non_working_days) {
    parts.push('Non-working days count');
  } else {
    const names = policy.working_days.map((day) => LEAVE_WEEKDAY_NAMES[day]).filter(Boolean);
    parts.push(`Only company working days count: ${names.join(', ')}`);
  }
  parts.push(policy.count_public_holidays ? 'Company holidays count' : 'Company holidays are excluded');
  return `${parts.join('. ')}.`;
}

async function updateRequestPreview() {
  const preview = document.getElementById('req-days-preview');
  const startDate = document.getElementById('req-start').value;
  const endDate = document.getElementById('req-end').value;
  const leaveType = document.getElementById('req-type').value;
  const version = ++requestPreviewVersion;

  if (!startDate || !endDate) {
    preview.textContent = '';
    return;
  }

  const calendarDays = calendarLeaveDays(startDate, endDate);
  if (!calendarDays) {
    preview.textContent = 'End date must be on or after the start date.';
    return;
  }
  if (leaveType !== 'annual') {
    preview.textContent = `Calendar duration: ${calendarDays} day${calendarDays === 1 ? '' : 's'}.`;
    return;
  }
  if (startDate.slice(0, 4) !== endDate.slice(0, 4)) {
    preview.textContent = 'Annual leave must fall within one calendar year.';
    return;
  }

  preview.textContent = 'Calculating chargeable leave days...';
  try {
    const year = Number(startDate.slice(0, 4));
    const { balance, policy, companyEvents } = await loadLeaveDayContext([
      { start_date: startDate, end_date: endDate, leave_type: 'annual' }
    ], year);
    if (version !== requestPreviewVersion) return;

    const chargeableDays = chargeableLeaveDays(startDate, endDate, leaveType, policy, companyEvents);
    const entitlement = Number(balance.entitlement ?? 0);
    const used = Number(balance.used ?? 0);
    const pending = Number(balance.pending ?? 0);
    const available = Math.max(0, entitlement - used - pending);
    const policySummary = leavePolicySummary(policy);

    if (!chargeableDays) {
      preview.textContent = `No chargeable annual leave days in this range. ${policySummary}`;
      return;
    }

    const balanceDifference = available - chargeableDays;
    const balanceSummary = balanceDifference >= 0
      ? `${balanceDifference} day${balanceDifference === 1 ? '' : 's'} left after this request.`
      : `This exceeds your available balance by ${Math.abs(balanceDifference)} day${balanceDifference === -1 ? '' : 's'}.`;
    preview.textContent = `Chargeable annual leave: ${chargeableDays} day${chargeableDays === 1 ? '' : 's'}. ${available} day${available === 1 ? '' : 's'} available before this request; ${balanceSummary} ${policySummary}`;
  } catch (error) {
    if (version !== requestPreviewVersion) return;
    preview.textContent = error.message || 'Could not calculate chargeable leave days.';
  }
}

['req-type', 'req-start', 'req-end'].forEach((id) => {
  document.getElementById(id).addEventListener('change', updateRequestPreview);
});

async function submitRequest() {
  try {
    await api.post('/leave', {
      leave_type: document.getElementById('req-type').value,
      start_date: document.getElementById('req-start').value,
      end_date:   document.getElementById('req-end').value,
      reason:     document.getElementById('req-reason').value,
    });
    document.getElementById('req-modal').style.display = 'none';
    toast('Leave request submitted!', 'success');
    await loadMyLeaves();
  } catch(e) { toast(e.message, 'error'); }
}

if (selectedEmployeeId && ['admin', 'manager'].includes(user.role)) {
  switchTab('all');
} else {
  loadMyLeaves();
}
</script>

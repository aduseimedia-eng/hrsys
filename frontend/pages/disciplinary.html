<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disciplinary Register - KenadHR</title><link rel="stylesheet" href="../css/main.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Disciplinary Register</div><div class="topbar-actions" id="disciplinary-actions"></div></header><main class="main-content"><div class="page-header"><div><h1>Disciplinary Register</h1><p>Confidential record of employee conduct cases, actions, and follow-ups.</p></div><div id="disciplinary-page-action"></div></div><div class="table-container"><table><thead><tr><th>Employee</th><th>Case date</th><th>Category</th><th>Action taken</th><th>Follow-up</th><th>Status</th><th></th></tr></thead><tbody id="disciplinary-body"></tbody></table></div></main></div><div id="disciplinary-modal" class="modal-overlay" style="display:none"><div class="modal modal-lg"><div class="modal-header"><h3 id="disciplinary-modal-title">Add Disciplinary Case</h3><button class="modal-close" onclick="closeCase()">x</button></div><div class="modal-body"><input type="hidden" id="dc-id"><div class="form-grid"><div class="form-group"><label class="form-label required">Employee</label><select id="dc-employee" class="form-control form-select"></select></div><div class="form-group"><label class="form-label required">Case date</label><input id="dc-date" type="date" class="form-control"></div><div class="form-group"><label class="form-label required">Category</label><select id="dc-category" class="form-control form-select"><option value="Misconduct">Misconduct</option><option value="Attendance">Attendance</option><option value="Performance">Performance</option><option value="Conduct">Conduct</option><option value="Policy breach">Policy breach</option><option value="Other">Other</option></select></div><div class="form-group"><label class="form-label required">Action taken</label><input id="dc-action" class="form-control" placeholder="e.g. Written warning"></div><div class="form-group"><label class="form-label">Status</label><select id="dc-status" class="form-control form-select"><option value="open">Open</option><option value="under_review">Under review</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select></div><div class="form-group"><label class="form-label">Follow-up date</label><input id="dc-followup" type="date" class="form-control"></div><div class="form-group span-2"><label class="form-label required">Incident summary</label><textarea id="dc-summary" rows="4" class="form-control" placeholder="Record the facts of the incident."></textarea></div><div class="form-group span-2"><label class="form-label">Outcome / follow-up notes</label><textarea id="dc-notes" rows="3" class="form-control"></textarea></div></div></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeCase()">Cancel</button><button class="btn btn-primary" onclick="saveCase()">Save Case</button></div></div></div><script src="../js/api.js"></script><script>const user=requireAuth();if(!user)throw Error('redirect');if(!['admin','manager'].includes(user.role)){location.href=appUrl('/pages/dashboard.html')}let rows=[],employees=[];buildSidebar('disciplinary');loadNotifCount();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function closeCase(){document.getElementById('disciplinary-modal').style.display='none'}async function load(){[rows,employees]=await Promise.all([api.get('/disciplinary'),api.get('/employees?limit=1000')]);employees=employees.employees;render()}function render(){document.getElementById('disciplinary-body').innerHTML=rows.length?rows.map(r=>`<tr><td><strong>${esc(r.employee_name)}</strong><br><small>${esc(r.employee_code||'')} · ${esc(r.job_title||'')}</small></td><td>${fmt.date(r.case_date)}</td><td>${esc(r.category)}</td><td>${esc(r.action_taken)}</td><td>${r.follow_up_date?fmt.date(r.follow_up_date):'—'}</td><td>${fmt.statusBadge(r.status)}</td><td><button class="btn btn-outline btn-sm" onclick="openCase(${r.id})">View / Edit</button></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty-state"><p>No disciplinary cases recorded.</p></div></td></tr>`}function openCase(id){const r=id?rows.find(x=>x.id===id):null;document.getElementById('disciplinary-modal-title').textContent=r?'Edit Disciplinary Case':'Add Disciplinary Case';document.getElementById('dc-id').value=r?.id||'';document.getElementById('dc-employee').innerHTML=employees.map(e=>`<option value="${e.id}" ${Number(r?.employee_id)===Number(e.id)?'selected':''}>${esc(e.first_name+' '+e.last_name)}</option>`).join('');document.getElementById('dc-date').value=r?.case_date||new Date().toISOString().slice(0,10);document.getElementById('dc-category').value=r?.category||'Misconduct';document.getElementById('dc-action').value=r?.action_taken||'';document.getElementById('dc-status').value=r?.status||'open';document.getElementById('dc-followup').value=r?.follow_up_date||'';document.getElementById('dc-summary').value=r?.incident_summary||'';document.getElementById('dc-notes').value=r?.outcome_notes||'';document.getElementById('disciplinary-modal').style.display='flex'}async function saveCase(){try{const id=document.getElementById('dc-id').value,body={employee_id:Number(document.getElementById('dc-employee').value),case_date:document.getElementById('dc-date').value,category:document.getElementById('dc-category').value,incident_summary:document.getElementById('dc-summary').value,action_taken:document.getElementById('dc-action').value,status:document.getElementById('dc-status').value,follow_up_date:document.getElementById('dc-followup').value,outcome_notes:document.getElementById('dc-notes').value};if(id)await api.put(`/disciplinary/${id}`,body);else await api.post('/disciplinary',body);closeCase();toast('Disciplinary case saved','success');load()}catch(e){toast(e.message,'error')}}const addButton='<button class="btn btn-primary" onclick="openCase()">Add Case</button>';document.getElementById('disciplinary-actions').innerHTML=addButton;document.getElementById('disciplinary-page-action').innerHTML=addButton;load().catch(e=>toast(e.message,'error'));</script></body></html>

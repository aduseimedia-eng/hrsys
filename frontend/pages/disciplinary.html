<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Disciplinary Register - KenadHR</title><link rel="stylesheet" href="../css/main.css" /><style>.disciplinary-modal{max-height:none;overflow:visible}.disciplinary-modal .modal-body{overflow:visible}@media(max-width:640px){.disciplinary-modal{max-height:90vh;overflow:hidden}.disciplinary-modal .modal-body{overflow:auto}}</style></head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Disciplinary Register</div><div class="topbar-actions" id="disciplinary-actions"></div></header><main class="main-content"><div class="page-header"><div><h1>Disciplinary Register</h1><p>Confidential record of employee conduct cases, actions, and follow-ups.</p></div><div id="disciplinary-page-action"></div></div><div class="table-container"><table><thead><tr><th>Employee</th><th>Case date</th><th>Category</th><th>Action taken</th><th>Follow-up</th><th>Status</th><th></th></tr></thead><tbody id="disciplinary-body"></tbody></table></div></main></div>
<div id="disciplinary-modal" class="modal-overlay" style="display:none"><div class="modal modal-lg disciplinary-modal" role="dialog" aria-modal="true" aria-labelledby="disciplinary-modal-title"><div class="modal-header"><h3 id="disciplinary-modal-title">Add disciplinary case</h3><button class="modal-close" type="button" onclick="closeCase()" aria-label="Close disciplinary case form">&times;</button></div><div class="modal-body"><input type="hidden" id="dc-id" /><div class="form-grid"><div class="form-group"><label class="form-label required" for="dc-employee">Employee</label><select id="dc-employee" class="form-control form-select" required></select></div><div class="form-group"><label class="form-label required" for="dc-date">Case date</label><input id="dc-date" type="date" class="form-control" required /></div><div class="form-group"><label class="form-label required" for="dc-category">Category</label><select id="dc-category" class="form-control form-select" required><option value="Misconduct">Misconduct</option><option value="Attendance">Attendance</option><option value="Performance">Performance</option><option value="Conduct">Conduct</option><option value="Policy breach">Policy breach</option><option value="Other">Other</option></select></div><div class="form-group"><label class="form-label required" for="dc-action">Action taken</label><input id="dc-action" class="form-control" placeholder="e.g. Written warning" required /></div><div class="form-group"><label class="form-label" for="dc-status">Status</label><select id="dc-status" class="form-control form-select"><option value="open">Open</option><option value="under_review">Under review</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select></div><div class="form-group"><label class="form-label" for="dc-followup">Follow-up date</label><input id="dc-followup" type="date" class="form-control" /></div><div class="form-group span-2"><label class="form-label required" for="dc-summary">Incident summary</label><textarea id="dc-summary" rows="4" class="form-control" placeholder="Record the facts of the incident." required></textarea></div><div class="form-group span-2"><label class="form-label" for="dc-notes">Outcome / follow-up notes</label><textarea id="dc-notes" rows="3" class="form-control"></textarea></div></div></div><div class="modal-footer"><button class="btn btn-outline" type="button" onclick="closeCase()">Cancel</button><button class="btn btn-primary" id="save-case-btn" type="button" onclick="saveCase()">Save case</button></div></div></div>
<script src="../js/api.js"></script><script>
const user=requireAuth();if(!user)throw Error('redirect');if(!['admin','manager'].includes(user.role))location.href=appUrl('/pages/dashboard.html');let rows=[],employees=[];buildSidebar('disciplinary');loadNotifCount();const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));const dateValue=value=>value?String(value).slice(0,10):'';
function closeCase(){document.getElementById('disciplinary-modal').style.display='none';window.dispatchEvent(new Event('hrconnect:request-page-height'))}async function load(){[rows,employees]=await Promise.all([api.get('/disciplinary'),api.get('/employees?limit=1000')]);employees=employees.employees||[];render()}function render(){document.getElementById('disciplinary-body').innerHTML=rows.length?rows.map(row=>`<tr><td><strong>${esc(row.employee_name)}</strong><br><small>${esc(row.employee_code||'')} · ${esc(row.job_title||'')}</small></td><td>${fmt.date(row.case_date)}</td><td>${esc(row.category)}</td><td>${esc(row.action_taken)}</td><td>${row.follow_up_date?fmt.date(row.follow_up_date):'—'}</td><td>${fmt.statusBadge(row.status)}</td><td><button class="btn btn-outline btn-sm" type="button" onclick="openCase(${row.id})">Edit</button></td></tr>`).join(''):'<tr><td colspan="7"><div class="empty-state"><p>No disciplinary cases recorded.</p></div></td></tr>'}
function openCase(id){const record=id?rows.find(row=>Number(row.id)===Number(id)):null;document.getElementById('disciplinary-modal-title').textContent=record?'Edit disciplinary case':'Add disciplinary case';document.getElementById('dc-id').value=record?.id||'';document.getElementById('dc-employee').innerHTML='<option value="">Select employee</option>'+employees.map(employee=>`<option value="${employee.id}" ${Number(record?.employee_id)===Number(employee.id)?'selected':''}>${esc(employee.first_name+' '+employee.last_name)}</option>`).join('');document.getElementById('dc-date').value=dateValue(record?.case_date)||new Date().toISOString().slice(0,10);document.getElementById('dc-category').value=record?.category||'Misconduct';document.getElementById('dc-action').value=record?.action_taken||'';document.getElementById('dc-status').value=record?.status||'open';document.getElementById('dc-followup').value=dateValue(record?.follow_up_date);document.getElementById('dc-summary').value=record?.incident_summary||'';document.getElementById('dc-notes').value=record?.outcome_notes||'';document.getElementById('disciplinary-modal').style.display='flex';window.dispatchEvent(new Event('hrconnect:request-page-height'))}
async function saveCase(){const employee=document.getElementById('dc-employee'),date=document.getElementById('dc-date'),summary=document.getElementById('dc-summary'),action=document.getElementById('dc-action');if(!employee.value||!date.value||!summary.value.trim()||!action.value.trim()){toast('Employee, case date, incident summary, and action taken are required','error');return}const button=document.getElementById('save-case-btn');button.disabled=true;try{const id=document.getElementById('dc-id').value,body={employee_id:Number(employee.value),case_date:date.value,category:document.getElementById('dc-category').value,incident_summary:summary.value.trim(),action_taken:action.value.trim(),status:document.getElementById('dc-status').value,follow_up_date:document.getElementById('dc-followup').value,outcome_notes:document.getElementById('dc-notes').value};if(id)await api.put(`/disciplinary/${id}`,body);else await api.post('/disciplinary',body);closeCase();toast('Disciplinary case saved','success');load()}catch(error){toast(error.message||'Could not save disciplinary case','error')}finally{button.disabled=false}}
const addButton='<button class="btn btn-primary" type="button" onclick="openCase()">Add case</button>';document.getElementById('disciplinary-actions').innerHTML=addButton;document.getElementById('disciplinary-page-action').innerHTML=addButton;document.getElementById('disciplinary-modal').addEventListener('click',event=>{if(event.target===event.currentTarget)closeCase()});load().catch(error=>toast(error.message||'Could not load disciplinary cases','error'));
</script></body></html>

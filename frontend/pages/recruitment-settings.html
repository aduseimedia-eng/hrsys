<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recruitment Settings - KenadHR</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/recruitment-platform.css"></head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Recruitment settings</div></header><main class="main-content">
  <nav id="recruitment-nav"></nav><div id="recruitment-notice" class="recruitment-notice" hidden></div>
  <header class="recruitment-page-header"><div><h1>Recruitment settings</h1><p>Configure the stages that define your candidate process. Default stages protect the core workflow.</p></div><div class="recruitment-actions"><button class="btn btn-primary" id="add-stage">Add stage</button></div></header>
  <section class="recruitment-panel"><div class="recruitment-panel__header"><div><h2>Candidate stages</h2><p>Stage changes are recorded in each candidate’s history.</p></div></div><div id="stage-remove-notice" class="recruitment-notice recruitment-notice--warning" hidden></div><div class="recruitment-table-wrap" style="border:0;border-radius:0"><table><thead><tr><th>Stage</th><th>Order</th><th>Type</th><th></th></tr></thead><tbody id="stage-rows"></tbody></table></div></section>
</main></div>
<div id="stage-modal" class="modal-overlay" style="display:none"><div class="modal"><div class="modal-header"><h3>Add candidate stage</h3><button class="modal-close" type="button" id="close-stage-modal" aria-label="Close">×</button></div><div class="modal-body"><div class="form-group"><label class="form-label required" for="stage-name">Stage name</label><input id="stage-name" class="form-control" placeholder="e.g. Background clearance"></div></div><div class="modal-footer"><button class="btn btn-outline" type="button" id="cancel-stage-modal">Cancel</button><button class="btn btn-primary" type="button" id="save-stage">Add stage</button></div></div></div>
<script src="../js/api.js"></script><script src="../js/recruitment-platform.js"></script><script src="../js/recruitment-settings-page.js"></script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Benefits - KenadHR</title><link rel="stylesheet" href="../css/main.css"><style>
body .benefit-hero::after{display:none}
.benefit-profile{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}.benefit-vitals{padding:22px;border:1px solid var(--border);border-radius:16px;background:var(--bg-surface);box-shadow:var(--shadow-sm)}.benefit-vitals .avatar{width:72px;height:72px;font-size:1.3rem;margin-bottom:14px}.benefit-vitals h2{margin:0 0 3px;font-size:1.05rem}.benefit-vitals p{margin:0;color:var(--text-secondary);font-size:.84rem}.benefit-vitals hr{border:0;border-top:1px solid var(--border);margin:18px 0}.benefit-vital{display:flex;gap:9px;margin:11px 0;color:var(--text-secondary);font-size:.8rem;line-height:1.45}.benefit-hero{position:relative;overflow:hidden;padding:29px 30px;border:1px solid #dce6f7;border-radius:16px;background:linear-gradient(135deg,#fff 0%,#f2f6ff 100%);box-shadow:var(--shadow-sm)}.benefit-hero::after{content:'';position:absolute;width:230px;height:230px;right:-95px;top:-145px;border-radius:50%;background:rgba(57,119,238,.09)}.benefit-hero>*{position:relative;z-index:1}.benefit-eyebrow{margin:0 0 8px;color:var(--brand);font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.benefit-hero h1{margin:0;color:var(--text-primary);font-size:1.7rem;letter-spacing:-.025em}.benefit-hero p{max-width:620px;margin:8px 0 0;color:var(--text-secondary);font-size:.92rem}.benefit-content{margin-top:24px}.benefit-section{margin-bottom:30px}.benefit-section-title{display:flex;align-items:center;gap:10px;color:var(--text-primary);font-size:1.05rem;margin:0 0 13px}.benefit-section-title .benefit-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#eaf1ff;color:var(--brand);font-size:.95rem}.benefit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}.benefit-card{display:flex;flex-direction:column;min-height:230px;padding:18px;border:1px solid var(--border);border-radius:14px;background:var(--bg-surface);box-shadow:var(--shadow-sm);transition:transform var(--duration),box-shadow var(--duration),border-color var(--duration)}.benefit-card:hover{transform:translateY(-2px);border-color:#b9cff7;box-shadow:var(--shadow-md)}.benefit-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:15px}.benefit-card h3{margin:0;color:var(--text-primary);font-size:1rem}.benefit-card p{margin:8px 0;color:var(--text-secondary);font-size:.84rem;line-height:1.55}.benefit-meta{font-size:.78rem;color:var(--text-muted);margin:7px 0}.benefit-meta strong{color:var(--text-secondary);font-weight:700}.benefit-actions{display:flex;gap:8px;margin-top:auto;padding-top:12px}.benefit-actions .btn{flex:1;justify-content:center}.benefit-category,.benefit-status{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;font-size:.7rem;font-weight:800;white-space:nowrap}.benefit-category{background:#edf3ff;color:#3868bd}.benefit-status{background:#e6f6ed;color:#1d8051}.benefit-status.ineligible{background:#f1f3f6;color:#6c778a}.empty{padding:45px;text-align:center;color:var(--text-muted);border:1px dashed var(--border);border-radius:14px;background:var(--bg-surface)}@media(max-width:850px){.benefit-profile{grid-template-columns:1fr}.benefit-vitals{display:none}.benefit-hero{padding:24px}.benefit-hero h1{font-size:1.45rem}}@media(max-width:520px){.benefit-grid{grid-template-columns:1fr}.benefit-hero{padding:21px}.benefit-card{min-height:0}}
</style></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Benefits</div><div class="topbar-actions" id="benefit-actions"></div></header><main class="main-content"><div class="benefit-profile"><aside class="benefit-vitals" id="benefit-vitals"></aside><section><div class="benefit-hero"><h1 id="benefit-hero-name">Benefits</h1><p id="benefits-intro">Explore the benefits available to you.</p><div class="benefit-tabs"><span>Personal</span><span>Job</span><span>Time Off</span><span>Performance</span><span>Training</span><span>Benefits</span></div></div><div class="benefit-content" id="benefit-grid"><div class="loading-state"><div class="spinner"></div></div></div></section></div></main></div>
<div id="benefit-modal" class="modal-overlay" style="display:none"><div class="modal modal-lg"><div class="modal-header"><h3 id="benefit-modal-title">Add benefit</h3><button class="modal-close" onclick="closeBenefitModal()">×</button></div><div class="modal-body"><div class="form-grid"><div class="form-group"><label class="form-label required">Benefit name</label><input id="b-name" class="form-control" maxlength="160" placeholder="e.g. Comprehensive Health Insurance"></div><div class="form-group"><label class="form-label">Category</label><select id="b-category" class="form-control form-select"><option value="health_insurance">Health insurance</option><option value="life_insurance">Life insurance</option><option value="retirement">Retirement</option><option value="wellness">Wellness</option><option value="transport">Transport</option><option value="meal">Meal</option><option value="leave">Leave</option><option value="education">Education</option><option value="other">Other</option></select></div><div class="form-group"><label class="form-label">Provider</label><input id="b-provider" class="form-control" placeholder="Provider or insurer"></div><div class="form-group"><label class="form-label">Eligibility</label><input id="b-eligibility" class="form-control" placeholder="e.g. All permanent staff"></div><div class="form-group"><label class="form-label">Employee monthly cost (₵)</label><input id="b-employee-cost" type="number" min="0" step="0.01" class="form-control" value="0"></div><div class="form-group"><label class="form-label">Employer monthly cost (₵)</label><input id="b-employer-cost" type="number" min="0" step="0.01" class="form-control" value="0"></div><div class="form-group span-2"><label class="form-label">Description</label><textarea id="b-description" class="form-control" rows="3" placeholder="What this benefit covers"></textarea></div><div class="form-group span-2"><label class="form-label">Enrollment information</label><textarea id="b-enrollment" class="form-control" rows="2" placeholder="How employees can access or enroll"></textarea></div><div class="form-group"><label class="form-label"><input id="b-active" type="checkbox" checked> Available to staff</label></div></div></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeBenefitModal()">Cancel</button><button class="btn btn-primary" onclick="saveBenefit()">Save benefit</button></div></div></div>
<script src="../js/api.js"></script><script>
const user=api.getUser();if(!api.getToken()||!user){window.location.href=appUrl('/pages/login.html');throw new Error('redirect')}buildSidebar('benefits');loadNotifCount();let benefits=[],editingId=null;const isHr=['admin','manager'].includes(user.role);
function label(value){return String(value||'other').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}function audienceLabel(value){return({all:'All employees',staff:'Staff',national_service:'National Service Personnel',contractual:'Contractual Staff',internship:'Interns'})[value]||'All employees'}function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const groupSelect=document.createElement('select');groupSelect.id='b-eligible-group';groupSelect.className='form-control form-select';groupSelect.innerHTML='<option value="all">All employees</option><option value="staff">Staff</option><option value="national_service">National Service Personnel</option><option value="contractual">Contractual Staff</option><option value="internship">Interns</option>';const groupWrap=document.createElement('div');groupWrap.className='form-group';groupWrap.innerHTML='<label class="form-label">Available to</label>';groupWrap.appendChild(groupSelect);document.getElementById('b-eligibility').closest('.form-group').before(groupWrap);document.getElementById('b-active').closest('.form-group').innerHTML='<label class="form-label"><input id="b-active" type="checkbox" checked> Active benefit</label><div style="font-size:.78rem;color:var(--text-muted);margin-top:5px">Turn off to hide this benefit from employees.</div>';
function setupProfile(){const fullName=`${user.first_name||''} ${user.last_name||''}`.trim()||'Benefits';document.getElementById('benefit-hero-name').textContent=isHr?'Benefits Administration':fullName;document.getElementById('benefit-vitals').innerHTML=`${avatarEl(user,'lg')}<h2>${safe(fullName)}</h2><p>${safe(user.job_title||user.role||'Employee')}</p><hr><div class="benefit-vital">✉ <span>${safe(user.email||'Email not recorded')}</span></div><div class="benefit-vital">◷ <span>Benefits overview</span></div><div class="benefit-vital">♧ <span>Managed by Human Resources</span></div>`}
function groupTitle(category){return({health_insurance:'Health',life_insurance:'Life & Protection',retirement:'Retirement',wellness:'Wellbeing',transport:'Transport',meal:'Meals',leave:'Leave',education:'Learning',other:'Other Benefits'})[category]||'Other Benefits'}function benefitIcon(category){return({health_insurance:'✚',life_insurance:'♥',retirement:'♙',wellness:'☀',transport:'⌁',meal:'◉',leave:'◷',education:'▤',other:'✦'})[category]||'✦'}function eligible(b){return b.eligible_employment_type==='all'||!b.eligible_employment_type||String(user.employment_type||'staff')===String(b.eligible_employment_type)}
function card(b){const allowed=eligible(b),status=isHr?(b.is_active?'Active':'Inactive'):(allowed?'Available':'Not eligible');return `<article class="benefit-card" style="${b.is_active?'':'opacity:.62'}"><span class="benefit-category">${safe(label(b.category))}</span><span class="benefit-status ${allowed||!b.is_active?'ineligible':''}">${status}</span><h3>${safe(b.name)}</h3>${b.provider?`<div class="benefit-meta">Provided by ${safe(b.provider)}</div>`:''}<p>${safe(b.description||'No description provided.')}</p><div class="benefit-meta"><strong>Available to:</strong> ${safe(audienceLabel(b.eligible_employment_type))}</div>${b.eligibility?`<div class="benefit-meta"><strong>Eligibility:</strong> ${safe(b.eligibility)}</div>`:''}${b.enrollment_info?`<div class="benefit-meta"><strong>Enrolment:</strong> ${safe(b.enrollment_info)}</div>`:''}${Number(b.employee_cost)>0?`<div class="benefit-meta"><strong>Monthly contribution:</strong> ${fmt.currency(b.employee_cost)}</div>`:''}${isHr?`<div class="benefit-actions"><button class="btn btn-outline btn-sm" onclick="openBenefitModal(${b.id})">Edit</button><button class="btn btn-outline btn-sm" onclick="deleteBenefit(${b.id})">Delete</button></div>`:''}</article>`}
async function loadBenefits(){try{benefits=await api.get(`/benefits${isHr?'?include_inactive=true':''}`);document.getElementById('benefits-intro').textContent=isHr?'Create and manage insurance, wellbeing, retirement and other staff benefits.':'Your benefits, eligibility, and enrolment information.';renderBenefits()}catch(e){toast(e.message,'error')}}
function renderBenefits(){const grid=document.getElementById('benefit-grid');if(!benefits.length){grid.innerHTML=`<div class="empty">${isHr?'No benefits yet. Add your first benefit plan.':'No benefits have been made available yet.'}</div>`;return}const groups=benefits.reduce((out,b)=>{(out[b.category]??=[]).push(b);return out},{});grid.innerHTML=Object.entries(groups).map(([category,items])=>`<section class="benefit-section"><h2 class="benefit-section-title"><span class="benefit-icon">${benefitIcon(category)}</span>${groupTitle(category)}</h2><div class="benefit-grid">${items.map(card).join('')}</div></section>`).join('')}
function openBenefitModal(id=null){editingId=id;const b=benefits.find(x=>x.id===id)||{};document.getElementById('benefit-modal-title').textContent=id?'Edit benefit':'Add benefit';['name','provider','eligibility','description'].forEach(k=>document.getElementById('b-'+k).value=b[k]||'');document.getElementById('b-enrollment').value=b.enrollment_info||'';document.getElementById('b-category').value=b.category||'other';document.getElementById('b-eligible-group').value=b.eligible_employment_type||'all';document.getElementById('b-employee-cost').value=Number(b.employee_cost||0);document.getElementById('b-employer-cost').value=Number(b.employer_cost||0);document.getElementById('b-active').checked=b.is_active!==false;document.getElementById('benefit-modal').style.display='flex'}function closeBenefitModal(){document.getElementById('benefit-modal').style.display='none'}
async function saveBenefit(){const body={name:document.getElementById('b-name').value,category:document.getElementById('b-category').value,provider:document.getElementById('b-provider').value,eligibility:document.getElementById('b-eligibility').value,eligible_employment_type:document.getElementById('b-eligible-group').value,description:document.getElementById('b-description').value,enrollment_info:document.getElementById('b-enrollment').value,employee_cost:Number(document.getElementById('b-employee-cost').value||0),employer_cost:Number(document.getElementById('b-employer-cost').value||0),is_active:document.getElementById('b-active').checked};try{editingId?await api.put(`/benefits/${editingId}`,body):await api.post('/benefits',body);closeBenefitModal();toast('Benefit saved','success');loadBenefits()}catch(e){toast(e.message,'error')}}async function deleteBenefit(id){if(!confirm('Delete this benefit?'))return;try{await api.delete(`/benefits/${id}`);toast('Benefit deleted','success');loadBenefits()}catch(e){toast(e.message,'error')}}
function refineBenefitsHero(){const tabs=document.querySelector('.benefit-tabs');tabs?.remove();const title=document.getElementById('benefit-hero-name');title?.insertAdjacentHTML('beforebegin','<div class="benefit-eyebrow">Employee benefits</div>');if(!isHr)return;document.querySelector('.benefit-profile')?.classList.add('benefit-admin-view');document.head.insertAdjacentHTML('beforeend','<style>.benefit-profile.benefit-admin-view{grid-template-columns:minmax(0,1fr)}.benefit-profile.benefit-admin-view .benefit-vitals{display:none}.benefit-hero-actions{display:flex;margin-top:20px}.benefit-hero-actions .btn{min-height:38px;padding:0 15px}</style>');document.querySelector('.benefit-hero')?.insertAdjacentHTML('beforeend','<div class="benefit-hero-actions" id="benefit-page-action"></div>')}
setupProfile();refineBenefitsHero();if(isHr){const addButton='<button class="btn btn-primary btn-sm" onclick="openBenefitModal()">Add Benefit</button>';document.getElementById('benefit-actions').innerHTML=addButton;document.getElementById('benefit-page-action').innerHTML=addButton}loadBenefits();
</script></body></html>

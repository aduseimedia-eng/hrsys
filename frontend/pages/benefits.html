<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Benefits - KenadHR</title><link rel="stylesheet" href="../css/main.css"><style>
.benefit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}.benefit-card{padding:20px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg-surface)}.benefit-card h3{margin:8px 0 6px}.benefit-card p{color:var(--text-secondary);font-size:.88rem;line-height:1.5}.benefit-meta{font-size:.82rem;color:var(--text-muted);margin:8px 0}.benefit-actions{display:flex;gap:8px;margin-top:16px}.benefit-category{display:inline-block;padding:4px 9px;border-radius:99px;background:var(--navy-50);color:var(--navy-800);font-size:.76rem;font-weight:600}.empty{padding:45px;text-align:center;color:var(--text-muted);border:1px dashed var(--border);border-radius:var(--radius-lg)}
</style></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Benefits</div><div class="topbar-actions" id="benefit-actions"></div></header><main class="main-content"><div class="page-header"><div><h1>Benefits</h1><p id="benefits-intro">Explore the benefits available to you.</p></div></div><div id="benefit-grid" class="benefit-grid"><div class="loading-state"><div class="spinner"></div></div></div></main></div>
<div id="benefit-modal" class="modal-overlay" style="display:none"><div class="modal modal-lg"><div class="modal-header"><h3 id="benefit-modal-title">Add benefit</h3><button class="modal-close" onclick="closeBenefitModal()">×</button></div><div class="modal-body"><div class="form-grid"><div class="form-group"><label class="form-label required">Benefit name</label><input id="b-name" class="form-control" maxlength="160" placeholder="e.g. Comprehensive Health Insurance"></div><div class="form-group"><label class="form-label">Category</label><select id="b-category" class="form-control form-select"><option value="health_insurance">Health insurance</option><option value="life_insurance">Life insurance</option><option value="retirement">Retirement</option><option value="wellness">Wellness</option><option value="transport">Transport</option><option value="meal">Meal</option><option value="leave">Leave</option><option value="education">Education</option><option value="other">Other</option></select></div><div class="form-group"><label class="form-label">Provider</label><input id="b-provider" class="form-control" placeholder="Provider or insurer"></div><div class="form-group"><label class="form-label">Eligibility</label><input id="b-eligibility" class="form-control" placeholder="e.g. All permanent staff"></div><div class="form-group"><label class="form-label">Employee monthly cost (₵)</label><input id="b-employee-cost" type="number" min="0" step="0.01" class="form-control" value="0"></div><div class="form-group"><label class="form-label">Employer monthly cost (₵)</label><input id="b-employer-cost" type="number" min="0" step="0.01" class="form-control" value="0"></div><div class="form-group span-2"><label class="form-label">Description</label><textarea id="b-description" class="form-control" rows="3" placeholder="What this benefit covers"></textarea></div><div class="form-group span-2"><label class="form-label">Enrollment information</label><textarea id="b-enrollment" class="form-control" rows="2" placeholder="How employees can access or enroll"></textarea></div><div class="form-group"><label class="form-label"><input id="b-active" type="checkbox" checked> Available to staff</label></div></div></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeBenefitModal()">Cancel</button><button class="btn btn-primary" onclick="saveBenefit()">Save benefit</button></div></div></div>
<script src="../js/api.js"></script><script>
const user=requireAuth();if(!user)throw new Error('redirect');buildSidebar('benefits');loadNotifCount();let benefits=[],editingId=null;const isAdmin=user.role==='admin';
function label(value){return String(value||'other').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadBenefits(){try{benefits=await api.get(`/benefits${isAdmin?'?include_inactive=true':''}`);document.getElementById('benefits-intro').textContent=isAdmin?'Create and manage insurance, wellbeing, retirement and other staff benefits.':'Explore the benefits your HR team has made available.';renderBenefits()}catch(e){toast(e.message,'error')}}
function renderBenefits(){const grid=document.getElementById('benefit-grid');if(!benefits.length){grid.innerHTML=`<div class="empty">${isAdmin?'No benefits yet. Add your first benefit plan.':'No benefits have been made available yet.'}</div>`;return}grid.innerHTML=benefits.map(b=>`<article class="benefit-card" style="${b.is_active?'':'opacity:.62'}"><span class="benefit-category">${safe(label(b.category))}</span><h3>${safe(b.name)}</h3>${b.provider?`<div class="benefit-meta">Provided by ${safe(b.provider)}</div>`:''}<p>${safe(b.description||'No description provided.')}</p>${b.eligibility?`<div class="benefit-meta"><strong>Eligible:</strong> ${safe(b.eligibility)}</div>`:''}${b.enrollment_info?`<div class="benefit-meta"><strong>Access:</strong> ${safe(b.enrollment_info)}</div>`:''}${Number(b.employee_cost)>0?`<div class="benefit-meta"><strong>Your monthly contribution:</strong> ${fmt.currency(b.employee_cost)}</div>`:''}${isAdmin?`<div class="benefit-actions"><button class="btn btn-outline btn-sm" onclick="openBenefitModal(${b.id})">Edit</button><button class="btn btn-outline btn-sm" onclick="deleteBenefit(${b.id})">Delete</button></div>`:''}</article>`).join('')}
function openBenefitModal(id=null){editingId=id;const b=benefits.find(x=>x.id===id)||{};document.getElementById('benefit-modal-title').textContent=id?'Edit benefit':'Add benefit';['name','provider','eligibility','description'].forEach(k=>document.getElementById('b-'+k).value=b[k]||'');document.getElementById('b-enrollment').value=b.enrollment_info||'';document.getElementById('b-category').value=b.category||'other';document.getElementById('b-employee-cost').value=Number(b.employee_cost||0);document.getElementById('b-employer-cost').value=Number(b.employer_cost||0);document.getElementById('b-active').checked=b.is_active!==false;document.getElementById('benefit-modal').style.display='flex'}function closeBenefitModal(){document.getElementById('benefit-modal').style.display='none'}
async function saveBenefit(){const body={name:document.getElementById('b-name').value,category:document.getElementById('b-category').value,provider:document.getElementById('b-provider').value,eligibility:document.getElementById('b-eligibility').value,description:document.getElementById('b-description').value,enrollment_info:document.getElementById('b-enrollment').value,employee_cost:Number(document.getElementById('b-employee-cost').value||0),employer_cost:Number(document.getElementById('b-employer-cost').value||0),is_active:document.getElementById('b-active').checked};try{editingId?await api.put(`/benefits/${editingId}`,body):await api.post('/benefits',body);closeBenefitModal();toast('Benefit saved','success');loadBenefits()}catch(e){toast(e.message,'error')}}async function deleteBenefit(id){if(!confirm('Delete this benefit?'))return;try{await api.delete(`/benefits/${id}`);toast('Benefit deleted','success');loadBenefits()}catch(e){toast(e.message,'error')}}
if(isAdmin)document.getElementById('benefit-actions').innerHTML='<button class="btn btn-primary btn-sm" onclick="openBenefitModal()">Add Benefit</button>';loadBenefits();
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Benefits - KenadHR</title><link rel="stylesheet" href="../css/main.css" /><style>
.benefits-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}.benefit-stat{padding:17px;border:1px solid var(--border);border-radius:12px;background:var(--bg-surface);box-shadow:var(--shadow-sm)}.benefit-stat span{display:block;color:var(--text-muted);font-size:.78rem}.benefit-stat strong{display:block;margin-top:4px;color:var(--text-primary);font-size:1.4rem}.benefit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:15px}.benefit-card{display:flex;flex-direction:column;gap:10px;padding:18px;border:1px solid var(--border);border-radius:14px;background:var(--bg-surface);box-shadow:var(--shadow-sm)}.benefit-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.benefit-card h3{margin:0;font-size:1rem}.benefit-card p{margin:0;color:var(--text-secondary);font-size:.84rem;line-height:1.5}.benefit-tag{display:inline-flex;width:max-content;padding:4px 8px;border-radius:999px;background:#eaf1ff;color:var(--brand);font-size:.7rem;font-weight:750}.benefit-meta{color:var(--text-muted);font-size:.78rem;line-height:1.45}.benefit-actions{display:flex;gap:8px;margin-top:auto;padding-top:5px}.benefit-actions .btn{flex:1}.benefit-modal{max-height:none;overflow:visible}.benefit-modal .modal-body{overflow:visible}@media(max-width:700px){.benefits-summary{grid-template-columns:1fr}.benefit-modal{max-height:90vh;overflow:hidden}.benefit-modal .modal-body{overflow:auto}}
</style></head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Benefits</div><div class="topbar-actions" id="benefit-actions"></div></header><main class="main-content"><div class="page-header"><div><h1 id="benefit-title">Benefits</h1><p id="benefit-intro">Create and manage the benefits available to your team.</p></div><div id="benefit-page-action"></div></div><section class="benefits-summary" id="benefits-summary" aria-live="polite"></section><section class="benefit-grid" id="benefit-grid"><div class="empty-state"><p>Loading benefits…</p></div></section></main></div>
<div id="benefit-modal" class="modal-overlay" style="display:none"><div class="modal modal-lg benefit-modal" role="dialog" aria-modal="true" aria-labelledby="benefit-modal-title"><div class="modal-header"><h3 id="benefit-modal-title">Add benefit</h3><button class="modal-close" type="button" onclick="closeBenefitModal()" aria-label="Close benefit form">&times;</button></div><div class="modal-body"><input id="benefit-id" type="hidden" /><div class="form-grid"><div class="form-group"><label class="form-label required" for="b-name">Benefit name</label><input id="b-name" class="form-control" maxlength="160" placeholder="e.g. Comprehensive Health Insurance" required /></div><div class="form-group"><label class="form-label" for="b-category">Category</label><select id="b-category" class="form-control form-select"><option value="health_insurance">Health insurance</option><option value="life_insurance">Life insurance</option><option value="retirement">Retirement</option><option value="wellness">Wellness</option><option value="transport">Transport</option><option value="meal">Meal</option><option value="leave">Leave</option><option value="education">Education</option><option value="other">Other</option></select></div><div class="form-group"><label class="form-label" for="b-provider">Provider</label><input id="b-provider" class="form-control" placeholder="Provider or insurer" /></div><div class="form-group"><label class="form-label" for="b-eligible-group">Available to</label><select id="b-eligible-group" class="form-control form-select"><option value="all">All employees</option><option value="staff">Staff</option><option value="national_service">National Service Personnel</option><option value="contractual">Contractual Staff</option><option value="internship">Interns</option></select></div><div class="form-group"><label class="form-label" for="b-eligibility">Eligibility details</label><input id="b-eligibility" class="form-control" placeholder="e.g. After probation" /></div><div class="form-group"><label class="form-label" data-currency-label="Employee monthly cost" for="b-employee-cost">Employee monthly cost</label><input id="b-employee-cost" type="number" min="0" step="0.01" data-currency-input class="form-control" value="0" /></div><div class="form-group"><label class="form-label" data-currency-label="Employer monthly cost" for="b-employer-cost">Employer monthly cost</label><input id="b-employer-cost" type="number" min="0" step="0.01" data-currency-input class="form-control" value="0" /></div><div class="form-group"><label class="form-label" for="b-active">Availability</label><select id="b-active" class="form-control form-select"><option value="true">Active and visible</option><option value="false">Inactive</option></select></div><div class="form-group span-2"><label class="form-label" for="b-description">Description</label><textarea id="b-description" class="form-control" rows="3" placeholder="What this benefit covers"></textarea></div><div class="form-group span-2"><label class="form-label" for="b-enrollment">Enrollment information</label><textarea id="b-enrollment" class="form-control" rows="2" placeholder="How employees can access or enroll"></textarea></div></div></div><div class="modal-footer"><button class="btn btn-outline" type="button" onclick="closeBenefitModal()">Cancel</button><button class="btn btn-primary" id="save-benefit-btn" type="button" onclick="saveBenefit()">Save benefit</button></div></div></div>
<script src="../js/api.js"></script><script>
const user=api.getUser();if(!api.getToken()||!user){location.href=appUrl('/pages/login.html');throw Error('redirect')}const canManage=['admin','manager'].includes(user.role);let benefits=[];buildSidebar('benefits');loadNotifCount();const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));const label=value=>String(value||'Other').replace(/_/g,' ').replace(/\b\w/g,char=>char.toUpperCase());const audience=value=>({all:'All employees',staff:'Staff',national_service:'National Service Personnel',contractual:'Contractual Staff',internship:'Interns'})[value]||'All employees';
function closeBenefitModal(){document.getElementById('benefit-modal').style.display='none';window.dispatchEvent(new Event('hrconnect:request-page-height'))}function render(){const active=benefits.filter(item=>item.is_active),employeeType=String(user.employment_type||'staff'),available=active.filter(item=>item.eligible_employment_type==='all'||item.eligible_employment_type===employeeType);document.getElementById('benefits-summary').innerHTML=canManage?`<article class="benefit-stat"><span>Total benefits</span><strong>${benefits.length}</strong></article><article class="benefit-stat"><span>Active benefits</span><strong>${active.length}</strong></article><article class="benefit-stat"><span>Inactive benefits</span><strong>${benefits.length-active.length}</strong></article>`:`<article class="benefit-stat"><span>Available to you</span><strong>${available.length}</strong></article>`;const rows=canManage?benefits:available;document.getElementById('benefit-grid').innerHTML=rows.length?rows.map(item=>`<article class="benefit-card" style="${item.is_active?'':'opacity:.62'}"><div class="benefit-card-header"><span class="benefit-tag">${esc(label(item.category))}</span><span>${canManage?fmt.statusBadge(item.is_active?'active':'inactive'):'Available'}</span></div><h3>${esc(item.name)}</h3>${item.provider?`<div class="benefit-meta">Provided by ${esc(item.provider)}</div>`:''}<p>${esc(item.description||'No description provided.')}</p><div class="benefit-meta"><strong>Available to:</strong> ${esc(audience(item.eligible_employment_type))}</div>${item.eligibility?`<div class="benefit-meta"><strong>Eligibility:</strong> ${esc(item.eligibility)}</div>`:''}${item.enrollment_info?`<div class="benefit-meta"><strong>Enrolment:</strong> ${esc(item.enrollment_info)}</div>`:''}${Number(item.employee_cost)>0?`<div class="benefit-meta"><strong>Employee contribution:</strong> ${fmt.currency(item.employee_cost)}/month</div>`:''}${canManage?`<div class="benefit-actions"><button class="btn btn-outline btn-sm" type="button" onclick="openBenefitModal(${item.id})">Edit</button><button class="btn btn-outline btn-sm" type="button" onclick="deleteBenefit(${item.id})">Delete</button></div>`:''}</article>`).join(''):`<div class="empty-state"><p>${canManage?'No benefits yet. Add your first benefit.':'No benefits are available to you yet.'}</p></div>`}
async function loadBenefits(){try{benefits=await api.get(`/benefits${canManage?'?include_inactive=true':''}`);document.getElementById('benefit-title').textContent=canManage?'Benefits administration':'My benefits';document.getElementById('benefit-intro').textContent=canManage?'Create and manage the benefits available to your team.':'Review benefits available to you and how to enroll.';render()}catch(error){toast(error.message||'Could not load benefits','error')}}function openBenefitModal(id){const item=id?benefits.find(benefit=>Number(benefit.id)===Number(id)):null;document.getElementById('benefit-modal-title').textContent=item?'Edit benefit':'Add benefit';document.getElementById('benefit-id').value=item?.id||'';document.getElementById('b-name').value=item?.name||'';document.getElementById('b-category').value=item?.category||'other';document.getElementById('b-provider').value=item?.provider||'';document.getElementById('b-eligible-group').value=item?.eligible_employment_type||'all';document.getElementById('b-eligibility').value=item?.eligibility||'';document.getElementById('b-employee-cost').value=Number(item?.employee_cost||0);document.getElementById('b-employer-cost').value=Number(item?.employer_cost||0);document.getElementById('b-active').value=item?.is_active===false?'false':'true';document.getElementById('b-description').value=item?.description||'';document.getElementById('b-enrollment').value=item?.enrollment_info||'';document.getElementById('benefit-modal').style.display='flex';document.getElementById('b-name').focus();window.dispatchEvent(new Event('hrconnect:request-page-height'))}
async function saveBenefit(){const name=document.getElementById('b-name'),employeeCost=document.getElementById('b-employee-cost'),employerCost=document.getElementById('b-employer-cost');if(!name.value.trim()){toast('Enter a benefit name','error');name.focus();return}if([employeeCost,employerCost].some(input=>!Number.isFinite(Number(input.value||0))||Number(input.value||0)<0)){toast('Benefit costs must be valid non-negative amounts','error');return}const button=document.getElementById('save-benefit-btn'),id=document.getElementById('benefit-id').value,body={name:name.value.trim(),category:document.getElementById('b-category').value,provider:document.getElementById('b-provider').value,eligibility:document.getElementById('b-eligibility').value,eligible_employment_type:document.getElementById('b-eligible-group').value,description:document.getElementById('b-description').value,enrollment_info:document.getElementById('b-enrollment').value,employee_cost:Number(employeeCost.value||0),employer_cost:Number(employerCost.value||0),is_active:document.getElementById('b-active').value==='true'};button.disabled=true;try{if(id)await api.put(`/benefits/${id}`,body);else await api.post('/benefits',body);closeBenefitModal();toast('Benefit saved','success');loadBenefits()}catch(error){toast(error.message||'Could not save benefit','error')}finally{button.disabled=false}}async function deleteBenefit(id){if(!confirm('Delete this benefit?'))return;try{await api.delete(`/benefits/${id}`);toast('Benefit deleted','success');loadBenefits()}catch(error){toast(error.message||'Could not delete benefit','error')}}if(canManage){const button='<button class="btn btn-primary" type="button" onclick="openBenefitModal()">Add benefit</button>';document.getElementById('benefit-actions').innerHTML=button;document.getElementById('benefit-page-action').innerHTML=button}document.getElementById('benefit-modal').addEventListener('click',event=>{if(event.target===event.currentTarget)closeBenefitModal()});loadBenefits();
</script></body></html>

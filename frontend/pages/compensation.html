<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salary Management</title><link rel="stylesheet" href="../css/main.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Salary Management</div></header><main class="main-content"><div class="page-header"><div><h1>Salary Management</h1><p>Set current compensation and preserve salary history.</p></div><button id="set" class="btn btn-primary">Set Salary</button></div><div style="display:flex;gap:10px;margin-bottom:16px"><input id="q" class="form-control" placeholder="Search employee"><select id="state" class="form-control form-select"><option value="current">Current salary</option><option value="previous">Previous salary</option><option value="all">All records</option></select></div><div class="table-container"><table><thead><tr><th>Staff ID</th><th>Employee</th><th>Department</th><th>Basic</th><th>Allowances</th><th>Gross</th><th>Employee SSNIT</th><th>Employer SSNIT</th><th>Net Salary</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><div id="modal" class="modal-overlay" style="display:none"><div class="modal"><div class="modal-header"><h3>Set Salary</h3><button id="close" class="modal-close" type="button">×</button></div><div class="modal-body"><div class="form-grid"><div class="form-group span-2"><label class="form-label">Employee</label><select id="emp" class="form-control form-select"></select></div><div class="form-group"><label class="form-label">Basic salary</label><input id="basic" type="number" min="0" class="form-control"></div><div class="form-group"><label class="form-label">Allowances</label><input id="allow" type="number" min="0" value="0" class="form-control"></div><div class="form-group"><label class="form-label">Other deductions</label><input id="other" type="number" min="0" value="0" class="form-control"></div><div class="form-group"><label class="form-label">Effective from</label><input id="from" type="date" class="form-control"></div></div><div id="preview"></div></div><div class="modal-footer"><button id="cancel" class="btn btn-outline">Cancel</button><button id="save" class="btn btn-primary">Save salary</button></div></div></div><script src="../js/api.js"></script><script>const u=requireAuth(),$=x=>document.getElementById(x),n=x=>Number(x||0);if(!u||u.role!=='admin')location.href=appUrl('/pages/workspace.html#payroll');buildSidebar('compensation');let employees=[];function close(){modal.style.display='none'}function go(id){let r='compensation-detail?employee_id='+id;if(isEmbeddedWorkspacePage())parent.postMessage({type:'hrconnect:navigate',route:r},location.origin);else location.href=appUrl('/pages/workspace.html#'+r)}async function load(){try{let r=await api.get('/compensation?'+new URLSearchParams({status:state.value,search:q.value}));rows.innerHTML=r.map(x=>`<tr><td>${x.employee_code||'—'}</td><td>${x.first_name} ${x.last_name}</td><td>${x.department_name||'—'}</td><td>${x.id?fmt.currency(x.basic_salary):'—'}</td><td>${x.id?fmt.currency(x.allowances):'—'}</td><td>${x.id?fmt.currency(x.gross_salary):'—'}</td><td>${x.id?fmt.currency(x.employee_ssnit):'—'}</td><td>${x.id?fmt.currency(x.employer_ssnit):'—'}</td><td>${x.id?fmt.currency(x.estimated_net_salary):'—'}</td><td>${x.status?fmt.statusBadge(x.status):'Not set'}</td><td><button class="btn btn-outline btn-sm" data-id="${x.employee_id}">View</button></td></tr>`).join('')||'<tr><td colspan="11">No salary records found.</td></tr>'}catch(e){rows.innerHTML='<tr><td colspan="11">'+e.message+'</td></tr>'}}async function pre(){let r=await api.post('/compensation/preview',{basic_salary:n(basic.value),allowances:n(allow.value),other_deductions:n(other.value)});preview.innerHTML=`<p><b>Gross:</b> ${fmt.currency(r.gross)} · <b>Employee SSNIT:</b> ${fmt.currency(r.ssnitEmployee)} · <b>Employer SSNIT:</b> ${fmt.currency(r.ssnitEmployer)} · <b>PAYE:</b> ${fmt.currency(r.payeTax)} · <b>Estimated Net:</b> ${fmt.currency(r.net)}</p>`}set.onclick=()=>{from.value=new Date().toISOString().slice(0,10);basic.value='';allow.value=0;other.value=0;modal.style.display='flex';pre()};close.onclick=cancel.onclick=close;[basic,allow,other].forEach(x=>x.oninput=pre);save.onclick=async()=>{try{await api.post('/compensation',{employee_id:n(emp.value),basic_salary:n(basic.value),allowances:n(allow.value),other_deductions:n(other.value),effective_from:from.value});close();load()}catch(e){toast(e.message,'error')}};rows.onclick=e=>{let b=e.target.closest('button');if(b)go(b.dataset.id)};q.oninput=load;state.onchange=load;(async()=>{let e=await api.get('/employees?limit=1000');employees=e.employees;emp.innerHTML=employees.map(x=>`<option value="${x.id}">${x.first_name} ${x.last_name}</option>`).join('');load()})()</script></body></html>

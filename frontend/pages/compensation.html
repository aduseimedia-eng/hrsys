<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salary Management - KenadHR</title><link rel="stylesheet" href="../css/main.css"><style>.salary-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.salary-tools .form-control{max-width:210px}.salary-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.salary-stat{padding:15px;border:1px solid var(--border);border-radius:12px;background:var(--bg-surface)}.salary-stat span{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;font-weight:700}.salary-stat strong{display:block;font-size:1.2rem;margin-top:6px}.salary-preview{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.salary-preview div{padding:9px;background:var(--bg-subtle);border-radius:8px;font-size:.8rem}.salary-preview b{display:block;margin-top:3px}@media(max-width:760px){.salary-summary{grid-template-columns:repeat(2,1fr)}.salary-tools .form-control{max-width:none;flex:1}.salary-preview{grid-template-columns:1fr}}</style></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><header class="topbar"><div class="topbar-title">Salary Management</div></header><main class="main-content"><div class="page-header"><div><h1>Salary Management</h1><p>Set current compensation and preserve each employee’s salary history.</p></div><button class="btn btn-primary" onclick="openSalary()">Set Salary</button></div><div class="salary-tools"><input id="search" class="form-control" placeholder="Search employee" oninput="load()"><select id="department" class="form-control form-select" onchange="load()"><option value="">All departments</option></select><select id="status" class="form-control form-select" onchange="load()"><option value="current">Current salary</option><option value="previous">Previous salary</option><option value="all">All records</option></select></div><section id="salary-summary" class="salary-summary"></section><div class="table-container"><table><thead><tr><th>Staff ID</th><th>Employee</th><th>Department</th><th>Basic</th><th>Allowances</th><th>Gross</th><th>Employee SSNIT</th><th>Employer SSNIT</th><th>Net salary</th><th>Effective date</th><th>Status</th><th>Actions</th></tr></thead><tbody id="salary-body"></tbody></table></div></main></div><div id="salary-modal" class="modal-overlay" style="display:none"><div class="modal modal-lg"><div class="modal-header"><h3>Set Salary</h3><button class="modal-close" type="button" onclick="closeSalary()">×</button></div><div class="modal-body"><div class="form-grid"><div class="form-group span-2"><label class="form-label">Employee</label><select id="employee" class="form-control form-select"></select></div><div class="form-group"><label class="form-label">Basic salary</label><input id="basic" type="number" min="0" class="form-control" oninput="preview()"></div><div class="form-group"><label class="form-label">Allowances</label><input id="allowances" type="number" min="0" value="0" class="form-control" oninput="preview()"></div><div class="form-group"><label class="form-label">Other deductions</label><input id="other" type="number" min="0" value="0" class="form-control" oninput="preview()"></div><div class="form-group"><label class="form-label">Effective from</label><input id="effective" type="date" class="form-control"></div></div><div id="salary-preview" class="salary-preview"></div></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeSalary()">Cancel</button><button class="btn btn-primary" onclick="saveSalary()">Save salary</button></div></div></div><script src="../js/api.js"></script><script>const user=requireAuth();if(!user)throw Error('redirect');if(user.role!=='admin'){location.href=appUrl('/pages/workspace.html#payroll');throw Error('restricted')}buildSidebar('compensation');loadNotifCount();let employees=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=v=>Number(v||0);async function setup(){const [e,d]=await Promise.all([api.get('/employees?limit=1000'),api.get('/departments')]);employees=e.employees;document.getElementById('employee').innerHTML=employees.map(x=>`<option value="${x.id}">${esc(x.first_name)} ${esc(x.last_name)}</option>`).join('');document.getElementById('department').innerHTML+=[...d].map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');load()}async function load(){const q=new URLSearchParams({status:status.value,search:search.value});if(department.value)q.set('department_id',department.value);const rows=await api.get('/compensation?'+q);const current=rows.filter(x=>x.status==='current');document.getElementById('salary-summary').innerHTML=[['Current salaries',current.length],['Gross payroll',fmt.currency(current.reduce((s,x)=>s+n(x.gross_salary),0))],['Employee SSNIT',fmt.currency(current.reduce((s,x)=>s+n(x.employee_ssnit),0))],['Employer SSNIT',fmt.currency(current.reduce((s,x)=>s+n(x.employer_ssnit),0))]].map(x=>`<article class="salary-stat"><span>${x[0]}</span><strong>${x[1]}</strong></article>`).join('');salary-body.innerHTML=rows.length?rows.map(x=>`<tr><td>${esc(x.employee_code||'—')}</td><td><strong>${esc(x.first_name)} ${esc(x.last_name)}</strong></td><td>${esc(x.department_name||'Unassigned')}</td><td>${x.id?fmt.currency(x.basic_salary):'—'}</td><td>${x.id?fmt.currency(x.allowances):'—'}</td><td>${x.id?fmt.currency(x.gross_salary):'—'}</td><td>${x.id?fmt.currency(x.employee_ssnit):'—'}</td><td>${x.id?fmt.currency(x.employer_ssnit):'—'}</td><td>${x.id?fmt.currency(x.estimated_net_salary):'—'}</td><td>${x.effective_from||'—'}</td><td>${x.status?fmt.statusBadge(x.status):'Not set'}</td><td><button class="btn btn-outline btn-sm" onclick="history(${x.employee_id})">View</button> <button class="btn btn-outline btn-sm" onclick="openSalary(${x.employee_id})">Update</button></td></tr>`).join(''):'<tr><td colspan="12"><div class="empty-state"><p>No salary records found.</p></div></td></tr>'}function openSalary(id){employee.value=id||employees[0]?.id||'';basic.value='';allowances.value=0;other.value=0;effective.value=new Date().toISOString().slice(0,10);salaryModal.style.display='flex';preview()}function closeSalary(){salaryModal.style.display='none'}async function preview(){try{const r=await api.post('/compensation/preview',{basic_salary:basic.value||0,allowances:allowances.value||0,other_deductions:other.value||0});salaryPreview.innerHTML=[['Gross salary',r.gross],['Employee SSNIT (5.5%)',r.ssnitEmployee],['Employer SSNIT (13%)',r.ssnitEmployer],['Tier 1 / SSNIT (13.5%)',r.pensionTier1],['Tier 2 (5%)',r.pensionTier2],['PAYE',r.payeTax],['Other deductions',r.other],['Estimated net salary',r.net]].map(x=>`<div>${x[0]}<b>${fmt.currency(x[1])}</b></div>`).join('')}catch(e){}}async function saveSalary(){try{await api.post('/compensation',{employee_id:Number(employee.value),basic_salary:Number(basic.value),allowances:Number(allowances.value),other_deductions:Number(other.value),effective_from:effective.value});closeSalary();toast('Salary record saved','success');load()}catch(e){toast(e.message,'error')}}async function history(id){const r=await api.get('/compensation/'+id);const lines=r.records.map(x=>`<tr><td>${x.effective_from}</td><td>${x.effective_to||'Current'}</td><td>${fmt.currency(x.basic_salary)}</td><td>${fmt.currency(x.gross_salary)}</td><td>${fmt.statusBadge(x.status)}</td></tr>`).join('');const o=document.createElement('div');o.className='modal-overlay';o.innerHTML=`<div class="modal"><div class="modal-header"><h3>${esc(r.employee.first_name)} ${esc(r.employee.last_name)} — Salary history</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button></div><div class="modal-body"><div class="table-container"><table><thead><tr><th>From</th><th>To</th><th>Basic</th><th>Gross</th><th>Status</th></tr></thead><tbody>${lines||'<tr><td colspan="5">No history</td></tr>'}</tbody></table></div></div></div>`;document.body.appendChild(o)}setup().catch(e=>toast(e.message,'error'));</script></body></html>
